function itemHaystack(it) {
  return [it.item_no, it.description, it.uom, it.section, it.remarks, it.version]
    .filter(Boolean).join(' ').toLowerCase();

// "Search anywhere": every space-separated token must appear somewhere in the
// item (any field, any position — start / middle / end). Empty query matches.
function itemMatchesSearch(it, query) {
  const q = (query||'').trim().toLowerCase();
  if (!q) return true;
  const hay = itemHaystack(it);
  return q.split(/\s+/).every(tok => hay.includes(tok));
}

function onAICheckboxToggle(checkbox, key) {
  if (checkbox.checked) {
    const parts = splitKey(key);
    const src = allSelectableItems().find(it=>it.item_no===parts[0] && it.version===parts[1]);
    if (!src) return;
    const row = checkbox.closest('tr');
    const qtyInput = row.querySelector('.qty-input');
    const qty = qtyInput ? (parseFloat(qtyInput.value)||1) : 1;
    AI.selected[key] = {
      item_no: src.item_no, version: src.version, description: src.description,
      uom: src.uom, rate: src.rate, qty: qty, section: src.section, remarks:'', isCustom: src.version==='NONSOR'
    };
    delete AI.qtyDraft[key];
    row.classList.add('ai-row-selected');
  } else {
    const row = checkbox.closest('tr');
    const qtyInput = row.querySelector('.qty-input');
    if (qtyInput) AI.qtyDraft[key] = parseFloat(qtyInput.value)||1;
    delete AI.selected[key];
    row.classList.remove('ai-row-selected');
  }
  renderAISelectedPanel();
}
function onAIRowQtyInput(key, val) {
  const qty = parseFloat(val);
  if (AI.selected[key]) {
    AI.selected[key].qty = isNaN(qty) ? 0 : qty;

  } else {
    AI.qtyDraft[key] = isNaN(qty) ? 1 : qty;
  }
}
function aiStepQty(key, delta) {

async function nonSorTemplateDownload(){

async function nonSorBulkUpload(evt, context){
  const file = evt.target.files[0]; evt.target.value='';
  if (!file) return;
  const status = document.getElementById('ns-bulk-status');
  const say = (html)=>{ if(status) status.innerHTML = html; };
  say('<span class="spinner dark"></span> Reading the file…');
  try {
    const X = await ensureSheetJS();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    const grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false, defval:''});

    // Find the header wherever it sits — the template has title rows above it,
    // and people add their own notes, so a fixed row index would be brittle.
    const hIdx = grid.findIndex(r=> r.some(c=>/^(item\s*no|material\s*\/?\s*service\s*no)/i.test(String(c).trim())));
    if (hIdx<0) throw new Error('Could not find the header row. Keep the row starting with "Item No" from the template.');
    const H = grid[hIdx].map(c=>String(c).trim());
    const ci = {
      no:   H.findIndex(c=>/^(item\s*no|material\s*\/?\s*service\s*no)/i.test(c)),
      desc: H.findIndex(c=>/description/i.test(c)),
      uom:  H.findIndex(c=>/uom|unit/i.test(c)),
      rate: H.findIndex(c=>/rate|price|amount/i.test(c)),
      sec:  H.findIndex(c=>/section|type/i.test(c)),
      rem:  H.findIndex(c=>/remark|note/i.test(c)),
    };

    const cell = (row,i)=> i>=0 ? String(row[i]==null?'':row[i]).trim() : '';
    const items = []; const missingDesc = []; const seen = new Set(); const dupInFile = [];
    for (let r=hIdx+1; r<grid.length; r++){
      const row = grid[r];
      const item_no = cell(row, ci.no);
      if (!item_no) continue;
      const description = cell(row, ci.desc);
      if (!description) { missingDesc.push(item_no); continue; }
      if (seen.has(item_no)) { dupInFile.push(item_no); continue; }
      seen.add(item_no);
      let section = cell(row, ci.sec).toLowerCase();
      section = /o&m|^om$|service/.test(section) ? 'om' : 'supply';
      items.push({ item_no, description, uom: cell(row, ci.uom),
        rate: parseFloat(String(cell(row, ci.rate)).replace(/[₹,\s]/g,''))||0,
        section, remarks: cell(row, ci.rem), addedBy: ST.user.id });
    }
    if (!items.length) throw new Error('No rows with an item number were found.');

    // Items go in one at a time through the SAME endpoint the single-item form
    // uses, so catalog rules are enforced in exactly one place: an item number
    // already in the catalog is rejected there, never overwritten. Six at a
    // time keeps a 100-row upload to a few seconds without flooding the
    // backend.
    const added = []; const already = []; const failed = [];
    let done = 0;
    const worker = async (queue)=>{
      for(;;){
        const it = queue.shift(); if (!it) return;
        try {
          const res = await apiPost({action:'addNonSOR', item:it});
          if (res.ok) added.push(it);
          else if (/already exists/i.test(res.error||'')) already.push(it.item_no);
          else failed.push(it.item_no+' ('+(res.error||'failed')+')');
        } catch(e){ failed.push(it.item_no+' ('+(e.message||'network error')+')'); }
        done++;
        say('<span class="spinner dark"></span> Adding… '+done+' of '+items.length);
      }
    };
    const queue = items.slice();
    await Promise.all([1,2,3,4,5,6].map(()=>worker(queue)));

    // Update the cache in place rather than refetching the whole catalog.
    ST.nonSorCache = ST.nonSorCache || [];
    added.forEach(it=> ST.nonSorCache.push({
      item_no:it.item_no, description:it.description, uom:it.uom, rate:it.rate,
      section:it.section, remarks:it.remarks, addedBy:ST.user.id,
      addedAt:new Date().toISOString(), version:'NONSOR'}));

    const bits = [`<b>${added.length}</b> item${added.length===1?'':'s'} added`];
    if (already.length)    bits.push(`${already.length} already in the catalog`);
    if (dupInFile.length)  bits.push(`${dupInFile.length} repeated in the file`);
    if (missingDesc.length)bits.push(`${missingDesc.length} with no description`);
    if (failed.length)     bits.push(`<span class="error-text">${failed.length} failed</span>`);
    let html = `<div class="ok-text">${bits.join(' · ')}</div>`;
    const skipped = [].concat(already, dupInFile, missingDesc).slice(0,25);
    if (skipped.length) html += `<div class="text-sm text-muted mt-1">Skipped: ${skipped.map(escapeHtml).join(', ')}${
      (already.length+dupInFile.length+missingDesc.length)>25?' …':''}</div>`;
    if (failed.length) html += `<div class="text-sm error-text mt-1">${failed.slice(0,10).map(escapeHtml).join('<br>')}</div>`;
    say(html);

    toast(added.length ? `${added.length} Non-SOR item${added.length===1?'':'s'} added.`
                       : 'Nothing new to add — every item was already in the catalog.',
          added.length ? 'ok' : 'warn', 5000);
    if (document.getElementById('rates-nonsor-body')) renderRatesNonSORTable();
    if (document.getElementById('ai-results-body')) renderAIResults();
  } catch(err){
    say(`<span class="error-text">${escapeHtml(err.message||'Upload failed')}</span>`);
  }
}

async function submitNonSOR(context, origItemNo) {
  const item_no = document.getElementById('ns-itemno').value.trim();
  const description = document.getElementById('ns-desc').value.trim();
  const uom = document.getElementById('ns-uom').value.trim();
  const rate = parseFloat(document.getElementById('ns-rate').value)||0;
  const section = document.querySelector('#ns-section-pills .radio-pill.sel').dataset.sec;
  const remarks = document.getElementById('ns-remarks').value.trim();
  const err = document.getElementById('ns-error');
  err.style.display='none';
  if (!item_no || !description) { err.textContent='Material/Service Number and Description are required.'; err.style.display='block'; return; }
  try {
    let res;
    if (origItemNo) {
      res = await apiPost({action:'updateNonSOR', item:{item_no, origItemNo, description, uom, rate, section, remarks}, actingRole: ST.user.role});
    } else {
      res = await apiPost({action:'addNonSOR', item:{item_no, description, uom, rate, section, remarks, addedBy: ST.user.id}});
    }
    if (!res.ok) { err.textContent = res.error||'Failed to save.'; err.style.display='block'; return; }
    if (origItemNo) {
      const idx = ST.nonSorCache.findIndex(i=>i.item_no===origItemNo);
      if (idx>-1) ST.nonSorCache[idx] = {item_no, description, uom, rate, section, remarks, addedBy:ST.nonSorCache[idx].addedBy, addedAt:ST.nonSorCache[idx].addedAt, version:'NONSOR'};
    } else {
      ST.nonSorCache.push({item_no, description, uom, rate, section, remarks, addedBy:ST.user.id, addedAt:new Date().toISOString(), version:'NONSOR'});
      if (context==='ai') {
        const key = item_no+'__NONSOR';
        AI.selected[key] = {item_no, version:'NONSOR', description, uom, rate, qty:1, section, remarks, isCustom:true};
        renderAISelectedPanel();
      }
    }
    closeModal();
    toast(origItemNo?'Non-SOR item updated.':'Non-SOR item added.', 'ok');
    if (document.getElementById('ai-results-body')) renderAIResults();
    if (document.getElementById('rates-nonsor-body')) renderRatesNonSORTable();
  } catch(e) { err.textContent = e.message; err.style.display='block'; }
}

function goToStep3() {
  const keys = Object.keys(AI.selected);
  if (!keys.length && !ST.currentItems.length) { toast('Select at least one item before continuing.', 'warn'); return; }
  const zeroQty = keys.filter(k => !AI.selected[k].qty || AI.selected[k].qty<=0);
  if (zeroQty.length) { toast(`${zeroQty.length} selected item(s) have a quantity of 0 — set a valid quantity or remove them.`, 'warn'); return; }
  keys.forEach(key => ST.currentItems.push(AI.selected[key]));
  AI.selected = {};
  const e = ST.currentEstimate;
  e.sorVersions = [...new Set([...(e.sorVersions||[]), ...AI.checkedVersions])];
  renderEstimateWorkspace(null, true);
}

async function deleteNonSORItem(item_no) {
  if (!isAdmin()) return;
  try {
    const res = await apiPost({action:'deleteNonSOR', item_no, actingRole: ST.user.role});
    if (!res.ok) { toast(res.error||'Delete failed', 'err'); return; }
    ST.nonSorCache = ST.nonSorCache.filter(i=>i.item_no!==item_no);
    closeModal();
    toast('Non-SOR item deleted.', 'ok');
    if (document.getElementById('rates-nonsor-body')) renderRatesNonSORTable();
    if (document.getElementById('ai-results-body')) renderAIResults();
  } catch(e) { toast(e.message, 'err'); }
}

async function renderEstimateWorkspace(id, fromStep2=false) {
  if (id && !fromStep2) {

    try {

      if (!res.ok) { toast(res.error||'Could not load estimate', 'err'); navigateTo('dashboard'); return; }
      ST.currentEstimate = normalizeLoadedEstimate(res.estimate);

// When an estimate is opened, pull only the SOR versions IT uses — not every
// version in the system.
function loadSorVersionsForEstimate(e){
  const vs = (e && Array.isArray(e.sorVersions)) ? e.sorVersions.filter(Boolean) : [];
  vs.forEach(v => { ensureSorVersionLoaded(v); });
}

function normalizeLoadedEstimate(e) {
  loadSorVersionsForEstimate(e);          // fetch only the versions this estimate uses
  e.addCharge = e.addCharge || {supply:'no', project:'no', nonsor_supply:'no'};
  e.settings = e.settings || {};
  e.progress = e.progress || defaultProgress();
  if (!e.progress.stages) e.progress.stages = defaultProgress().stages;
  for (let i=1;i<=25;i++) {
    if (!e.progress.stages[i]) e.progress.stages[i] = {done:false, remarks:'', link:''};
    else if (e.progress.stages[i].link === undefined) e.progress.stages[i].link = '';
  }
  if (!e.progress.bills) e.progress.bills = [];
  if (!e.progress.orderDetails) e.progress.orderDetails = defaultOrderDetails();
  else e.progress.orderDetails = {...defaultOrderDetails(), ...e.progress.orderDetails};
  e.progressImages = e.progressImages || [];
  e.status = e.status || 'draft';
  e.landCompChargePct = e.landCompChargePct || 15;
  if (!Array.isArray(e.pmoPrEntries)) e.pmoPrEntries = defaultPmoPrEntries();
  while (e.pmoPrEntries.length < PMO_PR_SLOTS) e.pmoPrEntries.push({label:'', number:''});
  e.pmoPrEntries = e.pmoPrEntries.slice(0,PMO_PR_SLOTS);
  if (!e.prSettings) e.prSettings = defaultPrSettings();
  else e.prSettings = {...defaultPrSettings(), ...e.prSettings};
  return e;
}

function effectiveRates() {
  const r = {...ST.chargeRates, ...(ST.currentEstimate.settings||{})};
  // For R&M works, Freight & Insurance defaults to 0% unless explicitly set.
  if (ST.currentEstimate.estimateType === 'rm' &&
      !(ST.currentEstimate.settings && ST.currentEstimate.settings.freightInsurance != null)) {
    r.freightInsurance = 0;
  }
  return r;
}

// ── Section key → {filterFn, acKey, label, calcSection} ──
function sectionConfig(key) {
  switch(key) {
    case 'supply': return {items: ST.currentItems.filter(it=>!it.isCustom && it.section==='supply'), acKey:'supply', title:'Supply Material', hasAC:true, hasFI:true};
    case 'project': return {items: ST.currentItems.filter(it=>!it.isCustom && it.section==='project'), acKey:'project', title:'Project Services (ETC Part)', hasAC:true, hasFI:false};
    case 'om': return {items: ST.currentItems.filter(it=>!it.isCustom && it.section==='om'), acKey:null, title:'O&M Services', hasAC:false, hasFI:false};
    case 'nonsor_supply': return {items: ST.currentItems.filter(it=>it.isCustom && it.section==='supply'), acKey:'nonsor_supply', title:'Non-SOR Materials', hasAC:true, hasFI:true};
    case 'nonsor_om': return {items: ST.currentItems.filter(it=>it.isCustom && it.section==='om'), acKey:null, title:'Non-SOR Services', hasAC:false, hasFI:false};
  }
}

function acPill(key, val, readOnly) {
  const e = ST.currentEstimate;

function setACValue(key, val) {

    const vals=['yes','no','na']; el.classList.toggle('sel', vals[i]===val);
  });

function sectionRowHtml(it, key, cfg, readOnly, srNo) {
  const idx = ST.currentItems.indexOf(it);
  const c = calcItem(it, effectiveRates(), cfg.acKey);
  return `<tr data-idx="${idx}">
    <td class="num-cell" style="color:var(--steel-600)">${srNo!=null?srNo+1:''}</td>
    <td class="mono">${escapeHtml(it.item_no)}</td>
    <td>${escapeHtml(it.description)}</td>
    <td>${escapeHtml(it.uom)}</td>
    <td><div class="qty-stepper"><button type="button" tabindex="-1" ${readOnly?'disabled':''} onclick="stepWsQty(${idx},-1,'${key}')">−</button><input type="number" class="qty-input" value="${it.qty}" min="0" step="any"
        ${readOnly?'disabled':''} oninput="onQtyInput(this, ${idx}, '${key}')"><button type="button" tabindex="-1" ${readOnly?'disabled':''} onclick="stepWsQty(${idx},1,'${key}')">+</button></div></td>
    <td class="num-cell">${fmtNum(it.rate)}</td>
    <td class="num-cell" data-f="base">${fmtNum(c.base)}</td>
    ${cfg.hasAC?`<td class="num-cell" data-f="ac">${fmtNum(c.ac)}</td>`:''}
    <td class="num-cell" data-f="lc">${fmtNum(c.lc)}</td>
    ${cfg.hasFI?`<td class="num-cell" data-f="fi">${fmtNum(c.fi)}</td>`:''}
    <td class="num-cell" data-f="gst">${fmtNum(c.gst)}</td>
    <td class="num-cell" data-f="total"><b>${fmtNum(c.total)}</b></td>
    <td>${!readOnly?`<button class="btn btn-danger btn-sm" onclick="removeItem(${idx})">✕</button>`:''}</td>
  </tr>`;

function stepWsQty(idx, delta, key) {
  const row = document.querySelector(`tr[data-idx="${idx}"]`);
  if (!row) return;
  const input = row.querySelector('.qty-input');
  if (!input) return;
  const next = Math.max(0, (parseFloat(input.value)||0)+delta);
  input.value = next;
  onQtyInput(input, idx, key);
}

// ── Quantity-input fix: update ONLY the changed row's cells + totals box,
//    never destroy/recreate the <input> while the user is typing ──
function onQtyInput(input, itemIdx, key) {
  const val = parseFloat(input.value);
  ST.currentItems[itemIdx].qty = isNaN(val) ? 0 : val;
  const row = input.closest('tr');
  const cfg = sectionConfig(key);
  const c = calcItem(ST.currentItems[itemIdx], effectiveRates(), cfg.acKey);
  row.querySelector('[data-f="base"]').textContent = fmtNum(c.base);
  if (cfg.hasAC) row.querySelector('[data-f="ac"]').textContent = fmtNum(c.ac);
  row.querySelector('[data-f="lc"]').textContent = fmtNum(c.lc);
  if (cfg.hasFI) row.querySelector('[data-f="fi"]').textContent = fmtNum(c.fi);
  row.querySelector('[data-f="gst"]').textContent = fmtNum(c.gst);
  row.querySelector('[data-f="total"]').innerHTML = `<b>${fmtNum(c.total)}</b>`;
  if (ST.currentEstimate.estimateType !== 'amc') updateSectionTotals(key);
}

function rebuildSectionTable(key) {
  // full rebuild allowed on non-keystroke events (AC radio change, item add/remove)
  renderActiveTab();
}

function removeItem(idx) {
  ST.currentItems.splice(idx, 1);

// ── Supply spares: ONE definition, used by every surface ──────────────────
// The abstract prints "1B : Supply Spares @ 3% (on Sr. No.1A)", and Sr. No.1A
// is the supply base INCLUDING Non-SOR materials. Spares were previously
// computed from the SOR-only supply section, so on any estimate carrying
// Non-SOR supply items the printed figure was short by 3% of those items and
// contradicted its own label. It also disagreed with the Final Estimate,
// where ZEST03 puts every supply item in one section so nothing was excluded.
// Every caller now derives the amount from this single function.
function supplySparesApplies() {
  const e = ST.currentEstimate;
  return !!(e && e.estimateType === 'project' && e.supplySpares);
}
function supplySparesBase() {          // = Sr. No.1A  (SOR supply + Non-SOR materials)
  const sectionTotal = (key)=>{
    const cfg = sectionConfig(key);
    let t = 0;
    cfg.items.forEach(it => { t += calcItem(it, effectiveRates(), cfg.acKey).total; });
    return t;
  };
  return sectionTotal('supply') + sectionTotal('nonsor_supply');
}
function supplySparesAmount() {
  return supplySparesApplies() ? supplySparesBase() * 0.03 : 0;
}

function sectionTotalsCalc(key, itemsOverride, opts) {
  const cfg0 = sectionConfig(key);
  const cfg = itemsOverride ? Object.assign({}, cfg0, {items: itemsOverride}) : cfg0;
  let base=0, ac=0, lc=0, fi=0, gst=0, total=0;
  cfg.items.forEach(it => {
    const c = calcItem(it, effectiveRates(), cfg.acKey);
    base+=c.base; ac+=c.ac; lc+=c.lc; fi+=c.fi; gst+=c.gst; total+=c.total;
  });
  // Spares belong to the Supply sheet (which now carries SOR + Non-SOR
  // materials together), never to the derived Non-SOR-only sheet.
  const spares = (key==='supply' && !(opts && opts.noSpares)) ? supplySparesAmount() : 0;
  return {base, ac, lc, fi, gst, total: total+spares, spares, preSparesTotal: total};
}

function updateSectionTotals(key) {
  const box = document.getElementById(`sec-totals-${key}`);
  if (!box) return;
  const t = sectionTotalsCalc(key);
  let html = `
    <div class="totals-row"><span>Base Cost</span><span class="v">${fmtINR(t.base)}</span></div>
    ${t.ac?`<div class="totals-row"><span>Additional Charge</span><span class="v">${fmtINR(t.ac)}</span></div>`:''}
    <div class="totals-row"><span>Labour Cess</span><span class="v">${fmtINR(t.lc)}</span></div>
    ${t.fi?`<div class="totals-row"><span>Freight &amp; Insurance</span><span class="v">${fmtINR(t.fi)}</span></div>`:''}
    <div class="totals-row"><span>GST</span><span class="v">${fmtINR(t.gst)}</span></div>
  `;
  if (t.spares) {
    html += `<div class="totals-row"><span>Supply Spares @ 3%</span><span class="v">${fmtINR(t.spares)}</span></div>`;
    html += `<div class="totals-row grand"><span>Supply Material Total (incl. Spares)</span><span class="v">${fmtINR(t.total)}</span></div>`;
  } else {
    html += `<div class="totals-row grand"><span>${sectionConfig(key).title} Total</span><span class="v">${fmtINR(t.total)}</span></div>`;
  }
  box.innerHTML = html;
}

// ── Aggregate section totals for the Abstract / save payload ──
function computeAllSectionTotals() {
  const supply = sectionTotalsCalc('supply').total;
  const project = sectionTotalsCalc('project').total;
  const om = sectionTotalsCalc('om').total;
  const nonSorSupply = sectionTotalsCalc('nonsor_supply').total;
  const nonSorOm = sectionTotalsCalc('nonsor_om').total;
  return {supply, project, om, nonSorSupply, nonSorOm};
}

function renderAbstractBody() {
  const e = ST.currentEstimate;
  const body = document.getElementById('abstract-body');
  const readOnly = !canEdit() || (e.id && !ownsEstimate(e));

  if (e.estimateType === 'amc') {
    renderAMCAbstract(body, readOnly);

  const totals = computeAllSectionTotals();
  const supply = totals.supply + totals.nonSorSupply;
  const project = totals.project;
  const om = totals.om + totals.nonSorOm;
  const subA = supply + project + om;

  // Render the abstract from the single source of truth (abstractSheetRows)
  // so on-screen matches the Excel/PDF exactly: dynamic serials + supply
  // spares shown as 1A / 1B / 1.
  const abs = abstractSheetRows(true);
  let rows = '';
  let finalTotal = subA;
  abs.slice(1).forEach(r => {
    const sno = r[0], label = String(r[1]||''), amt = r[2];
    if (label === 'Amount in Words' || String(sno) === 'PMO / PR Reference') return;
    if (String(sno)==='' && String(label)==='' && (amt===''||amt==null)) return;  // spacer rows
    if ((amt === '' || amt == null) && /^—/.test(label)) {
      rows += `<div class="sr-breakdown" style="padding-left:42px">${escapeHtml(label)}</div>`;
      return;
    }
    const isFinal = (/Total Estimated cost with Centages/i.test(label) || /^TOTAL ESTIMATED COST/i.test(label)) && !/Sub Total/i.test(label);
    const isSub = /Sub Total/i.test(label);
    const isSubEntry = /^\d+[A-Z]\s*:/.test(String(label));   // "1A : ..." sub-item of its parent line
    let cls = 'sr-row';
    if (isFinal) cls = 'sr-row final';                    // ONLY the final total is highlighted
    else if (isSubEntry) cls = 'sr-row sr-subentry';      // indented sub-item
    else if (isSub) cls = 'sr-row sr-subtotal-lite';      // bold, not highlighted
    rows += `<div class="${cls}"><span class="sr-no">${escapeHtml(String(sno))}</span><span class="sr-label">${escapeHtml(label)}</span><span class="sr-val">${typeof amt==='number'?fmtINR(amt):''}</span></div>`;
    if (typeof amt==='number' && isFinal) finalTotal = amt;
  });
  let workTypePanel = '';
  if (e.estimateType === 'project') workTypePanel = renderWorkTypePanel(readOnly);

  ST.currentEstimate.finalTotal = finalTotal;
  ST.currentEstimate._totalsCache = totals;

  body.innerHTML = `
    ${workTypePanel}
    ${rows}

    ${pmoPrSummaryLine(e)}
    ${renderChargeRatesPanel(readOnly, e.estimateType!=='rm')}
  `;
}

// ══════════════════════════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════════════════════════
// ── Shared totals recompute — used by both the Estimate workspace's Save
// and the Proposal Progress page's Save (since item quantities can now be
// edited from either page). Single source of truth for the Sr.1-9 math,
// including the optional Tr. Line Land & Compensation charge. ──
function recomputeEstimateTotals(e) {
  if (e.estimateType !== 'amc') {
    const totals = computeAllSectionTotals();
    e.supplyTotal = totals.supply;
    e.projectTotal = totals.project;
    e.omTotal = totals.om;
    e.nonSorSupplyTotal = totals.nonSorSupply;
    e.nonSorOmTotal = totals.nonSorOm;
    const subA = totals.supply+totals.nonSorSupply+totals.project+totals.om+totals.nonSorOm;
    if (e.estimateType==='rm') {
      e.finalTotal = subA;
    } else {
      const rates = effectiveRates();
      const pv = subA*(rates.pv||0)/100, cont = subA*(rates.contingencies||0)/100;
      let sr7 = subA+pv+cont;
      if (e.trLineMode) {
        sr7 += sr7*(e.landCompChargePct||15)/100;
      }
      const centages = sr7*(rates.centages||0)/100;
      e.finalTotal = sr7+centages;
    }
  } else {
    e.supplyTotal = 0; e.projectTotal = 0; e.omTotal = 0; e.nonSorSupplyTotal = 0; e.nonSorOmTotal = 0;
    e.finalTotal = e.amcAmount||0;
  }
}

async function saveCurrentEstimate() {
  const e = ST.currentEstimate;
  if (!e.name) { toast('Estimate name is required.', 'warn'); return; }
  recomputeEstimateTotals(e);
  const btn = (event && event.target && event.target.tagName==='BUTTON') ? event.target : document.getElementById('ws-save-btn');
  const wasNew = !e.id;
  await withSaveStatus(btn, async () => {
    invalidateEstCache(e.id);
    const res = await apiPost({action:'saveEstimate', estimate:e, items:ST.currentItems});
    if (!res.ok) { toast(res.error||'Save failed', 'err'); return false; }
    e.id = res.id;
    const idx = ST.estimatesCache.findIndex(x=>x.id===e.id);
    const summary = {...e, savedAt: new Date().toISOString(), itemCount: ST.currentItems.length};
    if (idx>-1) ST.estimatesCache[idx] = summary; else ST.estimatesCache.push(summary);
    // Only re-render the shell if this was the estimate's first save (the
    // toolbar gains a "Proposal Progress" button once an id exists) — a
    // full re-render here would destroy the button mid-animation otherwise.
    if (wasNew) renderWorkspaceShell();
  }, 'Estimate saved successfully.');
}
// ══════════════════════════════════════════════════════════════
// PER-ESTIMATE EXCEL / PDF EXPORT
// Matches the official MSETCL estimate workbook format exactly:
// header block (company/division/scope/estimation no./SOR no./PR no.),
// rich item columns (short+full description, +25% additional charge,
// labour cess, F&I where applicable, GST), Abstract with PR references
// woven into Sr.1/2/3, Amount in Words.
// ══════════════════════════════════════════════════════════════

const MSETCL_HEADER_LINE1 = 'MAHARASHTRA STATE ELECTRICITY TRANSMISSION COMPANY LIMITED';

// ── Resolve a PMO/PR number to show against a given section, by matching
// label text loosely (e.g. label containing "supply" -> Sr.1, "project"/
// "etc" -> Sr.2, "o&m"/"om"/"service" -> Sr.3). Falls back to listing all
// filled entries if no clear per-section match exists, so nothing is ever
// silently dropped. ──
// Canonical section order for PMO/PR matching. Order matters and claims are
// exclusive: the label "ETC (Project Services)" contains the word "Services",
// so matching each section independently let ETC also satisfy the O&M lookup
// and the O&M sheets printed the ETC PR number. Claiming Supply → ETC → O&M
// with no entry reused makes each section resolve to its own PR.
const PMO_SECTION_ORDER = [
  {key:'supply',  keywords:['supply']},
  {key:'project', keywords:['project','etc']},
  {key:'om',      keywords:['o&m','om','service']},
];
function pmoPrResolve(e) {
  const entries = (e.pmoPrEntries||[]);
  const usable = entries.map((p,i)=>({p,i}))
    .filter(x=> x.p && String(x.p.label||'').trim() && String(x.p.number||'').trim()
                && !isPmoReferenceLabel(x.p.label));   // reference numbers are not section PRs
  const out = {}, used = new Set();
  PMO_SECTION_ORDER.forEach(sec=>{
    const hit = usable.find(x=> !used.has(x.i) &&
      sec.keywords.some(k=> String(x.p.label).toLowerCase().includes(k)));
    if (hit) { used.add(hit.i); out[sec.key] = hit.p; }
  });
  return out;
}
function pmoPrForSection(e, sectionKeywords) {
  const resolved = pmoPrResolve(e);
  // Map the caller's keyword list back to a canonical section.
  const sec = PMO_SECTION_ORDER.find(s=> s.keywords.some(k=> sectionKeywords.includes(k)));
  const match = sec ? resolved[sec.key] : null;
  return match ? ` wrt ${match.label} No- ${match.number}` : '';
}
function pmoPrAllFilled(e) {
  return (e.pmoPrEntries||[]).filter(p=>p.label && p.label.trim() && p.number && p.number.trim());
}

// The estimate's official identity. A ZEST03 upload carries SAP's own
// Estimation Number and Date; those outrank anything typed into the portal.
// Number and date are resolved TOGETHER — taking the number from ZEST03 and
// the date from the portal would put two different documents on one header.
function estimateIdentity(e) {
  const z = (e && e.settings && e.settings.zest03) || {};
  const zNo = String(z.estNo||'').trim();
  if (zNo) return { number: zNo, date: dfNormalise(z.estDate||'') || (e.date||''), source: 'zest03' };
  return { number: String(e.number||'').trim(), date: e.date||'', source: 'portal' };
}

// ── Header block — identical across Abstract + every section sheet ──
function estimateHeaderRows(e, sectionPrNo, sheetLabel) {
  const division = e.division || '';
  const ident = estimateIdentity(e);
  const rows = [
    [MSETCL_HEADER_LINE1],
    // Sheet title, e.g. "Estimate : Supply Part". Row 1 on every tab so a
    // printed page identifies itself without needing the tab name.
    [sheetLabel ? `Estimate : ${sheetLabel}` : ''],
    [division ? (/name of location/i.test(division) ? division : ('Name of Location : ' + division)) : ''],
    [`SCOPE OF WORK:- ${e.work || e.name || ''}`],
    [`Estimation Number: ${ident.number||'—'} , SOR Number: ${(e.sorVersions||[]).join(', ')||'—'} , Estimation Date: ${fmtDate(ident.date)||'—'}` + (sectionPrNo ? ` , PR No.: ${sectionPrNo}` : '')],
  ];
  return rows;
}
// Approval signatories that print at the bottom of every estimate sheet.
// Editable per estimate (e.signatories); falls back to the standard MSETCL
// O&M block with the estimate's own office/division.
const DEFAULT_SIGNATORIES = [
  { title:'Additional Executive Engineer (M)', office:'400 kV Karjat S/s',              hidden:false },
  { title:'Dy. Executive Engineer (O)',        office:'400kV R.S O&M Division Karjat',  hidden:false },
  { title:'Deputy Manager (F&A)',              office:'400kV R.S O&M Division Karjat',  hidden:false },
  { title:'Executive Engineer',                office:'400kV R.S O&M Division Karjat',  hidden:false },
];
function estimateSignatories(e) {
  const stored = (e && e.progress && e.progress.signatories)
              || (e && e.signatories)
              || (ST.user && ST.user.defaultSignatories);
  if (Array.isArray(stored) && stored.length === 4) return stored.map(s=>({title:s.title||'', office:s.office||'', hidden:!!s.hidden}));
  return DEFAULT_SIGNATORIES.map(s=>({...s}));
}
// Build the signatory footer as AOA rows + the merge ranges to apply.
// Blocks sit at columns A:C, D:F, H:I, K:L across the sheet width.
function signatoryBlock(e, colCount, startRow, opts) {
  let sig = estimateSignatories(e);
  // The Non-SOR sheet carries only the last three signatories.
  if (opts && opts.skipFirst) sig = sig.slice(1);
  const blanks = new Array(colCount).fill('');
  const titleRow = new Array(colCount).fill('');
  const officeRow = new Array(colCount).fill('');
  const cols = [0, 3, 7, 10];
  sig.forEach((s,i)=>{ if (s.hidden || cols[i]===undefined || cols[i]>=colCount) return;
                       titleRow[cols[i]] = s.title; officeRow[cols[i]] = s.office; });
  const rows = [blanks.slice(), blanks.slice(), titleRow, officeRow];  // 2 spacer rows then title+office
  const tR = startRow + 2, oR = startRow + 3;
  const spans = [[0,2],[3,5],[7,8],[10,11]];
  const merges = [];
  spans.forEach(([s,en])=>{ merges.push({s:{r:tR,c:s},e:{r:tR,c:en}}); merges.push({s:{r:oR,c:s},e:{r:oR,c:en}}); });
  return { rows, merges, titleRowIdx: tR, officeRowIdx: oR };
}

// ── Item-table rows for a section, matching the reference's rich column
// layout. Description is duplicated into short+full since SOR data only
// carries a single description field. ──
// Append a Remarks column to an already-built section table. Remarks come
// from the Non-SOR database entry for that item number (falling back to the
// item's own stored remark), which is where the PO references live.
function appendRemarksColumn(rows, items){
  const remarkFor = (itemNo)=>{
    const id = String(itemNo||'');
    const ns = (ST.nonSorCache||[]).find(x => String(x.item_no) === id);
    if (ns && ns.remarks) return String(ns.remarks);
    const own = items.find(x => String(x.item_no) === id);
    return String((own && (own.remarks || own.remark)) || '');
  };
  return rows.map((r, i) => {
    const row = r.slice();
    if (i === 0) row.push('Remarks');
    else if (typeof r[0] === 'number') row.push(remarkFor(r[1]));
    else row.push('');
    return row;
  });
}

function sectionItemTableRows(key, itemsOverride, opts) {
  const cfg0 = sectionConfig(key);
  // itemsOverride lets a caller build a sheet from a hand-picked set of items
  // while still using this section's charge configuration. The Non-SOR sheets
  // rely on it: in a ZEST03 estimate every item lands in supply/project/om,
  // so Non-SOR entries are NOT in the nonsor_* sections at all.
  const cfg = itemsOverride ? Object.assign({}, cfg0, {items: itemsOverride}) : cfg0;
  const rates = effectiveRates();
  // A charge's column pair appears ONLY when that charge actually applies:
  // AC only when chosen for this section, and LC / F&I / GST only when their
  // configured rate is non-zero. Zero/unused charges leave no empty columns.
  const acApplied = cfg.hasAC && cfg.items.some(it => calcItem(it, rates, cfg.acKey).ac > 0);
  const hasLC  = (rates.labourCess||0) > 0;
  const hasFI  = cfg.hasFI && (rates.freightInsurance||0) > 0;
  const hasGST = (rates.gst||0) > 0;
  // ZEST03 carries a separate "Mat / Serv Full Description" alongside the short
  // description. It is surfaced as its own column immediately to the RIGHT of
  // Description — but only when at least one item in the section actually has
  // one, so ordinary (non-ZEST03) estimates keep their original layout.
  const hasFull = cfg.items.some(it => String(it.fullDescription||'').trim() !== '');
  const headers = ['Sr.No.','Material/Service No','Description'];
  if (hasFull) headers.push('Mat / Service Full Description');
  headers.push('UoM','Quantity','Exworks Price (₹)','Total Ex-works Price excl. T&D (₹)');
  if (acApplied) headers.push('Extra Charge (%)','Total incl. Additional Charge');
  if (hasLC) headers.push('Labour Cess @ '+rates.labourCess+'%','Ex-Works + Labour Cess');
  if (hasFI) headers.push('Freight & Insurance @ '+rates.freightInsurance+'%','(Ex-Works+LC) + F&I');
  if (hasGST) headers.push('GST @ '+rates.gst+'%');
  headers.push('TOTAL AMOUNT INCLUDING GST', "Item's SoR Status");

  const rows = [headers];
  const sum = { base:0, baseAc:0, lc:0, exLc:0, fi:0, exFi:0, gst:0, total:0 };
  // Non-SOR items always sit at the END of the section, after the SOR items,
  // keeping their relative order within each group.
  const isNonSorItem = (it)=> !!(it.isCustom || it.version === 'NONSOR');
  const ordered = cfg.items.map((it,i)=>({it,i}))
    .sort((a,b)=> (isNonSorItem(a.it)?1:0) - (isNonSorItem(b.it)?1:0) || a.i - b.i)
    .map(x=>x.it);
  ordered.forEach((it, i)=>{
    const c = calcItem(it, rates, cfg.acKey);
    // Material/Service No kept as text so it never gets comma grouping.
    const row = [i+1, String(it.item_no||''), it.description];
    if (hasFull) row.push(String(it.fullDescription||''));
    row.push(it.uom, it.qty, it.rate, c.base);
    if (acApplied) row.push(c.ac>0?(rates.additionalCharge||0):0, c.base+c.ac);
    if (hasLC) row.push(c.lc, c.base+c.ac+c.lc);
    if (hasFI) row.push(c.fi, c.base+c.ac+c.lc+c.fi);
    if (hasGST) row.push(c.gst);
    // Non-SOR items (isCustom) are labelled Non-SoR — never a blanket 'SoR'.
    row.push(c.total, (it.isCustom || it.version==='NONSOR') ? 'Non-SoR' : 'SoR');
    rows.push(row);
    sum.base+=c.base; sum.baseAc+=c.base+c.ac;
    sum.lc+=c.lc; sum.exLc+=c.base+c.ac+c.lc;
    sum.fi+=c.fi; sum.exFi+=c.base+c.ac+c.lc+c.fi;
    sum.gst+=c.gst; sum.total+=c.total;
  });
  // noTotals: build the item table and stop. Kept as a general capability for
  // any caller that wants a listing without a total block.
  if (cfg.items.length && !(opts && opts.noTotals)) {
    // TOTAL row — placed precisely under each column whatever columns exist
    const D = hasFull ? 1 : 0;          // rightward shift caused by Full Description
    const tr = new Array(headers.length).fill('');
    tr[2] = 'TOTAL';
    tr[6+D] = sum.base;
    let idx = 7+D;
    if (acApplied) { tr[idx+1] = sum.baseAc; idx += 2; }
    if (hasLC) { tr[idx] = sum.lc; tr[idx+1] = sum.exLc; idx += 2; }
    if (hasFI) { tr[idx] = sum.fi; tr[idx+1] = sum.exFi; idx += 2; }
    if (hasGST) { tr[idx] = sum.gst; idx += 1; }
    tr[idx] = sum.total;
    rows.push(tr);

    // Supply spares (3% of the supply total incl. GST, project estimates only)
    // sit directly under TOTAL, followed by the combined part total. The
    // amount-in-words line then reports that COMBINED figure, not the bare
    // item total — so words always match the last number above them.
    // Same single definition as the abstract — 3% of Sr. No.1A, which
    // includes Non-SOR materials. Never recompute this locally.
    const spares = (key === 'supply' && !(opts && opts.noSpares)) ? supplySparesAmount() : 0;
    let grand = sum.total;
    if (spares > 0) {
      const sp = new Array(headers.length).fill('');
      sp[2] = 'Add: Supply Spares @ 3%';
      sp[idx] = spares;
      rows.push(sp);
      grand = sum.total + spares;
      const pt = new Array(headers.length).fill('');
      pt[2] = 'Supply Part Total ( incl. Supply Spares )';
      pt[idx] = grand;
      rows.push(pt);
    }

    // Amount-in-words line for the section, matching the official format
    const wr = new Array(headers.length).fill('');
    wr[2] = (spares ? 'Total Amount (including Spares) in Words: ' : 'Amount in Words: ') + toWords(Math.round(grand)) + ' Rupees Only';
    rows.push(wr);
  }
  return rows;
}

function abstractPmoPrRows(e) {
  const all = pmoPrAllFilled(e);
  if (!all.length) return [];
  // blank spacer row keeps the reference visually separate from Amount in Words
  return [['', '', ''], ['PMO / PR Reference', all.map(p=>`${p.label}: ${p.number}`).join('  |  ')]];
}

function abstractSheetRows(includeBreakdown=false) {
  const e = ST.currentEstimate;
  if (e.estimateType === 'amc') {
    const rows = [
      ['AMC ABSTRACT',''],
      ['AMC Amount Limit', e.amcAmount||0],
      ['Amount in Words', toWords(e.amcAmount||0)+' Rupees Only'],
      ['AMC Remark', e.amcRemark||''],
    ];
    return rows.concat(abstractPmoPrRows(e));
  }
  const totals = computeAllSectionTotals();
  const supCalc = sectionTotalsCalc('supply');
  const spares = supCalc.spares || 0;
  const supplyBase = supCalc.preSparesTotal + totals.nonSorSupply;   // 1A
  const supply = supplyBase + spares;                                // 1 (= 1A + 1B)
  const project = totals.project, om = totals.om+totals.nonSorOm;
  const supplyPr = pmoPrForSection(e, ['supply']);
  const projectPr = pmoPrForSection(e, ['project','etc']);
  const omPr = pmoPrForSection(e, ['o&m','om','service']);
  const rows = [['Sr.No.','PARTICULARS','AMOUNT (₹)']];
  // Sections with no items contribute nothing; serials renumber sequentially.
  const hasSupply = sectionConfig('supply').items.length + sectionConfig('nonsor_supply').items.length > 0;
  const hasProject = sectionConfig('project').items.length > 0;
  const hasOm = sectionConfig('om').items.length + sectionConfig('nonsor_om').items.length > 0;
  let sr = 0; const next = () => ++sr;         // consumes a serial only when a row is added
  const secSerials = [];                       // serials feeding Sub Total "A"
  if (hasSupply) {
    const s = next(); secSerials.push(s);
    const sparesApplicable = e.estimateType==='project' && e.supplySpares && spares > 0;
    if (sparesApplicable) {
      // 1 first (feeds Sub Total A), then 1A / 1B beneath as the breakdown
      // showing that supply spares were considered.
      rows.push([s, `Cost of Material (SUPPLY PORTION, incl. Spares)${supplyPr}`, supply]);
      rows.push(['', `${s}A : Supply Portion (base)`, supplyBase]);
      rows.push(['', `${s}B : Supply Spares @ 3% (on Sr. No.${s}A)`, spares]);
    } else {
      // No spares → a single, normally-numbered supply line
      rows.push([s, `Cost of Material (SUPPLY PORTION)${supplyPr}`, supply]);
    }
    if (includeBreakdown && totals.nonSorSupply>0) {
      // Must break down 1A, so use the PRE-spares SOR figure. supCalc.total
      // already carries the spares, which made these two components sum to
      // Sr.1 instead of to the 1A line they sit under.
      rows.push(['', `— SOR items: ${fmtNum(supCalc.preSparesTotal)}  +  Non-SOR Materials: ${fmtNum(totals.nonSorSupply)}`, '']);
    }
  }
  if (hasProject) { const s = next(); secSerials.push(s); rows.push([s, `Cost of Work (ETC)${projectPr}`, project]); }
  if (hasOm) {
    const s = next(); secSerials.push(s);
    rows.push([s, `Cost of Work (O&M Services)${omPr}`, om]);
    if (includeBreakdown && totals.nonSorOm>0) {
      rows.push(['', `— SOR items: ${fmtNum(totals.om)}  +  Non-SOR Services: ${fmtNum(totals.nonSorOm)}`, '']);
    }
  }
  const subA = supply+project+om;
  const subASr = next();
  rows.push([subASr, `Sub Total "A" (${secSerials.join('+')}) Rs.`, subA]);
  if (e.estimateType === 'rm') {
    rows.push(['', 'TOTAL ESTIMATED COST', subA]);
    rows.push(['', 'Amount in Words', toWords(Math.round(subA))+' Rupees Only']);
    return rows.concat(abstractPmoPrRows(e));
  }
  const rates = effectiveRates();
  const pv = subA*(rates.pv||0)/100, cont = subA*(rates.contingencies||0)/100;
  let sr7 = subA+pv+cont, pvSr=null, contSr=null, landSr=null;
  if ((rates.pv||0) > 0) { pvSr = next(); rows.push([pvSr, `PV ${rates.pv}% on Sr. No.${subASr}`, pv]); }
  if ((rates.contingencies||0) > 0) { contSr = next(); rows.push([contSr, `Contingencies ${rates.contingencies}% on Sr. No.${subASr}`, cont]); }
  if (e.trLineMode) {
    const landComp = sr7*(e.landCompChargePct||15)/100; sr7 += landComp;
    landSr = next(); rows.push([landSr, `Land & Compensation Charges @ ${e.landCompChargePct||15}%`, landComp]);
  }
  const centages = sr7*(rates.centages||0)/100, total = sr7+centages;
  const bParts = [subASr, pvSr, contSr, landSr].filter(x=>x!=null);
  let subBSr = subASr, centSr = null;
  if (sr7 !== subA) { subBSr = next(); rows.push([subBSr, `Total Estimated cost without Centages Sub Total 'B' = (${bParts.join('+')}) Rs.`, sr7]); }
  if ((rates.centages||0) > 0) { centSr = next(); rows.push([centSr, `Centages : Supervision/GEC/Misc = ${rates.centages}%`, centages]); }
  const tParts = [subBSr, centSr].filter(x=>x!=null);
  rows.push([next(), `Total Estimated cost with Centages (${tParts.join('+')})`, total]);
  rows.push(['', 'Amount in Words', toWords(Math.round(total))+' Rupees Only']);
  return rows.concat(abstractPmoPrRows(e));
}

// ── The single source of truth for which sheets an estimate produces and
// what goes on each one. Excel and Print both read this, so the printed
// document is the workbook minus the ZEST03 tab — never a second, drifting
// implementation of the same thing. ──
function estimateSheetDefs(e) {
  const _pr = pmoPrResolve(e);
  const _isNonSor = (it)=> !!(it.isCustom || it.version === 'NONSOR');
  const _gather = (keys)=> keys.reduce((acc,k)=> acc.concat(sectionConfig(k).items.filter(_isNonSor)), []);
  const _merge  = (keys)=> keys.reduce((acc,k)=> acc.concat(sectionConfig(k).items), []);
  return [
    {key:'supply',  name:'Supply  Material', pr:_pr.supply,  items:_merge(['supply','nonsor_supply'])},
    {key:'project', name:'ETC Part',         pr:_pr.project},
    {key:'om',      name:'Services Part',    pr:_pr.om,      items:_merge(['om','nonsor_om'])},
    {key:'supply',  name:'Non SOR Materials', pr:_pr.supply, items:_gather(['supply','nonsor_supply']),
     remarks:true, noHighlight:true, skipFirstSig:true, noSpares:true},
    {key:'om',      name:'Non SOR Services',  pr:_pr.om,     items:_gather(['om','project','nonsor_om']),
     remarks:true, noHighlight:true, skipFirstSig:true, noSpares:true},
  ];
}

async function exportEstimateExcel() {
  const e = ST.currentEstimate;
  e.pmoPrEntries = e.pmoPrEntries || [];
  toast('Building Excel…', 'ok', 1800);
  // The Non-SOR sheets take their Remarks straight from the Non-SOR catalog
  // (that is where the PO references live). Under lite boot the catalog is
  // only fetched when a page needs it, so exporting from an estimate without
  // ever opening Rates left ST.nonSorCache empty and every Remark blank.
  // Loading it here is a no-op once it is already in memory.
  await ensureNonSorLoaded();
  const XLSXmod = await ensureSheetJS();
  const wb = XLSXmod.utils.book_new();

  // Abstract sheet: header block + Sr.1-9 table
  const abstractHeader = estimateHeaderRows(e, '', 'Abstract');
  const abstractTable = abstractSheetRows(false);
  // Abstract laid out across the full 12 columns (Sr in A, PARTICULARS B:K,
  // AMOUNT in L) so it aligns with the section sheets, plus a signatory footer.
  const A_COLS = 12;
  const expandAbs = (r) => { const a = new Array(A_COLS).fill(''); a[0]=r[0]; a[1]=r[1]; if (r[2]!=='' && r[2]!=null) a[A_COLS-1]=r[2]; return a; };
  const absBody = abstractTable.map(expandAbs);
  const absRows0 = abstractHeader.concat([['ABSTRACT']], absBody);
  const aSig = signatoryBlock(e, A_COLS, absRows0.length);
  const absRows = absRows0.concat(aSig.rows);
  const absStyleMap = {};
  absStyleMap[0] = 'section';
  absStyleMap[abstractHeader.length] = 'section';        // ABSTRACT title
  absStyleMap[abstractHeader.length+1] = 'header';       // column-header row
  const abs = XLSXmod.utils.aoa_to_sheet(absRows);
  abs['!cols'] = COLW_ABSTRACT.map(w=>({wch:w}));
  abs['!merges'] = [];
  const titleIdx = abstractHeader.length, colHdrIdx = abstractHeader.length + 1;
  abs['!merges'].push({s:{r:titleIdx,c:0}, e:{r:titleIdx,c:A_COLS-1}});
  for (let ri = colHdrIdx; ri < absRows0.length; ri++){
    const r = absRows[ri];
    const lbl = String(r[1]==null?'':r[1]), snoStr = String(r[0]==null?'':r[0]), amt = r[A_COLS-1];
    if (/^Amount in Words/i.test(lbl)) {
      const words = String(amt==null?'':amt);
      const ad = XLSXmod.utils.encode_cell({r:ri,c:0});
      abs[ad] = {t:'s', v: words ? (lbl+': '+words) : lbl, s:Object.assign({}, XLSX_STYLES.words)};
      const bd=XLSXmod.utils.encode_cell({r:ri,c:1}); if(abs[bd]) abs[bd].v='';
      const ld=XLSXmod.utils.encode_cell({r:ri,c:A_COLS-1}); if(abs[ld]) abs[ld].v='';
      abs['!merges'].push({s:{r:ri,c:0},e:{r:ri,c:A_COLS-1}});
    } else if (/^PMO \/ PR Reference/i.test(snoStr)) {
      const val = String(r[1]==null?'':r[1]);
      const ed=XLSXmod.utils.encode_cell({r:ri,c:4});
      abs[ed] = {t:'s', v:val, s:{alignment:{horizontal:'left',vertical:'center',wrapText:true}}};
      const bd=XLSXmod.utils.encode_cell({r:ri,c:1}); if(abs[bd]) abs[bd].v='';
      abs['!merges'].push({s:{r:ri,c:0},e:{r:ri,c:3}});
      abs['!merges'].push({s:{r:ri,c:4},e:{r:ri,c:A_COLS-1}});
    } else {
      abs['!merges'].push({s:{r:ri,c:1},e:{r:ri,c:A_COLS-2}});   // PARTICULARS B:K
      // Particulars left-aligned (unless it's a serial-less sub-total that reads better centred)
      const pd = XLSXmod.utils.encode_cell({r:ri,c:1});
      if (abs[pd]) { abs[pd].s = abs[pd].s || {}; abs[pd].s.alignment = Object.assign({vertical:'center', wrapText:true}, abs[pd].s.alignment, {horizontal:'left'}); }
      const ld=XLSXmod.utils.encode_cell({r:ri,c:A_COLS-1});
      if (abs[ld] && typeof abs[ld].v==='number'){ abs[ld].s=abs[ld].s||{}; abs[ld].s.numFmt=rupeeNumFmt(abs[ld].v); abs[ld].s.alignment={horizontal:'center',vertical:'center'}; }
    }
  }
  aSig.merges.forEach(m=>abs['!merges'].push(m));
  // signatory block + two rows above: white inner gridlines (invisible), black outer box
  // hair, not thin — otherwise these verticals render heavier than every
  // other interior gridline on the sheet.
  const _aW={style:'hair',color:{rgb:'FFFFFF'}}, _aB={style:'hair',color:{rgb:'000000'}};
  const aSigRows = [aSig.titleRowIdx-2, aSig.titleRowIdx-1, aSig.titleRowIdx, aSig.officeRowIdx];
  aSigRows.forEach((r)=>{ for(let c=0;c<A_COLS;c++){ const ad=XLSXmod.utils.encode_cell({r,c}); if(!abs[ad]) abs[ad]={t:'s',v:''}; abs[ad].s=abs[ad].s||{};
    const b={ top:_aW, bottom:_aW, left:_aW, right:_aW };
    if(r===aSigRows[0]) b.top=_aB; if(r===aSig.officeRowIdx) b.bottom=_aB;
    if(c===0) b.left=_aB; if(c===A_COLS-1) b.right=_aB;
    abs[ad].s.border=b; } });
  // idx 0 = designation, idx 1 = office / work location. The office row is
  // top-aligned so it sits directly under the designation instead of floating
  // in the middle of a tall signing row. Must match the section sheets.
  [aSig.titleRowIdx, aSig.officeRowIdx].forEach((r,idx)=>{ [0,3,7,10].forEach(c=>{ const ad=XLSXmod.utils.encode_cell({r,c}); if(abs[ad]){ abs[ad].s=Object.assign({},abs[ad].s,{font:{name:EXPORT_FONT,bold:idx===0,sz:16,color:{rgb:'000000'}},alignment:{horizontal:'center',vertical: idx===1 ? 'top' : 'center',wrapText:true}}); } }); });
  applyRowStyles(abs, absStyleMap, A_COLS);
  // Same hairline pass on the Abstract: fill only the cells that have no
  // border yet, leaving every deliberately-styled row untouched.
  (function gridAbstract(){
    const HAIR = {style:'hair', color:{rgb:'000000'}};
    const firstSigRow = aSig.titleRowIdx - 2;
    const lastRow = XLSXmod.utils.decode_range(abs['!ref']).e.r;
    for (let r = BANNER_ROWS; r <= lastRow; r++) {
      if (r >= firstSigRow) continue;      // signing area stays clean
      for (let c = 0; c < A_COLS; c++) {
        const ad = XLSXmod.utils.encode_cell({r, c});
        if (!abs[ad]) abs[ad] = {t:'s', v:''};
        abs[ad].s = abs[ad].s || {};
        if (!abs[ad].s.border) abs[ad].s.border = {top:HAIR, bottom:HAIR, left:HAIR, right:HAIR};
      }
    }
  })();

  applyMsetclHeaderBanner(abs, A_COLS);
  const absMins = {0:42, 1:39, 2:26.2, 3:40.5, 4:26.2, 5:28.5};
  absMins[colHdrIdx] = 28.5;
  absMins[aSig.titleRowIdx] = 42; absMins[aSig.officeRowIdx] = 42;
  absMins[aSig.titleRowIdx-2] = 30; absMins[aSig.titleRowIdx-1] = 30;   // two rows above signatories, 1.5x
  abs['!freeze'] = { xSplit:0, ySplit:colHdrIdx+1, topLeftCell:XLSXmod.utils.encode_cell({r:colHdrIdx+1,c:0}), activePane:'bottomLeft', state:'frozen' };
  autoRowHeights(abs, 12, absMins);
  XLSXmod.utils.book_append_sheet(wb, abs, 'Abstract');

  // Section sheets
  // Resolve section PRs through pmoPrResolve(): claims are exclusive and made
  // in Supply -> ETC -> O&M order. A plain .find() per section scans from the
  // top, so the label "Project Services PR" (it contains "service") would be
  // picked for the O&M sheet and that sheet would print the ETC PR number.
  const _pr = pmoPrResolve(e);
  const sectionDefs = estimateSheetDefs(e);
  sectionDefs.forEach(def => {
    const key = def.key, name = def.name, prMatch = def.pr;
    const itemsOverride = def.items || null;
    const srcItems = itemsOverride || sectionConfig(key).items;
    if (!srcItems.length) return;
    const prNo = (prMatch && prMatch.number) ? prMatch.number : '';
    const header = estimateHeaderRows(e, prNo, name);
    const secOpts = {noSpares: !!def.noSpares};
    let itemRows = sectionItemTableRows(key, itemsOverride, secOpts);
    if (def.remarks) itemRows = appendRemarksColumn(itemRows, srcItems);
    const N = itemRows[0].length;
    const H = itemRows[0];
    // item data rows only (drop the built-in TOTAL and amount-in-words rows)
    const items = itemRows.slice(1).filter(r => String(r[2])!=='TOTAL'
      && !/^amount in words|^total amount/i.test(String(r[2]||''))
      && !/^add: supply spares|^supply part total/i.test(String(r[2]||'')));
    const t = sectionTotalsCalc(key, itemsOverride, secOpts);
    const rateSet = effectiveRates();
    // Resolve by HEADER, not by offset from the end: the Non-SOR sheets append
    // a Remarks column, which would otherwise shift both of these.
    const descCol = 2;
    const statusCol = (()=>{ const i = H.findIndex(h=>/sor\s*status/i.test(String(h))); return i>-1 ? i : N-1; })();
    const valueCol  = (()=>{ const i = H.findIndex(h=>/total amount including gst/i.test(String(h))); return i>-1 ? i : N-2; })();
    // Full Description (ZEST03) sits right of Description and pushes every
    // amount column one to the right — resolve both by header, never by index.
    const fullCol = H.findIndex(h=>/full\s*description/i.test(String(h)));
    const amtCol0 = (()=>{ const i = H.findIndex(h=>/exworks\s*price/i.test(String(h))); return i>-1 ? i : 5; })();
    const mk = () => new Array(N).fill('');

    // TOTAL row — title only (merged Description→GST), GST total at value col
    // (this is the total WITHOUT spares; the spares-inclusive total appears in
    // the calculations below).
    const totalRow = mk(); totalRow[descCol] = 'Total Amount Including GST : '; totalRow[valueCol] = (t.preSparesTotal!=null ? t.preSparesTotal : t.total);

    // Charge calculations (these ARE the figures the column totals would show)
    const calc = [];
    const addCalc = (lbl,val,opts)=>{ const a=mk(); a[0]=lbl; a[valueCol]=val; calc.push(Object.assign({row:a}, opts||{})); };
    // breakdown (hidden, collapsible)
    addCalc('', '', {hidden:true, blank:true});
    addCalc('Base Cost (Total Ex-works excl. T&D)', t.base, {hidden:true});
    if (t.ac) addCalc('Additional Charge @ '+rateSet.additionalCharge+'%', t.ac, {hidden:true});
    if ((rateSet.labourCess||0)>0) addCalc('Labour Cess @ '+rateSet.labourCess+'%', t.lc, {hidden:true});
    if (t.fi) addCalc('Freight & Insurance @ '+rateSet.freightInsurance+'%', t.fi, {hidden:true});
    if ((rateSet.gst||0)>0) addCalc('GST @ '+rateSet.gst+'%', t.gst, {hidden:true});
    // visible: amount with GST, then spares add-on and final total
    if (t.spares) {
      addCalc('Add: Supply Spares @ 3%', t.spares, {kind:'spare'});
      addCalc((sectionConfig(key).title||'Section')+' Total (including Spares)', t.total, {kind:'grand'});
    }

    const wordsR = mk();
    wordsR[0] = (t.spares ? 'Total Amount (including Spares) in Words: ' : 'Amount in Words: ') + toWords(Math.round(t.total)) + ' Rupees Only';

    // Assemble in the approved order
    let R = header.slice();
    const titleIdx = R.length; R.push([name + (prNo ? '   —   PR No.: ' + prNo : '')]);
    const colHdrIdx = R.length; R.push(H);
    const itemStart = R.length; items.forEach(r=>R.push(r));
    const itemEnd = R.length - 1;
    const totalIdx = R.length; R.push(totalRow);
    R.push(mk());                                   // blank (A-L) after TOTAL
    const calcStart = R.length; const calcHiddenRows = [];
    calc.forEach((c,ix)=>{ R.push(c.row); if (c.hidden) calcHiddenRows.push(calcStart+ix); });
    const calcEnd = R.length - 1;
    R.push(mk());                                   // blank (A-L) before amount-in-words
    const wordsIdx = R.length; R.push(wordsR);
    const sigStart = R.length;                      // signatoryBlock adds 2 blank rows then title+office
    // Non-SOR sheets carry three signatories (no first): they go for separate
    // audit scrutiny, and the main four sheets are only signed once that audit
    // has passed.
    const _sig = signatoryBlock(e, N, sigStart, {skipFirst: !!def.skipFirstSig});
    _sig.rows.forEach(r=>R.push(r));
    const rows = R;

    const ws = XLSXmod.utils.aoa_to_sheet(rows);
    ws['!noZebra'] = true;                           // zebra applied to items only, below

    // ---- styles ----
    const styleMap = {};
    styleMap[colHdrIdx] = 'header';
    styleMap[totalIdx] = 'total';
    styleMap[calcEnd] = 'total';                     // section grand-total row highlighted
    calc.forEach((c,ix)=>{ styleMap[calcStart+ix] = (c.kind==='grand') ? 'total' : 'subtotal'; });
    applyRowStyles(ws, styleMap, N);
    { const ad=XLSXmod.utils.encode_cell({r:titleIdx,c:0}); if(ws[ad]) ws[ad].s=Object.assign({}, XLSX_STYLES.section); }

    // zebra + description-left on item rows only
    for (let i=itemStart;i<=itemEnd;i++){
      if ((i-itemStart)%2===1) for (let c=0;c<N;c++){ const ad=XLSXmod.utils.encode_cell({r:i,c}); if(ws[ad]){ ws[ad].s=ws[ad].s||{}; ws[ad].s.fill={patternType:'solid',fgColor:{rgb:'F4F7FC'}}; } }
      // Non-SOR rows carry a light yellow fill inside the Supply / O&M sheets,
      // to separate them from SOR rows. A dedicated Non-SOR sheet is entirely
      // Non-SOR, so highlighting every row there would mean nothing.
      if (!def.noHighlight &&
          String(ws[XLSXmod.utils.encode_cell({r:i,c:statusCol})] &&
                 ws[XLSXmod.utils.encode_cell({r:i,c:statusCol})].v || '') === 'Non-SoR') {
        for (let c=0;c<N;c++){
          const ad = XLSXmod.utils.encode_cell({r:i,c});
          if (ws[ad]) { ws[ad].s = ws[ad].s || {}; ws[ad].s.fill = { patternType:'solid', fgColor:{rgb:'FFF8DC'} }; }
        }
      }
      [descCol, fullCol].forEach(dc=>{ if (dc<0) return;
        const dd=XLSXmod.utils.encode_cell({r:i,c:dc}); if(ws[dd]){ ws[dd].s=ws[dd].s||{}; ws[dd].s.alignment=Object.assign({vertical:'center',wrapText:true},ws[dd].s.alignment,{horizontal:'left'}); } });
    }

    // ₹ Indian grouping on the value column (TOTAL + calc rows) and item amount cols
    const fmtAmt = (r,c)=>{ const ad=XLSXmod.utils.encode_cell({r,c}); if(ws[ad] && typeof ws[ad].v==='number'){ ws[ad].s=ws[ad].s||{}; ws[ad].s.numFmt=rupeeNumFmt(ws[ad].v); ws[ad].s.alignment=Object.assign({vertical:'center',horizontal:'center'},ws[ad].s.alignment); ws[ad].s.border=LUXE_BORDER_ALL; } };
    for (let r=itemStart;r<=itemEnd;r++) for (let c=amtCol0;c<N;c++) fmtAmt(r,c);
    fmtAmt(totalIdx, valueCol);
    for (let i=calcStart;i<=calcEnd;i++) fmtAmt(i, valueCol);

    // words row style (bold italic sz16, left, fill)
    { const ad=XLSXmod.utils.encode_cell({r:wordsIdx,c:0}); if(ws[ad]) ws[ad].s=Object.assign({}, XLSX_STYLES.words, {alignment:Object.assign({}, XLSX_STYLES.words.alignment)}); }

    // ---- merges ----
    ws['!merges'] = ws['!merges'] || [];
    const M = (r,c1,c2)=> ws['!merges'].push({s:{r,c:c1}, e:{r,c:c2}});
    M(titleIdx, 0, N-1);                              // section title A-L
    // TOTAL row: "TOTAL" title merged Description→(value-1); grand total merged value→status
    M(totalIdx, descCol, valueCol-1);
    M(totalIdx, valueCol, statusCol);
    { const ad=XLSXmod.utils.encode_cell({r:totalIdx,c:descCol}); if(ws[ad]){ ws[ad].s=ws[ad].s||{}; ws[ad].s.alignment=Object.assign({},ws[ad].s.alignment,{horizontal:'right',vertical:'center'}); } }
    M(totalIdx+1, 0, N-1);                            // blank after TOTAL
    for (let i=calcStart;i<=calcEnd;i++){             // calc rows: label A→(value-1), value→status
      M(i, 0, valueCol-1); M(i, valueCol, statusCol);
      const ad=XLSXmod.utils.encode_cell({r:i,c:0}); if(ws[ad]){ ws[ad].s=ws[ad].s||{}; ws[ad].s.alignment=Object.assign({vertical:'center',wrapText:true},ws[ad].s.alignment,{horizontal:'right'}); }
    }
    // Section / sub-total amounts are centred in their merged cell. This runs
    // AFTER the label alignment tweaks above, so it is the last word on these
    // cells regardless of what touched them earlier.
    const centreAmt = (r)=>{ const ad=XLSXmod.utils.encode_cell({r,c:valueCol});
      if(ws[ad]){ ws[ad].s=ws[ad].s||{};
        ws[ad].s.alignment=Object.assign({}, ws[ad].s.alignment, {horizontal:'center', vertical:'center'}); } };
    centreAmt(totalIdx);
    for (let i=calcStart;i<=calcEnd;i++) centreAmt(i);

    M(calcEnd+1, 0, N-1);                             // blank before amount-in-words
    M(wordsIdx, 0, N-1);                              // amount in words A-L
    M(sigStart, 0, N-1); M(sigStart+1, 0, N-1);       // two blank rows above signatories
    _sig.merges.forEach(m=> ws['!merges'].push(m));

    // signatory rows + two blank rows above: WHITE inner gridlines (invisible),
    // black outer box only.
    const sigRows = [_sig.titleRowIdx-2, _sig.titleRowIdx-1, _sig.titleRowIdx, _sig.officeRowIdx];
    // hair, to match every other interior gridline (thin read as too bold).
    const _W={style:'hair',color:{rgb:'FFFFFF'}}, _B={style:'hair',color:{rgb:'000000'}};
    sigRows.forEach((r)=>{ for (let c=0;c<N;c++){ const ad=XLSXmod.utils.encode_cell({r,c}); if(!ws[ad]) ws[ad]={t:'s',v:''}; ws[ad].s=ws[ad].s||{};
      const b={ top:_W, bottom:_W, left:_W, right:_W };
      if(r===sigRows[0]) b.top=_B; if(r===_sig.officeRowIdx) b.bottom=_B;
      if(c===0) b.left=_B; if(c===N-1) b.right=_B;
      ws[ad].s.border=b; } });
    [_sig.titleRowIdx, _sig.officeRowIdx].forEach((r, idx)=>{
      // idx 0 = designation row, idx 1 = office/work-location row. The office
      // row is top-aligned so it hugs the designation above it rather than
      // sitting centred in a tall row.
      const isOffice = idx === 1;
      [0,3,7,10].forEach(c=>{ const ad=XLSXmod.utils.encode_cell({r,c}); if(ws[ad]) ws[ad].s=Object.assign({}, ws[ad].s, {
        font:{name:EXPORT_FONT, bold: idx===0, sz:16, color:{rgb:'000000'}},
        alignment:{horizontal:'center', vertical: isOffice ? 'top' : 'center', wrapText:true} }); });
    });

    // TRIAL: hairline grid across the item table.
    //
    // Data rows carried no explicit border at all, so they showed only Excel's
    // faint on-screen gridlines — which do not print. That is why the grid
    // looked complete in some regions and broken in others: the styled rows
    // (header / total / calc) had real borders and the item rows had none.
    //
    // Any cell WITHOUT a border gets a hair box; cells that already carry one
    // are left exactly as they are, so nothing styled above is overwritten.
    // Signature rows are excluded: they are deliberately a clean signing area.
    (function gridItemRows(){
      const HAIR = {style:'hair', color:{rgb:'000000'}};
      const box  = ()=> ({top:HAIR, bottom:HAIR, left:HAIR, right:HAIR});
      const firstSigRow = _sig.titleRowIdx - 2;
      const lastRow = XLSXmod.utils.decode_range(ws['!ref']).e.r;
      for (let r = 0; r <= lastRow; r++) {
        if (r < BANNER_ROWS) continue;       // MSETCL banner block
        if (r >= firstSigRow) continue;      // signing area
        for (let c = 0; c < N; c++) {
          const ad = XLSXmod.utils.encode_cell({r, c});
          if (!ws[ad]) ws[ad] = {t:'s', v:''};
          ws[ad].s = ws[ad].s || {};
          if (!ws[ad].s.border) ws[ad].s.border = box();
        }
      }
    })();

    applyMsetclHeaderBanner(ws, N);

    // ---- widths (content-fitted; amount cols sized to formatted value, no ###) ----
    applySmartColWidths(ws, rows);
    ws['!cols'] = ws['!cols'] || [];
    for (let ci=amtCol0; ci<N; ci++){
      let maxLen = 6;
      for (let r=0;r<rows.length;r++){ const ad=XLSXmod.utils.encode_cell({r,c:ci}); const cell=ws[ad]; if(cell && typeof cell.v==='number'){ const txt='₹'+fmtNum(cell.v); if(txt.length>maxLen) maxLen=txt.length; } }
      ws['!cols'][ci] = { wch: (ws['!cols'][ci]&&ws['!cols'][ci].wch?Math.max(ws['!cols'][ci].wch,maxLen+2):maxLen+2) };
    }
    ws['!cols'].forEach((col,ci)=>{ const head=String(H[ci]||'').toLowerCase();
      if(ci===0) col.wch = 6;                                                       // Sr.No — narrow
      if(/material\/service|material no|service no/.test(head)) col.wch=Math.max(col.wch||14,16);
      if(/uom/.test(head)) col.wch=Math.max(col.wch||8,9);
      if(/quantity|qty/.test(head)) col.wch=Math.max(col.wch||8,9);
      if(/freight|f&i|insurance/.test(head)) col.wch=Math.max(9,col.wch||10);
      if(/total amount including gst|incl.*gst|total.*gst/.test(head)) col.wch=Math.max(col.wch||14,16);
      // Description base width is 42. With ZEST03's Full Description present,
      // Description drops to 80% (33.6) and Full Description takes 150% (63).
      if(/full\s*description/.test(head)) col.wch = 63;                             // 150% of 42
      else if(/description/.test(head)) col.wch = fullCol>-1 ? 33.6                 // 80% of 42
                                               : Math.max(col.wch||20,42);         // wide, wraps → taller rows
      if(/sor status|status/.test(head)) col.wch=Math.max(col.wch||10,12);
    });

    // ---- freeze header rows + auto row heights ----
    ws['!freeze'] = { xSplit:0, ySplit:colHdrIdx+1, topLeftCell:XLSXmod.utils.encode_cell({r:colHdrIdx+1,c:0}), activePane:'bottomLeft', state:'frozen' };
    // Row 0 doubled for the 37pt company name; row 1 sized for the 28pt title.
    const secMins = {0:42, 1:39, 2:26.2, 3:26.2, 4:26.2}; secMins[titleIdx]=36.8; secMins[colHdrIdx]=67.5;
    secMins[wordsIdx]=38.2; secMins[_sig.titleRowIdx]=48; secMins[_sig.officeRowIdx]=48;
    secMins[_sig.titleRowIdx-2]=30; secMins[_sig.titleRowIdx-1]=30;   // two rows above signatories, 1.5x
    ws['!rows'] = ws['!rows'] || [];
    calcHiddenRows.forEach(r=>{ ws['!rows'][r] = Object.assign({}, ws['!rows'][r], { hidden:true, level:1 }); });
    autoRowHeights(ws, 14, secMins);
    calcHiddenRows.forEach(r=>{ ws['!rows'][r] = Object.assign({}, ws['!rows'][r], { hidden:true, level:1 }); });
    XLSXmod.utils.book_append_sheet(wb, ws, sanitizeSheetName(name));
  });

  // Non-SOR: MATERIALS and SERVICES get a sheet each. They cannot share one
  // sheet because their charge columns differ (a services section may carry
  // no F&I, so the two have different header sets and column counts).
  // (Non-SOR sheets are produced by the shared section builder above.)


  // Final sheet: PMO / PR Numbers — formatted to match the approved sheet
  const filledPmoPr = pmoPrAllFilled(e);
  if (filledPmoPr.length) {
    const header = estimateHeaderRows(e, '', 'PMO / PR Numbers');
    // Three columns, with B:C merged on every row so the Number has room to
    // print on one line. PR numbers are long (EE/400Kv/RS/DN/KARJAT/...) and
    // were wrapping inside a single 20-character column.
    const rows = header.concat([['PMO / PR Numbers']], [['Label','Number','']], filledPmoPr.map(p=>[p.label, p.number, '']));
    const ws = XLSXmod.utils.aoa_to_sheet(rows);
    ws['!noZebra'] = true;
    const styleMap = {};
    styleMap[header.length] = 'section';
    styleMap[header.length+1] = 'header';
    applyRowStyles(ws, styleMap, 3);
    { const ad=XLSXmod.utils.encode_cell({r:header.length,c:0}); if(ws[ad]) ws[ad].s=Object.assign({}, XLSX_STYLES.section); }
    // zebra on alternate data rows
    const dataStart = header.length+2;
    for (let i=dataStart; i<rows.length; i++){
      if ((i-dataStart)%2===1) for (let c=0;c<3;c++){ const ad=XLSXmod.utils.encode_cell({r:i,c}); if(ws[ad]){ ws[ad].s=ws[ad].s||{}; ws[ad].s.fill={patternType:'solid',fgColor:{rgb:'F4F7FC'}}; } }
    }
    // Merge B:C on the column-header row and every data row.
    ws['!merges'] = ws['!merges'] || [];
    for (let i = header.length+1; i < rows.length; i++) ws['!merges'].push({s:{r:i,c:1}, e:{r:i,c:2}});
    applyMsetclHeaderBanner(ws, 3);
    ws['!cols'] = [{wch:75.29},{wch:20},{wch:24}];
    ws['!freeze'] = { xSplit:0, ySplit:dataStart, topLeftCell:XLSXmod.utils.encode_cell({r:dataStart,c:0}), activePane:'bottomLeft', state:'frozen' };
    autoRowHeights(ws, 14, {0:42, 1:39, 2:26.2, 3:26.2, 4:26.2, [header.length]:36.8, [header.length+1]:28.5});
    XLSXmod.utils.book_append_sheet(wb, ws, 'PMO-PR Numbers');
  }

  // Final Estimate mode: append the uploaded ZEST03 sheet as its own tab
  if (typeof FE!=='undefined' && FE.attachRaw && FE.rawGrid) {
    const wsRaw = XLSXmod.utils.aoa_to_sheet(FE.rawGrid);
    applySmartColWidths(wsRaw, FE.rawGrid);
    XLSXmod.utils.book_append_sheet(wb, wsRaw, sanitizeSheetName(FE.rawSheetLabel||'ZEST03'));
  }
  XLSXmod.writeFile(wb, `${(e.name||'Estimate').replace(/[^a-z0-9]+/gi,'_')}.xlsx`, {cellStyles: true});
  toast('Excel ready', 'ok');
}

// ════════════════════════════════════════════════════════════════
// DIRECT-DOWNLOAD LANDSCAPE PDF (pdfmake)
// window.print() can't reliably force landscape (mobile Safari ignores
// @page) and paginates inconsistently. pdfmake builds a real PDF file with
// landscape baked in and deterministic tables — column widths use 'auto'
// (fit content, numbers never crop) and '*' (wrap, for description), so the
// width/overlap problems disappear. White + gold theme, no navy.
// ════════════════════════════════════════════════════════════════
let _pdfLibPromise = null;
function ensurePdfLib() {

    let rest = (100 - dW - fW) / others;
    const MIN_COL = 3.6;
    if (rest < MIN_COL) {
      const avail = Math.max(100 - MIN_COL*others, 20), tot = dW + fW;
      dW = avail*dW/tot; fW = avail*fW/tot; rest = MIN_COL;
    }
    for (let i=0;i<n;i++) sw[i] = +(i===2 ? dW : (i===fullIdx ? fW : rest)).toFixed(2);

    // Non-SOR sheets are signed by three, not four — same rule as the workbook.
    const sigs = def.skipFirstSig ? printSignatoryHtml(e, {skipFirst:true}) : printSignatoryHtml(e);
    html += `<div class="pg">${banner(def.name)}${
      printHtmlTable([rows[0].map(pdfAbbrHeader)].concat(rows.slice(1)),
        {rupeeCol:(i)=>i>=amt0, widths:sw, leftCol:(i)=>i===2||i===fullIdx})}${sigs}</div>`;
  });

  // ── 3. PMO / PR Numbers, the workbook's last tab ──
  const pmoRows = pmoPrAllFilled(e);
  if (pmoRows.length) {
    html += `<div class="pg">${banner('PMO / PR Numbers')}${
      printHtmlTable([['Label','Number']].concat(pmoRows.map(x=>[x.label, x.number])),
        {widths:[70,30], leftCol:(i)=>i===0||i===1})}${printSignatoryHtml(e)}</div>`;
  }

  root.innerHTML = html;
  doPrintAndCleanup(root);
}
// Signatory footer for printed pages (mirrors the sheet footer).
function printSignatoryHtml(e, opts){
  let sig = estimateSignatories(e);
  // Non-SOR sheets carry only the last three signatories — they are audited
  // separately before the main sheets are signed.
  if (opts && opts.skipFirst) sig = sig.slice(1);
  sig = sig.filter(s=>!s.hidden);
  if (!sig.length) return '';
  return `<table class="print-sig" style="margin-top:22px;border:none"><tr>${
    sig.map(s=>`<td style="border:none;text-align:center;vertical-align:bottom;padding:6px 10px;font-size:11px">
      <div style="font-weight:bold">${escapeHtml(s.title||'')}</div>
      <div>${escapeHtml(s.office||'')}</div></td>`).join('')
  }</tr></table>`;
}
// Print the ACTUAL preview DOM — no regenerated document, so what is on
// screen is exactly what comes out. The preview node is moved into a portal at
// the end of <body> for the duration of the print (a print stylesheet cannot
// reliably isolate a node nested inside collapsed/positioned ancestors), then
// put straight back. Abstract / Supply / ETC / O&M each break to a new page.
function feDownloadPrint(orientation){
  const src = document.getElementById('fe-result');
  if (!src || !src.querySelector('.fe-print-page')) {
    toast('Upload a ZEST03 sheet first — there is nothing to print yet.','warn',4000); return;
  }
  if (!orientation) { askPrintOrientation(o => feDownloadPrint(o)); return; }

  // @page size cannot be switched by a class, so the chosen orientation is
  // injected as a stylesheet for the duration of the print.
  const pageStyle = document.createElement('style');
  pageStyle.id = 'fe-print-page-style';
  pageStyle.textContent = `@page{ size:A4 ${orientation==='portrait'?'portrait':'landscape'}; margin:10mm; }`;
  document.head.appendChild(pageStyle);

  // Any isolation CSS left behind by another print would hide this portal.
  if (_printStyleEl) _printStyleEl.textContent = '';

  const portal = document.createElement('div');
  portal.id = 'fe-print-portal';
  const marker = document.createComment('fe-result-home');
  src.parentNode.insertBefore(marker, src);
  portal.appendChild(src);
  document.body.appendChild(portal);
  document.body.classList.add('fe-printing');

  let restored = false;
  const restore = () => {
    if (restored) return; restored = true;
    if (marker.parentNode) marker.parentNode.insertBefore(src, marker);
    marker.remove(); portal.remove(); pageStyle.remove();
    document.body.classList.remove('fe-printing');
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  // afterprint is not guaranteed on every browser — never leave the preview
  // stranded in the portal.
  setTimeout(() => { try { window.print(); } finally { setTimeout(restore, 1500); } }, 80);
}
// Ask orientation before printing — Landscape is the default (wide estimate
// sheets), Portrait offered for narrower prints. Chosen orientation drives
// @page, with fit-to-width and normal margins.
function askPrintOrientation(cb){
  window.__printOrient = (o)=>{ closeModal(); window.__printOrient=null; cb(o); };
  openModal(`
    <div class="modal-head"><h3>Print orientation</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="text-sm">Choose page orientation. The sheet is scaled to fit the page width with normal margins.</p>
    <div class="flex gap-2 justify-end mt-2">
      <button class="btn btn-ghost" onclick="window.__printOrient&&window.__printOrient('portrait')">Portrait</button>
      <button class="btn btn-gold" onclick="window.__printOrient&&window.__printOrient('landscape')">Landscape (default)</button>
    </div>`);
}

// ── SHARED smart column-width helper for PDF tables — genuinely
// content-aware: measures actual header + data string lengths (not just
// column-name pattern matching), so dense tables with many numeric
// columns get widths that actually fit the numbers without wrapping.
// Pass the full row data (dataRows) when available for accurate sizing;
// falls back to header-only pattern heuristics if omitted.
// ── PDF-only header abbreviations. The Excel keeps full, descriptive
// headers; the PDF uses these short forms so columns fit landscape A4
// without cropping the numbers. Extend this map freely — anything not
// listed falls through to the dynamic replacements below.
const PDF_HEADER_ABBR = {
  'Sr.No.':'Sr.',
  'Material/Service No':'Mat/Serv No',
  'Mat / Service Full Description':'Mat / Serv Full Description',
  'Quantity':'Qty',
  'Exworks Price (Rs.)':'Ex-works ₹',
  'Total Ex-works Price excl. T&D (Rs.)':'Total Ex-works ₹',
  'Extra Charge (%)':'AC %',
  'Total incl. Additional Charge':'Total +AC',
  'Ex-Works + Labour Cess':'Ex-w + LC',
  '(Ex-Works+LC) + F&I':'+ F&I',
  'TOTAL AMOUNT INCLUDING GST':'Total +GST',
  "Item's SoR Status":'SoR',
};
function pdfAbbrHeader(h) {
  if (PDF_HEADER_ABBR[h]) return PDF_HEADER_ABBR[h];
  return String(h)
    .replace('Labour Cess', 'Lab.Cess')
    .replace('Freight & Insurance', 'F&I');
}
function smartPdfColWidths(headers, dataRows) {
  const n = headers.length;
  // Character-length-based estimate per column (header vs widest data cell)
  const charWidths = headers.map((h, i) => {
    let maxLen = String(h).length;
    if (dataRows && dataRows.length) {
      for (let r = 0; r < dataRows.length; r++) {
        const v = dataRows[r][i];
        if (v !== undefined && v !== null) {
          const len = (typeof v === 'number') ? fmtNum(v).length : String(v).length;
          if (len > maxLen) maxLen = len;
        }
      }
    }
    return maxLen;
  });
  const isWideText = headers.map(h => {
    const hl = String(h).toLowerCase();
    return hl.includes('description') || hl.includes('remarks') || hl.includes('particulars') || hl.includes('name');
  });

  // Universal minimum so NO column (numeric, narrow, or otherwise) can ever
  // collapse below a width that fits its own content without wrapping —
  // this is what actually prevents numerals wrapping to a second line.
  const MIN_PCT_PER_COL = Math.max(3.2, 70/n); // scales down gracefully as column count grows
  // Wide TEXT columns wrap, so they're CAPPED — they don't need their full
  // length and shouldn't starve the numeric columns. Numeric/short columns
  // CANNOT wrap, so they get their full content length (+padding) to fit the
  // number on one line. This is what stops numerals cropping/overflowing.
  const clamped = charWidths.map((len, i) => isWideText[i] ? Math.min(Math.max(len, 12), 22) : Math.max(len + 1.5, 5));

  const totalChars = clamped.reduce((a,b)=>a+b,0);
  let widths = clamped.map(c => +(c/totalChars*100).toFixed(2));

  // Enforce the universal floor, tracking how much extra space that costs
  let deficit = 0;
  widths = widths.map(w => {
    if (w < MIN_PCT_PER_COL) { deficit += (MIN_PCT_PER_COL - w); return MIN_PCT_PER_COL; }
    return w;
  });
  // Pull the deficit from wide-text columns (which have the most slack);
  // if none exist, shrink proportionally from the largest non-floored columns.
  if (deficit > 0) {
    const wideIdxs = isWideText.map((v,i)=>v?i:-1).filter(i=>i>-1);
    if (wideIdxs.length) {
      const perCol = deficit / wideIdxs.length;
      wideIdxs.forEach(i => { widths[i] = Math.max(8, widths[i] - perCol); });
    } else {
      const sortedIdx = widths.map((w,i)=>[w,i]).sort((a,b)=>b[0]-a[0]).map(p=>p[1]);
      let remaining = deficit;
      for (const i of sortedIdx) {
        if (remaining <= 0) break;
        const take = Math.min(remaining, Math.max(0, widths[i]-MIN_PCT_PER_COL));
        widths[i] -= take; remaining -= take;
      }
    }
  }
  const sum = widths.reduce((a,b)=>a+b,0);
  if (sum !== 100) widths = widths.map(w => +(w*100/sum).toFixed(2));
  return widths;
}
