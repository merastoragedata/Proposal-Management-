<script>
/* ── EARLY BOOT FETCH ──────────────────────────────────────────────────────
   The app is one large inline script. Parsing it takes real time on mobile,
   and until now the first backend request could not start until that parse
   finished — the two costs ran back to back. This tiny head script fires the
   session-check + Home-data request IMMEDIATELY, so the ~2s Apps Script round
   trip overlaps with script parsing instead of following it. boot() picks up
   the in-flight promise. Everything is wrapped so a failure here can never
   block startup: boot() just falls back to requesting normally. */
window.__EARLY_BOOT = (function () {
  try {
    if (!window.fetch || !window.localStorage) return null;
    // ⚠ SET THIS — must match BACKEND_URL further down in this file.
    var url = localStorage.getItem('epm_backend_url') ||
      "https://vjakvbaxkspozyplpnan.supabase.co/functions/v1/epm-api";
    var raw = localStorage.getItem(TOKEN_KEY);
    if (!url || !raw) return null;                 // logged out → login screen, nothing to prefetch
    var tok = JSON.parse(raw);
    if (!tok || !tok.id) return null;
    return fetch(url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain avoids a CORS preflight
      body: JSON.stringify({ action: 'loginUser', id: tok.id, passHash: tok.passHash, withBoot: 1, lite: 1 })
    }).then(function (r) { return r.text(); })
      .catch(function () { return null; });        // resolve to null; boot() retries properly
  } catch (e) { return null; }
})();
</script>

// ── API layer (mined from working reference impl) ─────────────
async function api(action, params={}) {
  const qs = new URLSearchParams({action, ...params}).toString();
  const url = `${SURL}?${qs}`;
  try {
    const r = await fetch(url, {redirect:'follow'});
    const txt = await r.text();
    if (!txt || txt.trim()==='') throw new Error('Empty response from script');
    if (txt.trim().startsWith('<')) {
      throw new Error('Script returned HTML — check deployment settings (Execute as: Me, Access: Anyone)');
    }
    return JSON.parse(txt);
  } catch(e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      throw new Error('Network error — check your connection or the Apps Script deployment URL');
    }
    throw e;
  }
}
async function apiPost(body) {
  try {
    const r = await fetch(SURL, {
      method: 'POST', redirect: 'follow',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(body)
    });
    const txt = await r.text();
    if (!txt || txt.trim()==='') throw new Error('Empty response from script');
    if (txt.trim().startsWith('<')) {
      throw new Error('Script returned HTML — check deployment: Execute as Me, Access: Anyone');
    }
    return JSON.parse(txt);
  } catch(e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      throw new Error('Network error — check your connection or the Apps Script deployment URL');
    }
    throw e;
  }
}

// ── hashPass: isolated behind a function so it can be swapped later ──
function hashPass(p) {
  let h = 0;
  for (let i=0;i<p.length;i++){ h = ((h<<5)-h)+p.charCodeAt(i); h |= 0; }
  return 'h'+Math.abs(h).toString(36);
}

// ── calcItem — mined verbatim from working reference implementation ──
// sec is the item's ACTUAL section (supply/project/om) - this determines the
// calculation formula. acKeyOverride lets non-SOR tabs use their own
// Additional Charge radio (nonsor_supply) while still using the 'supply' formula.
function calcItem(item, oe, acKeyOverride) {
  const sec=item.section, base=item.qty*item.rate;
  const ACp=oe.additionalCharge/100, LC=oe.labourCess/100, FI=oe.freightInsurance/100, GST=oe.gst/100;
  const acKey = acKeyOverride || sec;
  const useAC = ST.currentEstimate && ST.currentEstimate.addCharge && ST.currentEstimate.addCharge[acKey]==='yes';
  if (sec==='supply') {
    const ac=useAC?base*ACp:0, sAC=base+ac, lc=sAC*LC, sLC=sAC+lc, fi=sLC*FI, sFI=sLC+fi, gst=sFI*GST;
    return {base,ac,lc,fi,gst,total:sFI+gst};
  } else if (sec==='project') {
    const ac=useAC?base*ACp:0, sAC=base+ac, lc=sAC*LC, sLC=sAC+lc, gst=sLC*GST;
    return {base,ac,lc,fi:0,gst,total:sLC+gst};
  } else {
    const lc=base*LC, sLC=base+lc, gst=sLC*GST;
    return {base,ac:0,lc,fi:0,gst,total:sLC+gst};
  }
}

// ── toWords — mined verbatim: Indian numbering, includes paise ──
function toWords(n) {
  if (!n || n===0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function tw(x){return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');}
  function th(x){return x>=100?ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+tw(x%100):''):tw(x);}
  const rupees=Math.floor(n);
  const paise=Math.round((n-rupees)*100);
  let r=rupees;
  const cr=Math.floor(r/1e7);r%=1e7;
  const lac=Math.floor(r/1e5);r%=1e5;
  const thou=Math.floor(r/1000);r%=1000;
  let w='';
  if (cr)   w+=th(cr)+' Crore ';
  if (lac)  w+=tw(lac)+' Lakh ';
  if (thou) w+=tw(thou)+' Thousand ';
  if (r)    w+=th(r);
  w=w.trim();
  if (paise>0) w+=' and '+tw(paise)+' Paise';
  return w||'Zero';
}

// ── Indian currency formatting ──
function fmtINR(n, decimals=2) {
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  const fixed = n.toFixed(decimals);
  const parts = fixed.split('.');
  const intPart = parts[0], decPart = parts[1];
  let last3 = intPart.length>3 ? intPart.slice(-3) : intPart;
  let rest = intPart.length>3 ? intPart.slice(0,-3) : '';
  if (rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  const out = (rest ? rest+',' : '') + last3 + (decimals>0 ? '.'+decPart : '');
  return (neg?'-':'') + '₹' + out;
}
function fmtDate(d){
  if (!d && d!==0) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(dt.getDate()).padStart(2,'0') + '-' + M[dt.getMonth()] + '-' + dt.getFullYear();
}
function fmtQty(n){ const v=Number(n)||0; return Number.isInteger(v)? String(v) : String(v); }
function fmtNum(n, decimals=2) {
  return Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:0, maximumFractionDigits:decimals});
}

// ── Toast system ──
// ── Detects the specific "Unknown action" backend response and turns it
// into an actionable message — this error means the deployed Code.gs is
// missing that action entirely (almost always a stale/wrong deployment
// URL), not a data or permission problem. Used wherever a backend call
// could plausibly hit a newly-added action. ──
function explainBackendError(rawError) {
  if (rawError && /unknown action/i.test(rawError)) {
    return `${rawError} — the backend deployment doesn't have this feature yet. Go to Admin Panel → Database Connection → Test Connection to check which version is actually live, then redeploy the latest Code.gs as a NEW VERSION (not just saved).`;
  }
  return rawError;
}

function toast(msg, type='ok', ms=3400) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='ok' ? '✓' : type==='err' ? '✕' : '!';
  el.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease, transform .3s ease'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, ms);
}

function escapeHtml(s) {
  if (s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix='ID') { return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function debounce(fn, wait=220) {
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

// ── Date fields shown and typed as 12-Jun-2026 ────────────────────────────
// A native <input type="date"> always renders in the browser/OS locale
// (06/12/2026, 12.06.2026, …) and that is not restylable. So the visible
// control is a text box in dd-Mmm-yyyy, while a hidden native input keeps the
// ISO value and supplies the calendar picker. The hidden input carries the
// caller's id, so existing code reading getElementById(id).value still gets
// ISO back and nothing downstream has to change.
const DF_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Accepts 12-Jun-2026, 12 Jun 2026, 2026-06-12, 12-06-2026, 12/06/2026.
// Bare numeric forms are read day-first (Indian convention), never month-first.
function dfParse(str){
  const s = String(str||'').trim();
  if (!s) return '';
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return dfISO(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/ ]([A-Za-z]{3,})[-/ ](\d{4})$/))) {
    const mi = DF_MONTHS.findIndex(x => x.toLowerCase() === m[2].slice(0,3).toLowerCase());
    return mi < 0 ? '' : dfISO(+m[3], mi+1, +m[1]);
  }
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return dfISO(+m[3], +m[2], +m[1]);
  return '';
}
function dfISO(y, mo, d){
  if (!(mo>=1 && mo<=12) || !(d>=1 && d<=31)) return '';
  const dt = new Date(y, mo-1, d);
  if (dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return '';  // rejects 31-Feb
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dfDisplay(iso){ return iso ? fmtDate(iso) : ''; }

// Dates arriving from an uploaded ZEST03 can be in any format the source
// document used ("20-Jul-2026", "20/07/2026"). Storage must stay ISO
// (YYYY-MM-DD): a native <input type="date"> silently blanks anything else,
// and the next save would then write that blank back, erasing the date.
// So normalise on the way IN, and format only on the way OUT.
function dfNormalise(v){
  const raw = String(v||'').trim();
  if (!raw) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;   // already ISO
  return dfParse(raw) || raw;                          // else parse, else keep
}

function dateFieldHtml(id, iso, opts){
  const o = opts||{};
  const dis = o.disabled ? 'disabled' : '';
  return `<div class="df-wrap${o.disabled?' df-disabled':''}">
    <input type="text" class="df-text" id="${id}-text" value="${escapeHtml(dfDisplay(iso))}"
           placeholder="DD-Mmm-YYYY" autocomplete="off" ${dis}
           onchange="dfCommit('${id}')" onblur="dfCommit('${id}')"
           onkeydown="if(event.key==='Enter'){event.preventDefault();dfCommit('${id}');}">
    <button type="button" class="df-cal" ${dis} onclick="dfOpen('${id}')" aria-label="Choose date" tabindex="-1">📅</button>
    <input type="date" class="df-native" id="${id}" value="${escapeHtml(iso||'')}" ${dis}
           onchange="dfSync('${id}')" tabindex="-1" aria-hidden="true">
  </div>`;
}
// Native picker changed → refresh the visible text.
function dfSync(id){
  const nat = document.getElementById(id), txt = document.getElementById(id+'-text');
  if (nat && txt) txt.value = dfDisplay(nat.value);
}
// Typed text committed → parse into the native input, then normalise the text.
// Unparseable input reverts to the last good value rather than silently
// clearing a date the user did not mean to erase.
function dfCommit(id){
  const nat = document.getElementById(id), txt = document.getElementById(id+'-text');
  if (!nat || !txt) return;
  const raw = txt.value.trim();
  if (!raw) { nat.value = ''; txt.value = ''; return; }
  const iso = dfParse(raw);
  if (iso) { nat.value = iso; txt.value = dfDisplay(iso); }
  else { txt.value = dfDisplay(nat.value); }
}
function dfOpen(id){
  const nat = document.getElementById(id);
  if (!nat || nat.disabled) return;
  try { if (typeof nat.showPicker === 'function') { nat.showPicker(); return; } } catch(e){ /* fall through */ }
  nat.focus(); nat.click();
}
// Set a date field programmatically (keeps text and native input in step).
function dfSet(id, iso){
  const nat = document.getElementById(id), txt = document.getElementById(id+'-text');
  if (nat) nat.value = iso||'';
  if (txt) txt.value = dfDisplay(iso);
}

// ── Permission helpers ──
function isAdmin(){ return ST.user && ST.user.role==='admin'; }
function isViewer(){ return ST.user && ST.user.role==='viewer'; }
function isUser(){ return ST.user && ST.user.role==='user'; }
function canEdit(){ return !isViewer(); }
function ownsEstimate(est){ return ST.user && (isAdmin() || est.ownerId===ST.user.id); }

// ── Latest version resolution ──
// Plain lexicographic sort fails for human-readable versions containing month
// names (e.g. "SOR_June_2026" sorts before "SOR_March_2026" alphabetically,
// even though June is chronologically later). We extract a trailing year and
// a recognizable month name/number where present and sort on that; if no
// date-like pattern is found anywhere in the version strings, we fall back
// to plain lexicographic sort as a safe default.
const MONTH_INDEX = {jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,
  jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
function versionSortKey(v) {
  const s = String(v).toLowerCase();
  const yearMatch = s.match(/(20\d{2})/);
  const year = yearMatch ? parseInt(yearMatch[1]) : 0;
  let month = 0;
  for (const name in MONTH_INDEX) {
    if (s.includes(name)) { month = Math.max(month, MONTH_INDEX[name]); }
  }
  return year*100 + month;
}
function resolveLatestVersion(versions) {
  if (!versions || !versions.length) return null;
  const hasDateInfo = versions.some(v => versionSortKey(v) > 0);
  if (hasDateInfo) {
    return [...versions].sort((a,b) => versionSortKey(a)-versionSortKey(b)).pop();
  }
  // Fallback: proper lexicographic sort (not insertion order)
  return [...versions].sort().pop();
}
// SOR versions an admin has hidden are invisible to everyone except admin —
// not selectable for new estimates, not shown on the Rates page, not used
// as a fallback match, and never resolved as "latest"/"default" for a
// regular user. Admin always sees the full list (to manage visibility).
function visibleSorVersions() {
  if (isAdmin()) return ST.sorVersions || [];
  const hidden = ST.hiddenSorVersions || [];
  return (ST.sorVersions || []).filter(v => !hidden.includes(v));
}
// The version pre-selected for NEW estimates. Admin can pin a default; when
// unset (or invalid) it falls back to the newest VISIBLE version. Rate
// LOOKUPS cascade: selected version → Non-SOR → older SOR versions
// (reverse chronological), never a version newer than the one selected,
// and never a hidden version.
function resolveDefaultVersion() {
  if (ST.defaultSorVersion && visibleSorVersions().includes(ST.defaultSorVersion)) return ST.defaultSorVersion;
  return resolveLatestVersion(visibleSorVersions());
}

// ── Shared image compression — re-encodes via canvas at reduced quality/
// dimensions to cut file size roughly in half before upload. Used by every
// image upload path in the app (progress images, T-Code/Process images). ──
function compressImageFile(file, quality=0.5, maxDim=1600) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the image file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode the image file'));
      img.onload = () => {
        let {width, height} = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg'});
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function boot() {
  if (!SURL) {
    if (window.__hideBootSplash) window.__hideBootSplash();
    renderSetupScreen();
    return;
  }
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) {
    try {
      const tok = JSON.parse(saved);
      // Prefer the response already in flight from the head script. It carries
      // the session check AND the Home payload, so a warm boot costs ONE round
      // trip instead of two serial ones. Any miss falls back to the old path.
      let res = null;
      if (window.__EARLY_BOOT) {
        try {
          const txt = await window.__EARLY_BOOT;
          if (txt && !txt.trim().startsWith('<')) res = JSON.parse(txt);
        } catch (e) { res = null; }
      }
      // A combined login+boot reply can come back ok:true yet carry no user
      // (an older backend, a truncated reply, a bootstrap-shaped payload).
      // Trusting ok alone left ST.user undefined and renderAppShell then threw
      // "Cannot read properties of undefined (reading 'name')". Re-request
      // properly instead of proceeding with no user.
      if (!res || !res.user) {
        res = await apiPost({action:'loginUser', id: tok.id, passHash: tok.passHash, withBoot: 1, lite: 1});
      }
      if (res.ok && res.user) {
        ST.user = res.user;
        // res carries the bootstrap payload when the backend supports it;
        // enterApp falls back to fetching it itself when it doesn't.
        await enterApp(res.estimates !== undefined ? res : null);
        return;
      }
    } catch(e) { /* fall through to login screen */ }
    localStorage.removeItem(TOKEN_KEY);
  }
  if (window.__hideBootSplash) window.__hideBootSplash();
  renderAuthScreen();
}

// ── Background refresh ────────────────────────────────────────────────────
// Everything the app needs arrives in the boot payload, then this quietly
// re-fetches it so the caches never go stale. It never blocks the UI, never
// touches the page the user is on, and skips entirely while the tab is
// hidden or a request is already in flight. Opening an individual estimate
// still fetches that estimate fresh — this only refreshes the shared caches.
let _bgTimer = null, _bgBusy = false;
const BG_REFRESH_MS = 10 * 60 * 1000;
function startBackgroundRefresh(){
  if (_bgTimer) clearInterval(_bgTimer);
  _bgTimer = setInterval(backgroundRefresh, BG_REFRESH_MS);
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) backgroundRefresh();     // catch up on return
  });
}
async function backgroundRefresh(){
  if (_bgBusy || document.hidden || !ST.user || !ST.bootDone) return;
  _bgBusy = true;
  try {
    // LITE refresh only — the estimate list and rates. Catalogs stay on demand;
    // re-reading every sheet on a timer is what made the app feel sluggish.
    const boot = await api('bootstrap', {userId: ST.user.id, role: ST.user.role, lite: '1'});
    if (!boot || !boot.ok) return;
    ST.estimates    = boot.estimates    || ST.estimates;
    ST.chargeRates  = boot.chargeRates  || ST.chargeRates;
    ST.sorVersions  = boot.sorVersions  || ST.sorVersions;
    if (boot.users) ST.users = boot.users;
    // Only repaint the dashboard, and only if that is what is on screen —
    // never yank the page out from under someone mid-edit.
    if (ST.activeTab === 'dashboard' && !ST.currentEstimate) renderActiveTab();
  } catch(e){ /* silent: a failed background refresh must never disturb the user */ }
  finally { _bgBusy = false; }
}

async function enterApp(preloadedBoot) {
  renderAppShell();
  showPageLoading();
  try {
    // Single round trip instead of 6-7 parallel calls — each Apps Script
    // call pays its own execution overhead even when fired concurrently,
    // so combining them into one request is the bigger win for boot speed.
    // FIRST LOAD: fetch only what Home needs. Everything else is fetched
    // on demand by the page that uses it.
    // preloadedBoot arrives already merged into the login response (one round
    // trip); only fetch separately when that wasn't available.
    const boot = preloadedBoot || await api('bootstrap', {userId: ST.user.id, role: ST.user.role, lite: '1'});
    if (!boot.ok) throw new Error(boot.error || 'Failed to load app data');

    ST.sorVersions = boot.sorVersions||[];
    ST.sorCodes = boot.sorCodes||{};
    ST.defaultSorVersion = boot.defaultSorVersion||'';
    if (boot.userDefaultSignatories && boot.userDefaultSignatories.length===4) ST.user.defaultSignatories = boot.userDefaultSignatories;
    ST.sorVersionCounts = boot.sorVersionCounts||{};
    ST.hiddenSorVersions = boot.hiddenSorVersions||[];
    ST.nonSorCache = boot.nonSor||[];
    ST.tcodesCache = boot.tcodes||[];
    ST.processesCache = boot.processes||[];
    ST.liteBoot = !!boot.lite;   // secondary catalogs not loaded yet
    ST.estimatesCache = boot.estimates||[];
    ST.chargeRates = boot.chargeRates || ST.chargeRates;
    ST.aiAllowed = !!boot.aiAllowed;
    ST.printAllowed = !!boot.printAllowed;
    ST.aiKeyConfigured = !!boot.aiKeyConfigured;
    if (isAdmin() && boot.users) ST.usersCache = boot.users;

    // Show the dashboard immediately after the single bootstrap round trip.
    // SOR items (only needed by Add Items / Final Estimate) load in the
    // background; pages that need them await ST.sorReady.
    ST.bootDone = true;
    navigateTo('dashboard');
    if (window.__hideBootSplash) window.__hideBootSplash();
    ST.sorReady = loadSorData();
    // STEP-BY-STEP loading, deliberately. Nothing else is fetched here.
    // The Non-SOR catalog, T-Codes and Processes are pulled by the page that
    // actually needs them (ensureNonSorLoaded / ensureTcpLoaded). Firing a
    // full bootstrap right after login meant every sheet in the workbook was
    // read before the user could do anything.
    startBackgroundRefresh();
  } catch(e) {
    if (window.__hideBootSplash) window.__hideBootSplash();
    toast('Failed to load app data: '+e.message, 'err', 6000);
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="ic">⚠️</div>
        <h3>Could not connect to the backend</h3>
        <p class="text-sm mt-1">${escapeHtml(e.message)}</p>
        <button class="btn btn-primary mt-2" onclick="enterApp()">Retry</button>
      </div>`;
  }
}
async function loadSorData() {
  const latest = resolveLatestVersion(visibleSorVersions());
  if (latest) {
    try { const r = await api('getSOR', {version: latest}); if (r.ok) ST.sorCache = r.items||[]; } catch(e){}
  }
  // refresh the SOR count stat on the dashboard if it's showing
  const el = document.getElementById('stat-sor-count');
  if (el) el.textContent = ST.sorCache.length.toLocaleString('en-IN');
  prefetchRemainingSOR();
  return true;
}
// Non-SOR catalog — needed by Add Items, rate lookups and uploads.
async function ensureNonSorLoaded() {
  if (!ST.liteBoot || ST._nonSorLoaded) return true;
  try {
    const res = await api('getNonSOR');
    if (res.ok) { ST.nonSorCache = res.items || []; ST._nonSorLoaded = true; }
  } catch(e){}
  return true;
}
// T-Codes & Processes — only the T-Codes page uses these.
async function ensureTcpLoaded() {
  if (!ST.liteBoot || ST._tcpLoaded) return true;
  try {
    const [t, p] = await Promise.all([api('getTCodes'), api('getProcesses')]);
    if (t.ok) ST.tcodesCache = t.items || [];
    if (p.ok) ST.processesCache = p.items || [];
    ST._tcpLoaded = true;
  } catch(e){}
  return true;
}
// Pages needing the SOR catalog call this — shows a loader until ready.
async function ensureSorLoaded() {
  if (ST.sorCache && ST.sorCache.length) return true;
  if (ST.sorReady) { try { await ST.sorReady; } catch(e){} }
  return !!(ST.sorCache && ST.sorCache.length);
}

function prefetchRemainingSOR() {
  // Older SOR versions are only needed for rate-cascade lookups, so this runs
  // well AFTER the app is usable — otherwise a serial run of slow backend
  // calls competes with the user's first interactions and everything feels
  // sluggish. Fires once, late, and only while the tab is visible.
  // DISABLED as a blanket prefetch. Each older SOR version costs a full
  // sheet read on the backend, and Apps Script runs one execution at a time
  // per user — so pulling every version in the background queued behind (and
  // slowed down) everything the user actually did. Versions are now loaded
  // one at a time, only when an estimate that uses one is opened.
  return;
}

// Load a single SOR version on demand, once. This is the step-by-step path:
// nothing is fetched until something actually needs it.
const _sorVersionsLoaded = new Set();
async function ensureSorVersionLoaded(version){
  if (!version) return true;
  const latest = resolveLatestVersion(visibleSorVersions());
  if (version === latest) return ensureSorLoaded();
  if (_sorVersionsLoaded.has(version)) return true;
  _sorVersionsLoaded.add(version);
  try {
    const res = await api('getSOR', {version});
    if (res.ok) ST.sorCache = (ST.sorCache||[]).concat(res.items||[]);
  } catch(e) { _sorVersionsLoaded.delete(version); return false; }
  return true;
}

    // login also lands on the dashboard in a single round trip.

    if (!res.ok) { errEl.textContent = res.error||'Login failed.'; errEl.style.display='block'; return; }

function navigateTo(page, params={}, fromPop=false) {
  ST.currentPage = page;
  ST.currentPageParams = params;
  closeUserMenu();
  document.querySelectorAll('.nav-item[data-nav], .mnav-item[data-nav]').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav===page);
  });
  // Browser history: pushing a state per navigation makes the browser/OS Back
  // button (and swipe-back) return to the previous in-app page.
  if (!fromPop) {
    try { history.pushState({page, params}, '', '#'+page); } catch(e){}
  }
  const main = document.getElementById('main-content');
  main.innerHTML = ''; // ensure pageIn animation replays
  void main.offsetWidth;
  main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
  window.scrollTo({top:0, behavior:'instant'});

  switch(page) {
    case 'dashboard': renderDashboardPage(); break;
    case 'orderbook': renderOrderBookPage(); break;
    case 'ai-creator': if (ST.aiAllowed || isAdmin()) renderAiCreatorPage(); else navigateTo('dashboard'); break;
    case 'smartfill': renderSmartFillPage(); break;
    case 'final-estimate': renderFinalEstimatePage(); break;
    case 'rates': renderRatesPage(); break;
    case 'tcodes': renderTCodesPage(); break;
    case 'admin': if (isAdmin()) renderAdminPage(); else navigateTo('dashboard'); break;
    case 'estimate-new': renderEstimateStep1(!!params.preserveItems); break;
    case 'estimate-edit': renderEstimateWorkspace(params.id); break;
    case 'progress': renderProgressPage(params.id); break;
    default: renderDashboardPage();
  }
}

    <div class="modal-head"><h3>Change Password</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Current Password</label><input type="password" id="cp-old"></div>
    <div class="field"><label>New Password</label><input type="password" id="cp-new"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="cp-new2"></div>
    <div id="cp-error" class="error-text" style="display:none"></div>
    <button class="btn btn-primary btn-block mt-1" onclick="submitChangePassword()">Update Password</button>
  `);
}
async function submitChangePassword() {
  const oldP = document.getElementById('cp-old').value;
  const newP = document.getElementById('cp-new').value;
  const newP2 = document.getElementById('cp-new2').value;
  const err = document.getElementById('cp-error');
  err.style.display='none';
  if (!oldP || !newP) { err.textContent='All fields required.'; err.style.display='block'; return; }
  if (newP !== newP2) { err.textContent='New passwords do not match.'; err.style.display='block'; return; }
  try {
    const res = await apiPost({action:'changePassword', id:ST.user.id, oldHash:hashPass(oldP), newHash:hashPass(newP)});
    if (!res.ok) { err.textContent = res.error||'Failed.'; err.style.display='block'; return; }
    toast('Password updated.', 'ok');
    closeModal();
    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) localStorage.setItem(TOKEN_KEY, JSON.stringify({id:ST.user.id, passHash:hashPass(newP)}));
  } catch(e) { err.textContent = e.message; err.style.display='block'; }
}

// Promise-based confirm dialog (resolves true/false).
function confirmDialog(title, message, okLabel='Confirm', cancelLabel='Cancel'){
  return new Promise((resolve)=>{
    window.__confirmResolve = (v)=>{ closeModal(); window.__confirmResolve=null; resolve(v); };
    openModal(`
      <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="window.__confirmResolve&&window.__confirmResolve(false)">✕</button></div>
      <p class="text-sm" style="line-height:1.6">${escapeHtml(message)}</p>
      <div class="flex gap-2 justify-end mt-2">
        <button class="btn btn-ghost" onclick="window.__confirmResolve&&window.__confirmResolve(false)">${escapeHtml(cancelLabel)}</button>
        <button class="btn btn-gold" onclick="window.__confirmResolve&&window.__confirmResolve(true)">${escapeHtml(okLabel)}</button>
      </div>`);
  });
}

// ── Shared save-button status pattern: button shows a spinner while the
// async action runs, then a brief checkmark, then reverts — paired with a
// toast from the corner. Used by every Save button in the app. ──
async function withSaveStatus(btn, asyncFn, savedMessage='Saved') {
  if (!btn) { await asyncFn(); return; }
  const origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving…';
  try {
    const result = await asyncFn();
    if (result !== false) {
      btn.innerHTML = '✓ Saved';
      toast(savedMessage, 'ok');
      setTimeout(()=>{ btn.innerHTML = origHtml; btn.disabled = false; }, 1100);
    } else {
      btn.innerHTML = origHtml; btn.disabled = false;
    }
  } catch(e) {
    btn.innerHTML = origHtml; btn.disabled = false;
    toast(e.message||'Save failed', 'err');
  }
}

// ── Collapsible helper ──
function toggleCollapse(el) {
  const box = el.closest('.collapse');
  if (!box) return;
  const body = box.querySelector(':scope > .collapse-body') || box.querySelector('.collapse-body');
  if (!body) { box.classList.toggle('open'); return; }

  // The open state used to be a flat CSS `max-height:3000px`, which silently
  // CROPPED any panel taller than that — a long Final Estimate lost every row
  // past ~3000px. The resting open state is now `max-height:none` (no ceiling
  // at all); the inline value below exists only for the duration of the
  // animation and is cleared afterwards, so content can grow freely and
  // anything rendered into an already-open panel is never clipped.
  const opening = !box.classList.contains('open');
  if (body._collapseTimer) { clearTimeout(body._collapseTimer); body._collapseTimer = null; }

  if (opening) {
    body.style.maxHeight = '0px';
    void body.offsetHeight;                     // flush, so the transition has a start value
    box.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    void body.offsetHeight;
    box.classList.remove('open');
    body.style.maxHeight = '0px';
  }

  // Clearing the inline value hands control back to CSS: none when open, 0
  // when closed. transitionend can fail to fire (reduced motion, a hidden
  // tab), so a timer guarantees the release either way — the panel must never
  // be left stuck at a fixed pixel height.
  const release = () => {
    body.style.maxHeight = '';
    body.removeEventListener('transitionend', onEnd);
    if (body._collapseTimer) { clearTimeout(body._collapseTimer); body._collapseTimer = null; }
  };
  const onEnd = (ev) => { if (ev.target === body && ev.propertyName === 'max-height') release(); };
  body.addEventListener('transitionend', onEnd);
  body._collapseTimer = setTimeout(release, 700);
}

// Estimates are grouped under each category by Financial Year (taken from
// the Expense Booking FY in Order Related Details), newest FY first, each FY
// collapsible. Estimates with no FY are pulled into a separate "Drafts" list
// at the very bottom. Checkboxes drive what the Excel/PDF exports include;
// the current FY and the drafts are checked by default.
const DASH = { groupByFY:true, sel:null, groups:{}, selecting:false };
function estimateFY(e){ const od=(e.progress&&e.progress.orderDetails)||{}; return (od.expenseBookingFY||'').trim(); }
function currentFYStart(){ const d=new Date(); return d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1; }
function fyStartYear(fy){ const m=String(fy).match(/(\d{4})/); return m?parseInt(m[1]):-1; }
function ensureDashSelection(allList){
  if (DASH.sel) return;
  DASH.sel = new Set();
  const cur = currentFYStart();
  allList.forEach(e=>{ const fy=estimateFY(e); if(!fy || fyStartYear(fy)===cur) DASH.sel.add(e.id); });
}
function dashFilteredList(){
  const all = visibleEstimates();
  const s = document.getElementById('dash-search');
  const q = s ? s.value.trim().toLowerCase() : '';
  if(!q) return all;
  return all.filter(e=> (e.name||'').toLowerCase().includes(q) || (e.number||'').toLowerCase().includes(q) || (e.division||'').toLowerCase().includes(q));
}

function toggleDashGroup(gid, checked){ (DASH.groups[gid]||[]).forEach(id=> checked?DASH.sel.add(id):DASH.sel.delete(id)); renderDashboardCurrent(); }

function renderDashboardList(list) {
  const zone = document.getElementById('dash-list');
  ensureDashSelection(visibleEstimates());
  DASH.groups = {};
  if (!list.length) {
    zone.innerHTML = `<div class="empty-state card"><div class="ic">📂</div><h3>No estimates found</h3><p class="text-sm mt-1">${canEdit() ? 'Create your first estimate to get started.' : 'No estimates are currently visible to you.'}</p></div>`;
    updateDashSelCount(); return;
  }
  const sorted = [...list].sort((a,b)=> new Date(b.savedAt||0) - new Date(a.savedAt||0));
  const cats = [
    {type:'project', label:'🏗️ Project / Scheme / Augmentation'},
    {type:'amc', label:'📋 AMC Works'},
    {type:'rm', label:'🔧 R&M Works'},
  ];
  let html = '';
  if (DASH.groupByFY) {
    const curStart = currentFYStart();
    cats.forEach(cat => {
      const catItems = sorted.filter(e => (e.estimateType||'project')===cat.type);
      if (!catItems.length) return;
      html += `<div class="dash-cat-section"><div class="embroidery" aria-hidden="true"></div><div class="dash-cat-head">${cat.label} <span class="badge badge-neutral">${catItems.length}</span></div>`;
      // FY groups within THIS category, newest FY first
      const fyMap = {};
      catItems.filter(e=>estimateFY(e)).forEach(e => { const fy=estimateFY(e); (fyMap[fy]=fyMap[fy]||[]).push(e); });
      Object.keys(fyMap).sort((a,b)=> fyStartYear(b)-fyStartYear(a)).forEach(fy => {
        const ests = fyMap[fy];
        const gid = cat.type+'|'+fy;
        DASH.groups[gid] = ests.map(e=>e.id);
        html += dashFyGroupHtml(gid, `📅 FY ${escapeHtml(fy)}`, ests, ests.every(e=>DASH.sel.has(e.id)), fyStartYear(fy)===curStart);
      });
      // this category's drafts (no FY) at its own bottom
      const drafts = catItems.filter(e=>!estimateFY(e));
      if (drafts.length) {
        const gid = cat.type+'|draft';
        DASH.groups[gid] = drafts.map(e=>e.id);
        html += dashFyGroupHtml(gid, '📝 Drafts (No Expense Booking FY)', drafts, drafts.every(e=>DASH.sel.has(e.id)), true);
      }
      html += `</div>`;
    });
  } else {
    cats.forEach(cat => {
      const items = sorted.filter(e => (e.estimateType||'project')===cat.type);
      if (!items.length) return;
      DASH.groups['cat|'+cat.type] = items.map(e=>e.id);
      let sno = 0;
      html += `<div class="dash-cat-section"><div class="embroidery" aria-hidden="true"></div><div class="dash-cat-head">${cat.label} <span class="badge badge-neutral">${items.length}</span></div><div class="est-list">${items.map(e=>{ sno++; return estCardHtml(e, sno); }).join('')}</div></div>`;
    });
  }
  zone.innerHTML = html;
  updateDashSelCount();
}

// ══════════════════════════════════════════════════════════════
// CREATE A COPY — duplicates an estimate, re-matching every item against
// the CURRENT SOR catalog rather than blindly copying old rates:
//   1. Latest SOR version, exact item_no match -> use current rate
//   2. Older SOR version(s), exact item_no match -> use that rate, with
//      a remark noting it came from an older SOR version
//   3. Non-SOR catalog, exact item_no match -> use that entry
//   4. No match anywhere -> auto-create a new Non-SOR entry preserving
//      the original description/uom/rate/qty, flagged with the exact
//      remark text requested: "Entry put in non sor item list as latest
//      sor misses the item. Search for suitable PO / WO"
// ══════════════════════════════════════════════════════════════
async function createEstimateCopy(id) {
  toast('Preparing copy…', 'ok', 2000);
  try {
    let sourceEst, sourceItems;
    if (ST.currentEstimate && ST.currentEstimate.id === id) {
      sourceEst = ST.currentEstimate; sourceItems = ST.currentItems;
    } else {
      const res = await api('getEstimate', {id, userId:ST.user.id, role:ST.user.role});
      if (!res.ok) { toast(res.error||'Could not load estimate to copy', 'err'); return; }
      sourceEst = normalizeLoadedEstimate(res.estimate); sourceItems = res.items||[];
    }

    const latestVersion = resolveLatestVersion(visibleSorVersions());
    const rematched = sourceItems.map(it => rematchItemAgainstCurrentCatalog(it, latestVersion));
    const newlyCreatedCount = rematched.filter(r => r._autoCreated).length;
    const olderVersionCount = rematched.filter(r => r._fromOlderVersion).length;

    // Any item that needed to be auto-created as Non-SOR should also be
    // persisted into the Non-SOR catalog itself (not just this estimate),
    // so it's available for future estimates too.
    const toPersist = rematched.filter(r => r._autoCreated && r._needsPersist);
    for (const item of toPersist) {
      try {
        await apiPost({action:'addNonSOR', item:{
          item_no: item.item_no, description: item.description, uom: item.uom, rate: item.rate,
          section: item.section, remarks: item.remarks, addedBy: ST.user.id
        }});
        const idx = ST.nonSorCache.findIndex(n=>n.item_no===item.item_no);
        if (idx===-1) ST.nonSorCache.push({...item, version:'NONSOR', addedBy:ST.user.id, addedAt:new Date().toISOString()});
      } catch(e2) { /* best-effort; item still carries forward into the estimate either way */ }
    }

    ST.currentEstimate = {
      ...blankEstimate(),
      name: sourceEst.name + ' (Copy)',
      number: '', date: todayISO(), division: sourceEst.division, ref: sourceEst.ref, work: sourceEst.work,
      estimateType: sourceEst.estimateType, amcAmount: sourceEst.amcAmount, amcRemark: sourceEst.amcRemark,
      trLineMode: sourceEst.trLineMode, landCompChargePct: sourceEst.landCompChargePct,
      supplySpares: sourceEst.supplySpares
    };
    ST.currentItems = rematched.map(r => ({
      item_no: r.item_no, version: r.version, description: r.description,
      fullDescription: r.fullDescription||'', uom: r.uom,
      rate: r.rate, qty: r.qty, section: r.section, remarks: r.remarks||'', isCustom: r.isCustom
    }));

    let msg = `Copy created with ${ST.currentItems.length} item(s) re-matched against the current catalog.`;
    if (olderVersionCount) msg += ` ${olderVersionCount} item(s) only found in an older SOR version.`;
    if (newlyCreatedCount) msg += ` ${newlyCreatedCount} item(s) not found anywhere — added to Non-SOR with a remark to review.`;
    toast(msg, newlyCreatedCount||olderVersionCount ? 'warn' : 'ok', 7000);

    navigateTo('estimate-new', {preserveItems: true});
  } catch(e) {
    toast(e.message||'Failed to create copy', 'err');
  }
}

// ── Shared catalog lookup cascade, used everywhere an item needs a rate ──
// (estimate copy/re-match, ZEST03 sync, Final Estimate build). Order:
//   1. The selected/base SOR version itself, exact item_no.
//   2. Non-SOR catalog, exact item_no.
//   3. Any OLDER visible SOR version (never a newer one), exact item_no —
//      when several match, the most recent of those older versions wins.
// Hidden SOR versions are never matched against (see visibleSorVersions()).
function findCatalogMatch(itemNo, selectedVersion) {
  if (selectedVersion) {
    const inSelected = ST.sorCache.find(s => s.item_no===itemNo && s.version===selectedVersion);
    if (inSelected) return {...inSelected, source:'sor', matchedVersion: selectedVersion, fromOlderVersion:false};
  }
  const inNonSor = ST.nonSorCache.find(n => n.item_no===itemNo);
  if (inNonSor) return {...inNonSor, version:'NONSOR', source:'nonsor', matchedVersion:'NONSOR', fromOlderVersion:false};
  const visible = visibleSorVersions();
  const selKey = selectedVersion ? versionSortKey(selectedVersion) : Infinity;
  const olderMatches = ST.sorCache.filter(s =>
    s.item_no===itemNo && s.version!==selectedVersion &&
    visible.includes(s.version) && versionSortKey(s.version) < selKey);
  if (olderMatches.length) {
    const best = [...olderMatches].sort((a,b)=>versionSortKey(b.version)-versionSortKey(a.version))[0];
    return {...best, source:'sor', matchedVersion: best.version, fromOlderVersion:true};
  }
  return null;
}

// ── The actual re-matching cascade for a single item ──
function rematchItemAgainstCurrentCatalog(item, latestVersion) {
  const match = findCatalogMatch(item.item_no, latestVersion);
  if (match && match.source==='sor' && !match.fromOlderVersion) {
    return {...match, qty: item.qty, fullDescription: item.fullDescription||'', remarks: item.remarks||'', isCustom: false, version: match.matchedVersion};
  }
  if (match && match.source==='sor' && match.fromOlderVersion) {
    return {
      ...match, qty: item.qty, fullDescription: item.fullDescription||'', isCustom: false, version: match.matchedVersion,
      remarks: `Carried forward from older SOR version "${match.matchedVersion}" — not present in ${latestVersion||'the selected SOR'}. ${item.remarks||''}`.trim(),
      _fromOlderVersion: true
    };
  }
  if (match && match.source==='nonsor') {
    return {...match, qty: item.qty, fullDescription: item.fullDescription||'', version:'NONSOR', isCustom: true, remarks: item.remarks||match.remarks||''};
  }
  // Not found anywhere — auto-create as a new Non-SOR entry, preserving
  // the original item's data, with the exact requested remark text.
  return {
    item_no: item.item_no, description: item.description, fullDescription: item.fullDescription||'',
    uom: item.uom, rate: item.rate,
    qty: item.qty, section: item.section, version: 'NONSOR', isCustom: true,
    remarks: 'Entry put in non sor item list as latest sor misses the item. Search for suitable PO / WO',
    _autoCreated: true, _needsPersist: true
  };
}

// ── Export All: uses precomputed totals stored on each estimate (Section 11 approach (a)) ──
// ── Shared Proposal Progress data filter — used by both Excel and PDF,
// for both the per-estimate export and the dashboard "Export All". Only
// surfaces data that was actually entered: completed stages WITH remarks
// or a link, bills from "Bill 1" onward only if they have a remark, Order
// Closed only if true (with its comment), and only non-empty General
// Remarks. This is the single source of truth for "what counts as
// entered data" so PDF and Excel never drift apart. ──
function buildProgressExportData(est) {
  const progress = est.progress || {stages:{}, woAmount:0, bills:[], orderClosed:false, orderClosedRemarks:'', orderDetails:{}};
  const stages = progress.stages || {};

  // Stages 1-15 (pre-billing): show if done OR has remarks/link entered.
  // Stages 16-25 (Bill 1..10 Recorded): show ONLY if a remark was entered.
  const stageRows = [];
  for (let i=1;i<=25;i++) {
    const s = stages[i] || {done:false, remarks:'', link:''};
    const isBillStage = i>=16;
    const hasContent = isBillStage ? !!(s.remarks && s.remarks.trim()) : (s.done || (s.remarks && s.remarks.trim()) || (s.link && s.link.trim()));
    if (hasContent) {
      stageRows.push({num:i, name: PROPOSAL_STAGE_NAMES[i-1], done: !!s.done, remarks: s.remarks||'', link: s.link||''});
    }
  }

  const bills = (progress.bills||[]).filter(b=>b.label||b.amount||b.remarks);
  const totalBills = bills.reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const available = (progress.woAmount||0) - totalBills;

  const remarks = [est.remark1, est.remark2, est.remark3, est.remark4, est.remark5].filter(r=>r && r.trim());

  // Abstract rows (type-specific, matches the live Abstract tab's Sr.1-9 / Sub Total A / AMC rules)
  const abstractRows = buildEstimateAbstractRows(est);

  // Order Related Details — only fields the user actually filled in
  const od = progress.orderDetails || {};
  const odLabels = {
    adminApprovalNo:'Admin Approval Number', adminApprovalDate:'Admin Approval Date',
    expenseBookingFY:'Expense Booking FY', tenderNo:'Tender No.',
    particularsOfWork:'Particulars of Work', msetclEstimatedCost:'MSETCL Estimated Cost',
    rfxNo:'RFx No.', nameOfOffice:'Name of Office', noOfBidsReceived:'No. of Bids Received',
    l1Rates:'L-1 Rates', vendorName:'Vendor Name', vendorCode:'Vendor Code / Details',
    loiNo:'LOI No.', loiDate:'LOI Date',
    woNo:'Work Order No.', woDate:'Work Order Date', poNo:'PO No.', poDate:'PO Date', woRemarks:'WO Remarks',
    stampDutyPaid:'Stamp Duty Paid', stampNo:'Stamp No.', stampDate:'Stamp Date', stampRemarks:'Stamp Remarks',
    sdBgNo:'SD / BG No.', nameOfBank:'Name of Bank', sdBgOtherDetails:'SD/BG Other Details',
    preparedBy:'Progress Prepared By'
  };
  const orderDetailsRows = Object.keys(odLabels)
    .filter(k => od[k] !== undefined && od[k] !== null && String(od[k]).trim() !== '')
    .map(k => [odLabels[k], k==='msetclEstimatedCost' ? fmtINR(Math.round(parseFloat(od[k])||0),0) : (/date/i.test(k) && od[k] ? fmtDate(od[k]) : od[k])]);

  return {
    finalTotal: est.estimateType==='amc' ? (est.amcAmount||0) : (est.finalTotal||0),
    abstractRows,
    audited: !!est.audited,
    stageRows,
    orderDetailsRows,
    woAmount: progress.woAmount||0,
    bills, totalBills, available,
    orderClosed: !!progress.orderClosed,
    orderClosedRemarks: progress.orderClosedRemarks||'',
    remarks,
    images: est.progressImages||[]
  };
}

// ── Type-specific abstract rows for export (Sr.1-9 / Sub Total A only / AMC manual amount) ──
function buildEstimateAbstractRows(est) {
  if (est.estimateType === 'amc') {
    return [
      ['AMC Amount Limit', fmtINR(est.amcAmount||0)],
      ['AMC Remark', est.amcRemark||'—']
    ];
  }
  const nonSorSupply = est.nonSorSupplyTotal||0, nonSorOm = est.nonSorOmTotal||0;
  const supply = (est.supplyTotal||0) + nonSorSupply;
  const project = est.projectTotal||0;
  const om = (est.omTotal||0) + nonSorOm;
  const subA = supply+project+om;
  const rows = [
    ['Sr.1 Cost of Material (Supply Portion)', fmtINR(supply)],
    ['Sr.2 Cost of Work – Project Services (ETC Part)', fmtINR(project)],
    ['Sr.3 Cost of Work – O&M Services', fmtINR(om)],
    ['Sr.4 Sub Total "A" (1+2+3)', fmtINR(subA)],
  ];
  if (est.estimateType === 'rm') {
    rows.push(['TOTAL ESTIMATED COST', fmtINR(subA)]);
    return rows;
  }
  const settings = {...ST.chargeRates, ...(est.settings || {})};
  const pv = subA*(settings.pv||0)/100;
  const cont = subA*(settings.contingencies||0)/100;
  let sr7 = subA+pv+cont;
  rows.push(['Sr.5 Price Variation', fmtINR(pv)]);
  rows.push(['Sr.6 Contingencies', fmtINR(cont)]);
  if (est.trLineMode) {
    const landComp = sr7*(est.landCompChargePct||15)/100;
    sr7 += landComp;
    rows.push([`Land & Compensation Charges @ ${est.landCompChargePct||15}%`, fmtINR(landComp)]);
  }
  const centages = sr7*(settings.centages||0)/100;
  const total = sr7+centages;
  rows.push(['Sr.7 Total w/o Centages', fmtINR(sr7)]);
  rows.push(['Sr.8 Centages (Supervision)', fmtINR(centages)]);
  rows.push(['Sr.9 TOTAL ESTIMATED COST WITH CENTAGES', fmtINR(total)]);
  return rows;
}

async function exportAllExcel() {
  const list = selectedEstimatesForExport();
  if (!list.length) { toast('Select at least one estimate or FY group to export', 'warn'); return; }
  toast('Building Excel export…', 'ok', 2000);
  const XLSXmod = await ensureSheetJS();
  const wb = XLSXmod.utils.book_new();

  // First sheet: consolidated, in the exact Order Book "CE" format
  // (one row per estimate, all Order Book columns).
  buildCeSheet(XLSXmod, wb, list, 'Consolidated');

  list.forEach((e, idx)=>{
    const pd = buildProgressExportData(e);
    const rows = [['']]; // row 0 reserved for MSETCL title banner
    const styleMap = {};
    let r = 1;
    const addSection = (title) => { rows.push([title]); styleMap[r]='section'; r++; };
    const addHeader = (cols) => { rows.push(cols); styleMap[r]='header'; r++; };
    const addRow = (cols) => { rows.push(cols); r++; };
    const addTotal = (cols) => { rows.push(cols); styleMap[r]='total'; r++; };
    const blank = () => { rows.push(['']); r++; };

    addSection(`${idx+1}. ${e.name}${e.number?' ('+e.number+')':''}`);
    addRow(['Division', e.division||'—']);
    addRow(['Type', estimateTypeLabel(e.estimateType)]);
    addRow(['Status', e.status]);
    blank();

    // 1. Abstract
    addSection('Abstract');
    pd.abstractRows.forEach(row => {
      if (/^(Sr\.9|TOTAL ESTIMATED)/.test(row[0])) addTotal(row); else addRow(row);
    });
    blank();

    // 2. Proposal Progress
    addSection('Proposal Progress');
    addRow(['Audited', pd.audited ? 'Yes' : 'No']);
    if (pd.stageRows.length) {
      blank();
      addHeader(['Stage','Done','Remarks','Link']);
      pd.stageRows.forEach(s => { addRow([`${s.num}. ${s.name}`, s.done?'Yes':'No', s.remarks, s.link]); if (s.done) styleMap[r-1]='done'; });
    }
    blank();

    // 3. Order Related Details (new section)
    if (pd.orderDetailsRows.length) {
      addSection('Order Related Details');
      pd.orderDetailsRows.forEach(row => addRow(row));
      blank();
    }

    // 4. Financial Tracking (same order as webpage: WO amount top, bills chronological, available balance)
    if (pd.woAmount || pd.bills.length) {
      addSection('Financial Tracking');
      addRow(['WO / PO Amount', fmtINR(pd.woAmount)]);
      if (pd.bills.length) {
        blank();
        addHeader(['Bill','Amount','Remarks']);
        pd.bills.forEach(b => addRow([b.label||'', fmtINR(parseFloat(b.amount)||0), b.remarks||'']));
      }
      addTotal(['Available Amount', fmtINR(pd.available)]);
      blank();
    }

    // 5. Order Closed
    if (pd.orderClosed) {
      addSection('Order Closed');
      addRow(['Status', 'Yes']);
      addRow(['Comment', pd.orderClosedRemarks||'—']);
      blank();
    }

    if (pd.remarks.length) {
      addSection('General Remarks');
      pd.remarks.forEach(rm => addRow([rm]));
      blank();
    }
    if (pd.images.length) {
      addSection('Progress Images (captions)');
      addRow([pd.images.map(im=>im.caption).filter(Boolean).join(' | ')||`${pd.images.length} image(s) — see PDF for images`]);
    }

    const sheetName = sanitizeSheetName(`${idx+1}_${e.name}`);
    const colCount = Math.max(...rows.map(rr=>rr.length), 4);
    rows[0][0] = MSETCL_HEADER_LINE1;
    const ws = XLSXmod.utils.aoa_to_sheet(rows);
    applySmartColWidths(ws, rows);
    applyRowStyles(ws, styleMap, colCount);
    styleMsetclTitleRow(ws, colCount);
    XLSXmod.utils.book_append_sheet(wb, ws, sheetName);
  });

  XLSXmod.writeFile(wb, `MSETCL_All_Estimates_${todayISO()}.xlsx`, {cellStyles: true});
  toast('Excel export ready', 'ok');
}

function sanitizeSheetName(name) {
  return String(name).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || 'Sheet';
}

// ── SHARED smart column-width helper — used by every Excel sheet in the app ──
function applySmartColWidths(ws, rows) {
  const colCount = Math.max(...rows.map(r => r.length));
  const isNumericCell = v => typeof v === 'number'
    || (typeof v === 'string' && v.trim() !== '' && /^[\d,]+(\.\d+)?$/.test(v.trim()));
  const populated = r => r.filter(v => v !== undefined && v !== null && String(v).trim() !== '').length;
  // A header row is a multi-cell row with NO numeric cells (column titles).
  // Its long multi-word labels wrap in-cell, so they should size the column
  // by their longest WORD — not their full length — which is what kept
  // numeric columns absurdly wide just because the heading text was long.
  const isHeaderRow = r => populated(r) > 1 && !r.some(isNumericCell);
  const widths = [];
  for (let c = 0; c < colCount; c++) {
    let maxLen = 4;
    rows.forEach(r => {
      if (populated(r) <= 1) return;                 // skip merged banners/titles
      const v = r[c];
      if (v === undefined || v === null || String(v).trim() === '') return;
      const s = String(v);
      const len = isHeaderRow(r)
        ? Math.max(10, ...s.split(/\s+/).map(w => w.length))   // header → longest word
        : s.length;                                            // data → full content
      maxLen = Math.max(maxLen, len);
    });
    widths.push({ wch: Math.min(44, Math.max(6, Math.round(maxLen * 1.05) + 2)) });
  }
  ws['!cols'] = widths;
}

// ── SHARED Excel cell-styling helper — navy/gold theme matching the app,
// applied consistently across every export sheet. Row-level styling is
// supplied via a `styleMap` of {rowIndex: 'header'|'section'|'total'|'subtle'}.
// ── Shared Excel theme — luxury navy/gold, matching the app & PDF exactly.
// Every fill uses patternType:'solid' (required for xlsx-js-style to render),
// borders are explicit, and the header carries a gold underline accent. ──
const EXPORT_FONT = 'Arial Nova Cond';     // approved print font (condensed Arial) — declared before style objects that use it
// Interior gridlines use Excel's thinnest weight ('hair'). Emphasis lines
// (_GOLD_EDGE: header underline / total overline) stay 'thin', and the sheet's
// outer box stays 'medium', so the hierarchy of the grid is still readable.
const _THIN = { style:'hair', color:{ rgb:'000000' } };
const _GOLD_EDGE = { style:'thin', color:{ rgb:'000000' } };
const XLSX_STYLES = {
  header:   { font:{name:EXPORT_FONT, bold:true, color:{rgb:'000000'}, sz:14}, fill:{patternType:'solid', fgColor:{rgb:'EFF1F4'}}, alignment:{vertical:'center', horizontal:'center', wrapText:true}, border:{top:_THIN, left:_THIN, right:_THIN, bottom:_GOLD_EDGE} },
  section:  { font:{name:EXPORT_FONT, bold:true, color:{rgb:'000000'}, sz:16}, fill:{patternType:'solid', fgColor:{rgb:'E3E6EB'}}, alignment:{vertical:'center', horizontal:'center', wrapText:true}, border:{top:_THIN,left:_THIN,right:_THIN,bottom:_THIN} },
  total:    { font:{name:EXPORT_FONT, bold:true, color:{rgb:'000000'}, sz:14}, fill:{patternType:'solid', fgColor:{rgb:'E9EBEE'}}, alignment:{vertical:'center', horizontal:'center', wrapText:true}, border:{top:_GOLD_EDGE,left:_THIN,right:_THIN,bottom:_THIN} },
  subtotal: { font:{name:EXPORT_FONT, bold:true, color:{rgb:'000000'}, sz:14}, alignment:{vertical:'center', wrapText:true}, border:{top:_THIN,left:_THIN,right:_THIN,bottom:_THIN} },
  subtle:   { font:{name:EXPORT_FONT, italic:true, color:{rgb:'000000'}, sz:14}, alignment:{vertical:'center', wrapText:true} },
  words:    { font:{name:EXPORT_FONT, bold:true, italic:true, color:{rgb:'000000'}, sz:16}, fill:{patternType:'solid', fgColor:{rgb:'F4F7FC'}}, alignment:{vertical:'center', horizontal:'left', wrapText:true}, border:{top:_THIN,left:_THIN,right:_THIN,bottom:_THIN} },
  done:     { font:{name:EXPORT_FONT}, fill:{patternType:'solid', fgColor:{rgb:'E3F6EC'}} },
};
const SECTION_TITLE_STYLE = { font:XLSX_STYLES.section.font, fill:XLSX_STYLES.section.fill, border:XLSX_STYLES.section.border, alignment:{vertical:'center', horizontal:'center', wrapText:false} };
function _rowPopulated(ws, r, colCount){
  let n=0;
  for(let c=0;c<colCount;c++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell && cell.v!==undefined && cell.v!==null && String(cell.v).trim()!=='') n++; }
  return n;
}
// Merge a row's cell A across the full sheet width. Guarded so two callers
// (e.g. applyRowStyles + applyMsetclHeaderBanner) never create overlapping
// merges on the same row, which would corrupt the file.
function _mergeRowAcross(ws, r, colCount){
  if(colCount<=1) return;
  ws['!merges'] = ws['!merges'] || [];
  if(ws['!merges'].some(m=>m.s && m.s.r<=r && m.e.r>=r && m.s.c===0)) return;
  ws['!merges'].push({s:{r,c:0}, e:{r,c:colCount-1}});
}
function applyRowStyles(ws, styleMap, colCount) {
  Object.keys(styleMap).forEach(rowIdxStr => {
    const rowIdx = parseInt(rowIdxStr);
    const styleKey = styleMap[rowIdxStr];
    let style = XLSX_STYLES[styleKey];
    if (!style) return;
    // A section row holding a single title cell is merged across the sheet
    // width and centred — so the title never sits in (and never widens) a
    // single column, and reads as a proper banner.
    if (styleKey === 'section' && _rowPopulated(ws, rowIdx, colCount) === 1) {
      _mergeRowAcross(ws, rowIdx, colCount);
      style = SECTION_TITLE_STYLE;
    }
    for (let c=0; c<colCount; c++) {
      const addr = XLSX.utils.encode_cell({r:rowIdx, c});
      if (!ws[addr]) ws[addr] = {t:'s', v:''};
      // Each cell gets its OWN style, with alignment and border cloned too.
      // Sharing one object meant a later per-cell tweak leaked across the
      // whole row and permanently altered the XLSX_STYLES preset.
      ws[addr].s = Object.assign({}, style, {
        alignment: Object.assign({}, style.alignment),
        border:    style.border ? Object.assign({}, style.border) : undefined,
      });
    }
  });
}
function setRowHeight(ws, rowIdx, pts) {
  ws['!rows'] = ws['!rows'] || [];
  ws['!rows'][rowIdx] = {hpt: pts};
}

// ── Applies the standard MSETCL banner styling to the top header rows of
// any Excel sheet built from estimateHeaderRows(): row 0 (company name)
// merged across the full column width, centered, bold, navy/gold banner;
// the following 3 header lines (division/scope/estimation no.) centered
// and bold but smaller. colCount must match the sheet's actual width so
// the merge spans correctly regardless of how many columns the sheet has. ──
// Row 0 = company name (37pt). Row 1 = sheet title (28pt). Both centred on a
// light grey band. Rows 2-4 are the estimate detail lines, unchanged.
const BANNER_ROWS = 5;
function applyMsetclHeaderBanner(ws, colCount) {
  ws['!merges'] = ws['!merges'] || [];
  for (let r = 0; r < BANNER_ROWS; r++) {
    _mergeRowAcross(ws, r, colCount);
    const addr = XLSX.utils.encode_cell({r, c:0});
    if (!ws[addr]) ws[addr] = {t:'s', v:''};
    const isBanner = (r === 0 || r === 1);
    ws[addr].s = {
      font: {
        name: EXPORT_FONT, bold: true,
        italic: (r >= 2 && r <= 4),
        sz: r === 0 ? 30 : (r === 1 ? 28 : 14),
        color: {rgb:'000000'},
      },
      fill: isBanner ? {patternType:'solid', fgColor:{rgb:'D9DDE3'}} : undefined,
      alignment: { horizontal: isBanner ? 'center' : 'left', vertical:'center', wrapText:true },
      border: r === BANNER_ROWS-1 ? {bottom:{style:'thin',color:{rgb:'000000'}}} : undefined
    };
    // heights are computed by autoRowHeights (content-based, print-ready)
  }
}

// ── Single-row MSETCL title banner — for multi-estimate summary sheets
// (Order Book, Rates, T-Code/Processes, Smart-Fill) that don't have a
// per-estimate 4-line header block, just need the company name centered
// and bold at the very top, merged across the sheet width. Prepends the
// title row to the given rows array — call this BEFORE aoa_to_sheet. ──
function withMsetclTitleRow(rows, colCount) {
  const titleRow = new Array(colCount).fill('');
  titleRow[0] = MSETCL_HEADER_LINE1;
  return [titleRow].concat(rows);
}
function styleMsetclTitleRow(ws, colCount) {
  ws['!merges'] = ws['!merges'] || [];
  _mergeRowAcross(ws, 0, colCount);
  const addr = XLSX.utils.encode_cell({r:0, c:0});
  if (!ws[addr]) ws[addr] = {t:'s', v:''};
  ws[addr].s = {
    font: { name:EXPORT_FONT, bold:true, sz:14, color:{rgb:'000000'} },
    fill: { patternType:'solid', fgColor:{rgb:'D9DDE3'} },
    alignment: { horizontal:'center', vertical:'center', wrapText:false },
    // Matched to the outer frame and the header underline — a 'medium' rule
    // here was the one remaining heavier line on summary sheets.
    border: { bottom:{style:'thin', color:{rgb:'000000'}} }
  };
  setRowHeight(ws, 0, 24);
}

let _sheetJSPromise = null;
// ── We use xlsx-js-style (a drop-in, API-identical fork of SheetJS that
// ACTUALLY writes cell styles — fills, fonts, borders, alignment, merges,
// number formats). The stock community SheetJS build silently discards
// every `.s` style on write, which is why styled exports never appeared.
// Reading uploaded .xlsx still works (this is a superset of SheetJS). ──
let _fflate = null;
function ensureFflate() {
  if (_fflate) return Promise.resolve(_fflate);
  if (window.fflate) { _fflate = window.fflate; return Promise.resolve(_fflate); }
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
    s.onload = () => { _fflate = window.fflate; resolve(_fflate); };
    s.onerror = () => reject(new Error('Could not load zip library'));
    document.head.appendChild(s);
  });
}
// Write a styled workbook, injecting freeze panes into the sheet XML
// (xlsx-js-style can't emit them itself). Falls back to a plain write.
async function writeXlsxWithFreeze(wb, filename) {
  // Freeze-pane injection was disabled: re-zipping the .xlsx stripped cell
  // styles in Excel. We write the fully-styled file directly.
  const X = await ensureSheetJS();
  X.writeFile(wb, filename, {cellStyles:true});
}
function ensureSheetJS() {
  if (window.XLSX && window.XLSX.__luxeReady) return Promise.resolve(window.XLSX);
  if (_sheetJSPromise) return _sheetJSPromise;
  const CDNS = [
    'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',
    'https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'
  ];
  _sheetJSPromise = new Promise((resolve, reject) => {
    let i = 0;
    const tryLoad = () => {
      const s = document.createElement('script');
      s.src = CDNS[i];
      s.onload = () => { installLuxeXlsx(window.XLSX); resolve(window.XLSX); };
      s.onerror = () => { i++; if (i < CDNS.length) tryLoad(); else reject(new Error('Could not load the spreadsheet engine.')); };
      document.head.appendChild(s);
    };
    tryLoad();
  });
  return _sheetJSPromise;
}

// Wrap writeFile once so EVERY export is auto-finished with a consistent,
// professional grid (thin borders on all cells, zebra-striped body rows,
// right-aligned Indian-formatted numbers) on top of each sheet's own
// header/title/total styling. No export function needs to change.
function installLuxeXlsx(X) {
  if (!X || X.__luxeReady) return;
  const _writeFile = X.writeFile.bind(X);
  X.writeFile = function(wb, name, opts) {
    try { beautifyWorkbook(wb); } catch(e){ console.warn('beautify skipped', e); }
    return _writeFile(wb, name, Object.assign({ cellStyles: true }, opts || {}));
  };
  // Also wrap write() — some paths build a buffer directly; without this they
  // would emit UNSTYLED cells (this is what stripped all formatting).
  const _write = X.write.bind(X);
  X.write = function(wb, opts) {
    try { beautifyWorkbook(wb); } catch(e){ console.warn('beautify skipped', e); }
    return _write(wb, Object.assign({ cellStyles: true }, opts || {}));
  };
  X.__luxeReady = true;
}

const LUXE_GRID = { style:'hair', color:{ rgb:'000000' } };   // interior gridlines — thinnest weight
const LUXE_BORDER_ALL = { top:LUXE_GRID, bottom:LUXE_GRID, left:LUXE_GRID, right:LUXE_GRID };
// Exact column widths from the approved edited sheet (print-ready).
const COLW_SECTION = [13.86, 22.43, 44.86, 13.86, 9, 12, 18.29, 13.86, 16.14, 21.86, 14, 13.86];
const COLW_ABSTRACT = [15.86, 10, 15.86, 1.86, 16, 9, 2.57, 17.43, 14.86, 1.86, 20.71, 53.29];
// Draw the outer border around the whole used range of a sheet.
//
// This was 'medium', and that is what made the vertical lines look heavy on
// the banner rows above the header and on the total / amount-in-words rows
// at the bottom. Those rows are MERGED across the full sheet width, so their
// interior hair verticals disappear — leaving the medium sheet edge as the
// only vertical line in the row, next to hair horizontals. On line-item rows
// the same edge sits among dozens of hair verticals and reads as a normal
// frame, which is why the problem only showed on the non-item rows.
//
// 'thin' matches _GOLD_EDGE, the heaviest horizontal line used anywhere, so
// no vertical is ever bolder than the boldest horizontal.
function drawOuterBorder(ws){
  if (!ws || !ws['!ref']) return;
  const X = window.XLSX;
  const range = X.utils.decode_range(ws['!ref']);
  const EDGE = { style:'thin', color:{ rgb:'000000' } };
  for (let r=range.s.r; r<=range.e.r; r++){
    for (let c=range.s.c; c<=range.e.c; c++){
      const onTop=r===range.s.r, onBot=r===range.e.r, onLeft=c===range.s.c, onRight=c===range.e.c;
      if (!(onTop||onBot||onLeft||onRight)) continue;
      const ad = X.utils.encode_cell({r,c});
      if (!ws[ad]) ws[ad] = { t:'s', v:'' };
      const s = ws[ad].s = ws[ad].s || {};
      const b = Object.assign({}, s.border);
      if (onTop) b.top = EDGE; if (onBot) b.bottom = EDGE;
      if (onLeft) b.left = EDGE; if (onRight) b.right = EDGE;
      s.border = b;
    }
  }
}
// Estimate each row's height from its content so nothing is clipped when
// printed (rows auto-size to content — required for a ready-to-print sheet).
function autoRowHeights(ws, defaultFontSz=12, mins){
  if (!ws['!ref']) return;
  const range = window.XLSX.utils.decode_range(ws['!ref']);
  const cols = ws['!cols'] || [];
  const colW = (c)=> (cols[c] && cols[c].wch) ? cols[c].wch : 8.43;
  const merges = ws['!merges'] || [];
  const mInfo = {};
  const mergedRows = new Set();
  merges.forEach(m=>{ let w=0; for(let c=m.s.c;c<=m.e.c;c++) w+=colW(c); mInfo[m.s.r+':'+m.s.c] = { w, rows:m.e.r-m.s.r+1 };
    for(let r=m.s.r;r<=m.e.r;r++) mergedRows.add(r); });
  const rowsArr = ws['!rows'] = ws['!rows'] || [];
  for (let r=range.s.r; r<=range.e.r; r++){
    // Plain (non-merged) rows are left WITHOUT a height so Excel applies its own
    // native auto-fit (same accurate behaviour as the ZEST03 appendix sheet).
    // Only merged rows and explicitly-pinned rows get a computed height, since
    // Excel cannot auto-fit those.
    const forced = (mins && mins[r] != null) || mergedRows.has(r);
    if (!forced) continue;
    let maxLines = 1, maxSz = defaultFontSz;
    for (let c=range.s.c; c<=range.e.c; c++){
      const ad = window.XLSX.utils.encode_cell({r,c}); const cell = ws[ad];
      if (!cell || cell.v==null || cell.v==='') continue;
      const mi = mInfo[r+':'+c];
      const w = mi ? mi.w : colW(c);
      const sz = (cell.s && cell.s.font && cell.s.font.sz) || defaultFontSz;
      if (sz > maxSz) maxSz = sz;
      const cpl = Math.max(3, Math.floor(w * (11/sz) * 1.5));
      let lines = 0;
      String(cell.v).split('\n').forEach(seg => lines += Math.max(1, Math.ceil((seg.length||1)/cpl)));
      const spanned = mi ? mi.rows : 1;
      const perRow = Math.ceil(lines / spanned);
      if (perRow > maxLines) maxLines = perRow;
    }
    let h = Math.min(400, Math.max(18, Math.round(maxLines * (maxSz * 1.55) + 8)));
    if (mins && mins[r] != null) h = Math.max(h, mins[r]);
    rowsArr[r] = Object.assign({}, rowsArr[r], { hpt: h });
  }
}
const LUXE_NUMFMT = '#,##,##0.##';        // Indian grouping, decimals only when present
const RUPEE_FMT   = '"₹"#,##,##0.00';     // ₹ + Indian grouping (amounts with paise)
// Per-cell number formats — chosen from the VALUE so integers never show a
// stray '.' and only true amounts get thousands separators.
function plainNumFmt(v){ return Number.isInteger(Number(v)) ? '0' : '0.00'; }
function rupeeNumFmt(v){ return Number.isInteger(Number(v)) ? '"₹"#,##,##0' : '"₹"#,##,##0.00'; }
const LUXE_ZEBRA = 'F4F7FC';

function beautifyWorkbook(wb) {
  (wb.SheetNames || []).forEach(nm => {
    try { beautifySheet(wb.Sheets[nm]); }
    catch(e){ console.warn('beautify skipped for sheet', nm, e); }
  });
}
function beautifySheet(ws) {
  if (!ws || !ws['!ref']) return;
  // Sheets flagged byte-exact (e.g. SAP PR-format) are left completely
  // untouched: no borders, no zebra, and crucially no number formatting —
  // so material/service numbers stay as plain numbers with NO comma grouping.
  if (ws['!luxeSkip']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  // pass 1 — which rows are already themed (have a fill from styleMap/title)?
  const themed = {};
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (cell && cell.s && cell.s.fill) { themed[r] = true; break; }
    }
  }
  // pass 2 — apply borders + defaults + zebra + number formatting
  let bodyIdx = 0;
  for (let r = range.s.r; r <= range.e.r; r++) {
    const isThemed = !!themed[r];
    // Zebra ONLY on item rows — identified by a numeric serial in column A.
    const c0 = ws[XLSX.utils.encode_cell({ r, c:0 })];
    const isItemRow = c0 && (c0.t === 'n' || typeof c0.v === 'number');
    let stripe = false;
    if (!isThemed && isItemRow && !ws['!noZebra']) { stripe = (bodyIdx % 2 === 1); bodyIdx++; }
    for (let c = range.s.c; c <= range.e.c; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      let cell = ws[addr];
      if (!cell) cell = ws[addr] = { t:'s', v:'' };
      const s = cell.s = cell.s || {};
      // remember whether wrap was explicitly set before we touch alignment
      const wrapPreset = s.alignment && s.alignment.hasOwnProperty('wrapText');
      s.border = s.border || LUXE_BORDER_ALL;
      if (!s.font) s.font = { name:EXPORT_FONT, sz:14, color:{ rgb:'000000' } };
      else if (!s.font.name) s.font.name = EXPORT_FONT;
      if (s.font && !s.font.sz) s.font.sz = 14;
      s.alignment = Object.assign({ vertical:'center' }, s.alignment || {});
      const isNum = cell.t === 'n' || typeof cell.v === 'number';
      if (isNum) {
        if (!s.alignment.horizontal) s.alignment.horizontal = 'center';   // edited sheet centres numbers
        if (!s.numFmt) s.numFmt = plainNumFmt(cell.v);   // no commas unless it's an amount
        // shrink-to-fit prevents '###' when a value is wider than its column
        if (!('shrinkToFit' in s.alignment)) s.alignment.shrinkToFit = true;
        if (!wrapPreset) s.alignment.wrapText = false;   // numbers shrink, don't wrap
      } else {
        if (!s.alignment.horizontal) s.alignment.horizontal = 'center';   // text centred (description overridden to left)
        if (!wrapPreset) s.alignment.wrapText = true;
      }
      if (stripe && !s.fill) s.fill = { patternType:'solid', fgColor:{ rgb:LUXE_ZEBRA } };
    }
  }
  ws['!rows'] = ws['!rows'] || [];
  try { drawOuterBorder(ws); } catch(e){}
}

// ── SHARED PRINT HELPER — used by every PDF export in the app ──
// Root cause of "blank PDF" bug: calling window.print() then synchronously
// clearing the print container races the browser's render/capture.
// Fix: visibility-based isolation + cleanup ONLY on 'afterprint', with a
// generous fallback timeout (not used to drive normal cleanup).
let _printStyleEl = null;
function doPrintAndCleanup(printRoot) {
  document.body.appendChild(printRoot);
  if (!_printStyleEl) {
    _printStyleEl = document.createElement('style');
    _printStyleEl.id = 'print-isolation-style';
    document.head.appendChild(_printStyleEl);
  }
  // @page lives in the GLOBAL stylesheet (not just each export's inline
  // <style>) so it's guaranteed present regardless of how PRINT_ROOT's own
  // markup is built. Many mobile browsers (iOS Safari, Chrome Android)
  // ignore `@page { size: landscape }` entirely when generating a PDF via
  // the share sheet, defaulting to portrait — as a fallback for those
  // browsers, PRINT_ROOT is also explicitly given a wide, landscape-shaped
  // pixel width or 1100px in print media, which most mobile print engines
  // respect even when they ignore the page-size hint, by scaling the wide
  // content down to fit rather than reflowing it into a narrow portrait
  // column.
  // Print isolation must preserve NORMAL document flow — the previous
  // approach pinned #PRINT_ROOT with position:absolute + a fixed pixel
  // width, which disables the browser's pagination engine: column headers
  // can't repeat, .pg page-breaks misfire, and the header row appears to
  // "fall through" the rows. Instead we simply hide every sibling so the
  // print root flows from the top of page 1 and paginates naturally.
  // Orientation: an EXPLICIT A4-landscape page size (297mm × 210mm) is
  // honoured by more mobile print engines than the bare `landscape`
  // keyword. (iOS Safari may still ignore page size entirely — there is no
  // reliable CSS override for it — but Android Chrome and desktop respect
  // this.)
  const _orient = ST._printOrient === 'portrait' ? 'portrait' : 'landscape';
  const _portraitZoom = (_orient === 'portrait') ? `#PRINT_ROOT{ zoom:0.66; }` : '';
  _printStyleEl.textContent = `
    @page { size: ${_orient}; margin: 12.7mm; }
    ${_portraitZoom}
    @media print {
      /* Force backgrounds/colours to print. Without this, when the user's
         print dialog has "Background graphics" OFF (Chrome's default in some
         flows), the navy heading band drops out and its white text prints
         white-on-white — i.e. a BLANK heading. This guarantees they show. */
      html, body, #PRINT_ROOT, #PRINT_ROOT * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      /* Fit-to-width: the table is width:100% and table-layout:fixed, so the
         content always scales to the printable page width in either orientation. */
      #PRINT_ROOT table { width:100% !important; }
      html, body { margin:0 !important; padding:0 !important; background:#fff !important; width:auto !important; }
      body::before, body::after { display:none !important; content:none !important; }
      body > *:not(#PRINT_ROOT) { display:none !important; }
      #PRINT_ROOT {
        display:block !important; position:static !important;
        width:auto !important; max-width:none !important; transform:none !important;
      }
      /* keep a heading glued to the table that follows it — never let a
         heading strand at the bottom of a page away from its rows */
      #PRINT_ROOT h2, #PRINT_ROOT h3 { break-after:avoid; page-break-after:avoid; break-inside:avoid; page-break-inside:avoid; }
      /* repeat the column header at the top of every page a table spans */
      #PRINT_ROOT thead { display:table-header-group; }
      #PRINT_ROOT tfoot { display:table-footer-group; }
      #PRINT_ROOT tr, #PRINT_ROOT img { break-inside:avoid; page-break-inside:avoid; }
      /* each section/sheet (.pg) starts on a fresh page */
      #PRINT_ROOT .pg { break-after:page; page-break-after:always; }
      #PRINT_ROOT .pg:last-child { break-after:auto; page-break-after:auto; }
    }
  `;
  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return;
    cleaned = true;
    if (printRoot && printRoot.parentNode) printRoot.parentNode.removeChild(printRoot);
    // Clear the isolation CSS too. It contains
    //   body > *:not(#PRINT_ROOT){ display:none !important }
    // and used to persist in <head> for the rest of the session, so any print
    // that ran afterwards — including the Final Estimate preview — had its own
    // root hidden and printed blank or stale content.
    if (_printStyleEl) _printStyleEl.textContent = '';
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 75000); // generous fallback only, does not race the dialog
  setTimeout(() => window.print(), 60); // let DOM paint before invoking print
}

          <span class="opt-count">${ST.nonSorCache.length.toLocaleString('en-IN')}</span>
        </label>
      </div>` : ''}
    `;
    return;
  }
  container.innerHTML = `
    <div class="flex gap-2" style="margin-bottom:10px">
      <button class="btn btn-ghost btn-xs" onclick="versionSelectAll('${containerId}','${onChangeFn}')">Select All</button>

    </div>
    <div class="check-option-grid">
      ${versions.map(v => `
        <label class="check-option ${selectedVersions.includes(v)?'checked':''}" data-version="${escapeHtml(v)}">
          <input type="checkbox" ${selectedVersions.includes(v)?'checked':''} onchange="onVersionCheckboxChange('${containerId}','${onChangeFn}')">
          <span class="opt-label">${escapeHtml(v)}${v===latest?' <span class="badge badge-gold" style="margin-left:6px">Latest</span>':''}</span>

        </label>
      `).join('')}
      ${showNonSOR ? `
      <label class="check-option ${selectedVersions.includes('NONSOR')?'checked':''}" data-version="NONSOR">
        <input type="checkbox" ${selectedVersions.includes('NONSOR')?'checked':''} onchange="onVersionCheckboxChange('${containerId}','${onChangeFn}')">
        <span class="opt-label">Non-SOR Items <span class="badge badge-info" style="margin-left:6px">Custom</span></span>
        <span class="opt-count">${ST.nonSorCache.length.toLocaleString('en-IN')}</span>
      </label>` : ''}
    </div>
  `;
}
function onVersionCheckboxChange(containerId, onChangeFn) {
  // sync the visual "checked" class on the wrapping label, then re-filter
  document.querySelectorAll(`#${containerId} .check-option`).forEach(opt=>{
    const cb = opt.querySelector('input[type=checkbox]');
    opt.classList.toggle('checked', cb.checked);
  });
  if (window[onChangeFn]) window[onChangeFn](getCheckedVersions(containerId));
}
function getCheckedVersions(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input[type=checkbox]:checked`))
    .map(cb => cb.closest('.check-option').dataset.version);
}
function versionSelectAll(containerId, onChangeFn) {
  document.querySelectorAll(`#${containerId} input[type=checkbox]`).forEach(cb=>{ cb.checked = true; cb.closest('.check-option').classList.add('checked'); });
  if (window[onChangeFn]) window[onChangeFn](getCheckedVersions(containerId));
}
function versionSelectLatest(containerId, onChangeFn) {
  const latest = resolveLatestVersion(visibleSorVersions());
  document.querySelectorAll(`#${containerId} input[type=checkbox]`).forEach(cb=>{
    const v = cb.closest('.check-option').dataset.version;
    const on = v===latest;
    cb.checked = on; cb.closest('.check-option').classList.toggle('checked', on);
  });
  if (window[onChangeFn]) window[onChangeFn](getCheckedVersions(containerId));
}
