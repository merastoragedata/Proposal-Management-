async function feReadZest(evt){
  const file = evt.target.files[0]; evt.target.value='';
  if (!file) return;
  toast('Reading ZEST03…','ok',1500);
  try {
    // SoR status and Non-SOR remarks are resolved against these catalogs, so
    // they must be present BEFORE the estimate is built — otherwise every item
    // is classified against an empty cache.
    await Promise.all([ensureSorLoaded(), ensureNonSorLoaded()]);
    const X = await ensureSheetJS();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    let name = wb.SheetNames.find(n=>/zest\s*0?3/i.test(n));
    if (!name) name = wb.SheetNames.find(n=>{
      const g = X.utils.sheet_to_json(wb.Sheets[n], {header:1, blankrows:false, defval:''});
      return g.some(r=> r.some(c=>/Material\s*\/\s*Service No/i.test(String(c))) && r.some(c=>/^PR No/i.test(String(c))));
    });
    if (!name) name = wb.SheetNames[0];
    const grid = X.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:''});
    FE.parsed = feParseGrid(grid);
    FE.result = feBuild(FE.parsed);
    // keep the raw sheet so exports can append it as its own tab/pages
    FE.rawGrid = grid;
    FE.rawSheetLabel = ('Estimation _ ' + (FE.parsed.meta.estNo || name)).slice(0, 31);
    // Embedded in an estimate → persist the ZEST03 permanently on the
    // estimate (saved with Save Estimate; removed only via Delete).
    if (FE.baseEstimate && ST.currentEstimate) {
      const e = ST.currentEstimate;
      e.progress = e.progress || {};
      e.progress.zest03 = {
        meta: FE.parsed.meta, items: FE.parsed.items,
        grid: grid.length*(grid[0]||[]).length <= 8000 ? grid : null,   // cap very large sheets
        sheetLabel: FE.rawSheetLabel, savedAt: new Date().toISOString(),
      };
      toast('ZEST03 stored with this estimate — click Save Estimate to persist.','ok',4000);

      // PR numbers come straight off the ZEST03 lines — fill them into the
      // estimate's PMO / PR Numbers block immediately so they don't have to be
      // typed in by hand. Refresh the editor if that panel is on screen.
      const pf = feFillPmoPrFromZest03(e, FE.result.prNos, FE.parsed.meta);
      if (pf.filled){
        renderPmoPrList(isViewer());
        const headSpan = document.querySelector('#pmo-pr-collapse .collapse-head span:first-child');
        if (headSpan){
          const n = pmoPrFilledCount(e);
          headSpan.innerHTML = `🔖 PMO / PR Numbers ${n>0?`<span class="badge badge-gold" style="margin-left:6px">${n} entered</span>`:''}`;
        }
        const detail = pf.changed.filter(c=>c.from).map(c=>`${c.label}: ${c.from} → ${c.to}`);
        toast(`PR numbers filled from ZEST03 (${pf.filled} section${pf.filled>1?'s':''})`
              + (detail.length?` — replaced ${detail.join(', ')}`:'')
              + (pf.dropped.length?` — no room for ${pf.dropped.join(', ')}`:''),
              pf.dropped.length?'warn':'ok', pf.dropped.length?7000:4500);
      }
    }
    renderFinalEstimateResult();
    toast(`Generated from "${name}" — ${FE.parsed.items.length} items.`,'ok');
  } catch(err){ console.error('ZEST03 parse failed:', err); toast('Could not read file: '+(err.message||'error'),'err',7000); }
}

function renderFinalEstimateResult(){
  const zone = document.getElementById('fe-result');
  if (!zone || !FE.result) return;
  const res = FE.result, m = res.meta;
  const tbl = (rows, hasHeader) => {
    const head = hasHeader ? rows[0] : null;
    const body = hasHeader ? rows.slice(1) : rows;
    return `<div class="table-wrap"><table class="fe-preview">
      ${head?`<thead><tr>${head.map(h=>`<th>${escapeHtml(String(h))}</th>`).join('')}</tr></thead>`:''}
      <tbody>${body.map(r=>{
        const isTot = r[2]==='TOTAL' || /Sub Total|TOTAL ESTIMATED|Total Estimated cost with Centages|Amount in Words/.test(String(r[1]));
        return `<tr class="${isTot?'fe-total':''}">${r.map(c=>`<td class="${typeof c==='number'?'num-cell':''}">${typeof c==='number'?fmtNum(c):escapeHtml(String(c))}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>`;
  };
  // Signatory footer, mirroring the Excel block: black outer box, white inner
  // gridlines (so the divisions are invisible, exactly as in the sheet).
  const sigHtml = (()=>{
    const sig = feWithSynthetic(()=> estimateSignatories(ST.currentEstimate).filter(x=>!x.hidden));
    if (!sig || !sig.length) return '';
    return `<table class="fe-sig fe-print-only"><tbody><tr>${sig.map(x=>`
      <td><div class="fe-sig-title">${escapeHtml(x.title||'')}</div>
          <div class="fe-sig-office">${escapeHtml(x.office||'')}</div></td>`).join('')}</tr></tbody></table>`;
  })();
  const abstractRows = feWithSynthetic(()=> abstractSheetRows(true));
  // Five sections, matching the Excel export exactly.
  //
  // The old version built only supply/project/om, and keyed them off
  // res.supply.length — the RAW ZEST03 group, which mixes SoR and Non-SOR
  // together. But sectionConfig('supply') filters to `!isCustom`, so every
  // Non-SOR item was dropped from the table while still being counted in the
  // header badge. Result: Non-SOR materials and services appeared in the
  // Excel download but were invisible in the preview, and the item counts
  // disagreed with the rows beneath them.
  //
  // Counts now come from the same filter that produces the rows, so the
  // badge can never contradict the table.
  // ZEST03 PREVIEW ONLY. Nothing here touches the portal's own section
  // calculations — it is all done with itemsOverride, which exists exactly so
  // a sheet can be built from a hand-picked set of items.
  //
  // ZEST03 reports every line under supply / project / om regardless of whether
  // it is SOR or Non-SOR, so the preview must do the same: those three sections
  // list ALL items of their part, and their totals are the real ones.
  //
  // The Non-SOR sections below are a reading aid — "which of these are
  // Non-SOR, and what are they worth?". They show their own totals, but those
  // figures feed nothing: the same amounts are already inside Supply and O&M.
  const secRows = feWithSynthetic(()=>{
    const all = (sec)=> (ST.currentItems||[]).filter(it=> it.section===sec);
    const nonSor = (sec)=> (ST.currentItems||[]).filter(it=> it.isCustom && it.section===sec);
    const build = (key, items, opts)=>{
      const list = items || [];
      return { rows: list.length ? sectionItemTableRows(key, list, opts) : null, count: list.length };
    };
    return {
      supply:  build('supply',  all('supply')),
      project: build('project', all('project')),
      om:      build('om',      all('om')),
      // These carry their own totals so the Non-SOR value is visible at a
      // glance. Nothing downstream reads them: the same amounts are already
      // inside the Supply / O&M totals above.
      nonsor_supply: build('supply', nonSor('supply'), {noSpares:true}),
      nonsor_om:     build('om',     nonSor('om')),
    };
  });
  const secTbl = (secKey, rows) => {
    const head = rows[0], body = rows.slice(1);
    const fullIdx = head.findIndex(h=>/full\s*description/i.test(String(h)));
    const amt0 = (()=>{ const i = head.findIndex(h=>/exworks\s*price/i.test(String(h))); return i>-1 ? i : 5; })();
    // Column widths auto-size. The Description : Full Description proportion
    // is expressed in CSS via min/max-width on .fe-desc-cell / .fe-full-cell.
    const dcls = (i)=> i===2 ? ' fe-desc-cell' : (i===fullIdx ? ' fe-full-cell' : '');
    const N = head.length;
    return `<div class="table-wrap"><table class="fe-preview">
      <thead><tr>${head.map((hd,i)=>`<th class="${dcls(i).trim()}">${escapeHtml(String(hd))}</th>`).join('')}</tr></thead>
      <tbody>${body.map(r=>{
        const isTot = r[2]==='TOTAL' || /^Add: Supply Spares|^Supply Part Total/.test(String(r[2]||''));
        const isNonSorRow = String(r[r.length-1]||'') === 'Non-SoR';
        // The amount-in-words line carries no per-column data, so in the
        // PREVIEW it spans the whole table as one merged cell — larger and
        // bold, the way it reads on the official sheet. Exports are untouched.
        const isWords = typeof r[2]==='string' && /in Words:/i.test(r[2]);
        if (isWords) return `<tr class="fe-words-row"><td class="fe-words" colspan="${N}">${escapeHtml(String(r[2]))}</td></tr>`;
        // TOTAL / Supply Spares / Supply Part Total: the label is long and was
        // wrapping inside one narrow Description cell. Span it across the next
        // three columns — they are empty on these rows anyway — so it sits on
        // one line. Guarded on width so narrower sheets fall back safely.
        if (isTot && N > 6) {
          const cells = [];
          for (let i = 0; i < r.length; i++) {
            if (i >= 3 && i <= 5) continue;            // absorbed by the colspan
            const c = r[i];
            if (i === 2) { cells.push(`<td class="fe-total-title" colspan="4">${escapeHtml(String(c))}</td>`); continue; }
            const isNum = typeof c === 'number';
            cells.push(`<td class="${isNum?'num-cell fe-total-amt':''}${dcls(i)}">${isNum?((i>=amt0?'₹':'')+fmtNum(c)):escapeHtml(String(c))}</td>`);
          }
          return `<tr class="fe-total">${cells.join('')}</tr>`;
        }
        return `<tr class="${isTot?'fe-total':''}${isNonSorRow?' fe-nonsor':''}">${r.map((c,i)=>`<td class="${typeof c==='number'?'num-cell':''}${dcls(i)}">${typeof c==='number'?((i>=amt0?'₹':'')+fmtNum(c)):escapeHtml(String(c))}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>`;
  };
  let html = `
    <div class="card fe-noprint" style="margin-bottom:14px">
      <div><div class="fw-700">Estimation No: ${escapeHtml(m.estNo||'—')} &nbsp;|&nbsp; SOR: ${escapeHtml(m.sor||'—')} &nbsp;|&nbsp; Date: ${escapeHtml(fmtDate(m.estDate)||'—')}</div>
      <div class="text-sm text-muted">${escapeHtml(m.estFor||'')}</div></div>
      <div class="collapse" style="margin-top:10px">
        <div class="collapse-head" onclick="toggleCollapse(this)"><span class="fw-700 text-sm">⬇ Download Final Estimate</span><span class="chev">▸</span></div>
        <div class="collapse-body"><div class="collapse-body-inner">
          <div class="flex gap-2" style="flex-wrap:wrap">
            <button class="btn btn-gold" onclick="feDownloadExcel()">⬇ Download Excel</button>
            <button class="btn btn-ghost" onclick="exportEstimatePDF()">⬇ Download PDF</button>
            <button class="btn btn-ghost" onclick="feDownloadRawZest()">⬇ Uploaded ZEST03</button>
            <button class="btn btn-ghost" onclick="renderFinalEstimateResult()">↺ Refresh Preview</button>
          </div>
          <p class="hint mt-1">The preview below IS the export — same engine, same data. Uploaded ZEST03 sheet is appended as the last tab / pages.</p>
        </div></div>
      </div>
    </div>
    <div class="card fe-print-page" style="margin-bottom:14px"><h3>Abstract</h3>${tbl(abstractRows, true)}${sigHtml}</div>`;
  // Non-SOR sections carry the PR of the part they belong to, and are shown
  // only when they actually contain something — an empty "Non-SOR Services"
  // card on every estimate would be noise.
  const FE_SECTIONS = [
    ['supply',        'Supply Material',        'supply', true ],
    ['project',       'ETC — Project Services', 'project', true ],
    ['om',            'O&M Services',           'om',      true ],
    ['nonsor_supply', 'Non-SOR Materials (listed above, total not to be counted as it is already considered in Supply Material)', 'supply', false],
    ['nonsor_om',     'Non-SOR Services (listed above, total not to be counted as it is already considered in O&M Services)',      'om',     false],
  ];
  FE_SECTIONS.forEach(([key, title, prKey, alwaysShow])=>{
    const sec = secRows[key] || {rows:null, count:0};
    if (!alwaysShow && !sec.count) return;
    const pr = res.prNos[prKey];
    const badge = key.indexOf('nonsor')===0 ? 'badge-gold' : 'badge-neutral';
    html += `<div class="card${sec.rows?' fe-print-page':' fe-noprint'}" style="margin-bottom:14px"><h3>${title} <span class="badge ${badge}">${sec.count} items</span>${pr?` <span class="text-sm text-muted">PR: ${escapeHtml(pr)}</span>`:''}</h3>
      ${sec.rows?secTbl(key, sec.rows):'<p class="text-muted text-sm">No items in this section.</p>'}</div>`;
  });
  if (res.notFound.length){
    html += `<div class="card fe-noprint" style="margin-bottom:14px"><h3>⚠ Items Not Classified <span class="badge badge-neutral">${res.notFound.length}</span></h3>
      <p class="hint">These material numbers didn't match any Supply / ETC / O&M pattern and are excluded.</p>
      ${tbl([['Material No','Description','Mat / Service Full Description','UoM','Qty','Exworks']].concat(res.notFound.map(it=>[String(it.matNo), it.desc||it.full, (String(it.desc||'').trim()?String(it.full||''):''), it.uom, it.qty, it.exworks])), true)}</div>`;
  }
  zone.innerHTML = html;
}

// ── Downloads reuse the website's own exporters with the synthetic estimate ──
async function feWithSyntheticAsync(fn){
  if (!FE.result){ toast('Upload a ZEST03 sheet first.','warn'); return; }
  const savedE = ST.currentEstimate, savedI = ST.currentItems, savedR = ST.chargeRates;
  const { est, items } = feBuildSyntheticEstimate();
  ST.currentEstimate = est; ST.currentItems = items;
  if (FE.chargeOverrides) ST.chargeRates = Object.assign({}, savedR, FE.chargeOverrides);
  FE.attachRaw = true;
  try { await fn(); }
  catch(err){ console.error('Final Estimate export failed:', err); toast('Export failed: '+(err.message||'error'),'err',7000); }
  finally { ST.currentEstimate = savedE; ST.currentItems = savedI; ST.chargeRates = savedR; FE.attachRaw = false; }
}
// Fetch the Non-SOR catalog BEFORE the synthetic-estimate swap, so no network
// wait happens while ST.currentItems is temporarily replaced.
async function feDownloadExcel(){ await ensureRemarksSource(); await feWithSyntheticAsync(()=> exportEstimateExcel()); }
async function feDownloadPDF(){ await ensureRemarksSource(); await feWithSyntheticAsync(()=> exportEstimatePDF()); }
async function feDownloadRawZest(){
  if (!FE.rawGrid) { toast('No uploaded ZEST03 sheet is stored for this estimate.','warn'); return; }
  try {
    const X = await ensureSheetJS();
    const ws = X.utils.aoa_to_sheet(FE.rawGrid);
    applySmartColWidths(ws, FE.rawGrid);
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, sanitizeSheetName(FE.rawSheetLabel||'ZEST03'));
    X.writeFile(wb, (FE.rawSheetLabel||'ZEST03').replace(/[^a-z0-9]+/gi,'_')+'.xlsx');
    toast('ZEST03 sheet downloaded.','ok');
  } catch(err){ console.error(err); toast('Download failed: '+(err.message||'error'),'err',6000); }
}


document.addEventListener('DOMContentLoaded', () => {
  boot();
});

</script>
<script>
/* ════════════════════════════════════════════════════════════════════════
   ✦ LUXE ENGINE ✦ — ambient + interaction motion, attached non-invasively.
   Re-applies itself as the app re-renders pages (MutationObserver), guards
   against double-processing (data-lux flags), and respects reduced motion.
   No existing function is modified.
   ════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FINE   = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
  var raf = window.requestAnimationFrame || function(f){return setTimeout(f,16);};

  /* ── 0. App-wide living background (sits behind the transparent shell) ── */
  (function appBg(){
    if(document.getElementById('lux-app-bg')) return;
    var bg = document.createElement('div'); bg.id='lux-app-bg';
    bg.innerHTML = REDUCE ? '' : '<span class="lux-orb o1"></span><span class="lux-orb o2"></span><span class="lux-orb o3"></span>';
    document.body.insertBefore(bg, document.body.firstChild);
  })();

  /* ── 1. Ripple on every .btn (global delegation, survives re-renders) ─── */
  document.addEventListener('pointerdown', function(e){
    var btn = e.target.closest && e.target.closest('.btn');
    if(!btn || btn.disabled || REDUCE) return;
    var r = btn.getBoundingClientRect();
    var d = Math.max(r.width, r.height);
    var s = document.createElement('span');
    s.className = 'lux-ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d/2) + 'px';
    s.style.top  = (e.clientY - r.top  - d/2) + 'px';
    btn.appendChild(s);
    setTimeout(function(){ s.remove(); }, 620);
  }, {passive:true});

  /* ── 2+3. Cursor glow + magnetic gold CTAs (desktop only) ──────────────
     These were two separate pointermove listeners, each running its own
     closest() walk on every single mouse move, and the magnetic one also ran
     a document-wide querySelectorAll every frame. Merged into ONE listener
     doing one rAF per frame, with the pulled button held in a variable
     instead of re-queried. Same behaviour, a fraction of the work. */
  if(FINE && !REDUCE){
    var cur = document.createElement('div'); cur.id = 'lux-cursor';
    document.body.appendChild(cur); document.body.classList.add('lux-cursor-on');
    var HOT_SEL = '.btn,.nav-item,.mnav-item,.est-card,.user-pill,a,.tab';
    var cx=0, cy=0, tick=false, pulled=null, lastTarget=null;
    document.addEventListener('pointermove', function(e){
      cx=e.clientX; cy=e.clientY; lastTarget=e.target;
      if(tick) return; tick=true;
      raf(function(){
        tick=false;
        cur.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';
        // Use the captured event target, not elementFromPoint(): the latter
        // hit-tests the whole document every frame, which is expensive on a
        // large estimate table.
        var el = lastTarget;
        if(!el || !el.closest){ if(pulled){ pulled.style.transform=''; pulled=null; } return; }
        cur.classList.toggle('hot', !!el.closest(HOT_SEL));
        var b = el.closest('.btn-gold');
        if(pulled && pulled!==b){ pulled.style.transform=''; pulled=null; }
        if(!b) return;
        var r=b.getBoundingClientRect();
        b.style.transform='translate('+((cx-(r.left+r.width/2))*0.18)+'px,'+((cy-(r.top+r.height/2))*0.28)+'px)';
        pulled=b;
      });
    }, {passive:true});
    document.addEventListener('pointerleave', function(){
      cur.style.opacity=0;
      if(pulled){ pulled.style.transform=''; pulled=null; }
    });
    document.addEventListener('pointerenter', function(){ cur.style.opacity=''; });
  }

  /* ── 4. Scroll-reveal observer ─────────────────────────────────────────── */
  // threshold:0 — reveal on ANY intersection.
  //
  // This was 0.08, which silently broke long content: an element taller than
  // roughly 12.5 viewports can never reach 8% visibility, so the callback
  // never fired, .in was never added, and the element stayed at opacity:0
  // permanently. A Final Estimate with a long Supply section crosses that
  // line easily. Revealing on any intersection removes the trap entirely.
  var revObs = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); revObs.unobserve(en.target); } });
  }, {threshold:0, rootMargin:'0px 0px -6% 0px'}) : null;

  function markReveals(scope){
    if(REDUCE || !revObs) return;
    var sel = '.card, .est-card, .stat-card, .dash-cat-section, .ws-toolbar, .table-wrap';
    scope.querySelectorAll(sel).forEach(function(el, i){
      if(el.hasAttribute('data-lux-rev')) return;
      // Skip document-like content: no visual benefit, and translateY() would
      // promote a huge table to its own compositing layer.
      // NOTE: this used to also measure el.offsetHeight. That read sits in a
      // loop that writes attributes/classes/styles, so every element forced a
      // synchronous re-layout — classic layout thrashing, and brutal on a
      // 300+ item estimate. The threshold:0 observer above already prevents
      // the original "never reveals" bug, so the measurement is not needed.
      if (el.closest && el.closest('#fe-result')) { el.setAttribute('data-lux-rev','1'); return; }
      el.setAttribute('data-lux-rev','1');
      el.classList.add('lux-reveal');
      el.style.transitionDelay = Math.min(i*40, 240) + 'ms';
      revObs.observe(el);
    });
  }

  /* ── 5. Animated counters on .stat-val ─────────────────────────────────── */
  function animateCount(el){
    if(el.hasAttribute('data-lux-count')) return;
    var raw = el.textContent.trim();
    var m = raw.match(/[\d,]+(\.\d+)?/);            // first numeric token
    if(!m){ return; }
    el.setAttribute('data-lux-count','1');
    var numStr = m[0];
    var hasComma = numStr.indexOf(',') > -1;
    var decimals = (numStr.split('.')[1]||'').length;
    var target = parseFloat(numStr.replace(/,/g,''));
    if(!isFinite(target) || target===0){ return; }
    var prefix = raw.slice(0, m.index), suffix = raw.slice(m.index + m[0].length);
    if(REDUCE){ return; }                            // leave final value as rendered
    var dur = 1100, start = null;
    function fmt(v){
      var n = decimals ? v.toFixed(decimals) : Math.round(v);
      if(hasComma) n = Number(n).toLocaleString('en-IN', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
      return prefix + n + suffix;
    }
    function step(t){
      if(start===null) start=t;
      var p = Math.min((t-start)/dur, 1);
      var eased = 1 - Math.pow(1-p, 3);             // easeOutCubic
      el.textContent = fmt(target*eased);
      if(p<1) raf(step); else el.textContent = prefix + numStr + suffix;
    }
    raf(step);
  }
  function markCounters(scope){
    scope.querySelectorAll('.stat-val').forEach(animateCount);
  }

  /* ── 6. Topbar scroll elevation (the .main element scrolls) ────────────── */
  function wireTopbarElevation(){
    var main = document.getElementById('main-content');
    var bar  = document.querySelector('.topbar');
    if(!main || !bar || main.hasAttribute('data-lux-scroll')) return;
    main.setAttribute('data-lux-scroll','1');
    var tick=false;
    main.addEventListener('scroll', function(){
      if(tick) return; tick=true;
      raf(function(){ bar.classList.toggle('is-scrolled', main.scrollTop>8); tick=false; });
    }, {passive:true});
  }

  /* ── 7. Cinematic dark entry: particles + pointer-reactive drift ───────── */
  var partState = null;
  function enhanceAuth(){
    var wrap = document.querySelector('.auth-wrap');
    if(!wrap){ if(partState){ partState.stop(); partState=null; } return; }
    var card = wrap.querySelector('.auth-card');
    if(card && !card.classList.contains('lux-stagger')) card.classList.add('lux-stagger');
    if(REDUCE || wrap.hasAttribute('data-lux-auth')) return;
    wrap.setAttribute('data-lux-auth','1');
    if(partState){ partState.stop(); partState=null; }   // kill any prior (detached) loop

    // current light-sweep
    var sweep = document.createElement('div'); sweep.className='lux-sweep'; wrap.appendChild(sweep);

    // cinematic depth stack: beams (back) → orbs → circuit net → skyline (front)
    var stack = document.createElement('div');
    stack.innerHTML =
      '<div class="lux-beams"></div>' +
      '<div class="lux-hero-orbs"><span class="h1"></span><span class="h2"></span><span class="h3"></span></div>' +
      '<div class="lux-circuit-net"></div>' +
      '<div class="lux-skyline"></div>' +
      '<div class="lux-horizon"></div>';
    while(stack.firstChild) wrap.appendChild(stack.firstChild);
    var skyline = wrap.querySelector('.lux-skyline');
    // subtle skyline parallax follows the pointer (desktop)
    if(FINE){
      wrap.addEventListener('pointermove', function(e){
        var r=wrap.getBoundingClientRect();
        var nx=(e.clientX-r.left)/r.width - .5;
        skyline.style.transform = 'translate3d('+(nx*-22)+'px,0,0)';
      }, {passive:true});
    }

    // particle field — gold/cyan motes drifting like ionised air in a switchyard
    var cv = document.createElement('canvas'); cv.id='lux-particles'; wrap.appendChild(cv);
    var ctx = cv.getContext('2d'), DPR = Math.min(window.devicePixelRatio||1, 2);
    var W,H,parts,mouse={x:-999,y:-999}, running=true;
    function resize(){
      W=wrap.clientWidth; H=wrap.clientHeight;
      cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      var count = Math.max(28, Math.min(72, Math.round(W*H/26000)));
      parts = []; for(var i=0;i<count;i++) parts.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.8+0.6,
        vx:(Math.random()-.5)*0.25, vy:(Math.random()-.5)*0.25,
        g:Math.random()<0.4, a:Math.random()*0.5+0.25
      });
    }
    function tick(){
      if(!running) return;
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<parts.length;i++){
        var p=parts[i];
        // gentle pointer repulsion → "dynamic mouse movement reactions"
        var dx=p.x-mouse.x, dy=p.y-mouse.y, dist=dx*dx+dy*dy;
        if(dist<14000){ var f=(14000-dist)/14000*0.6; p.vx+=dx/Math.sqrt(dist+1)*f*0.3; p.vy+=dy/Math.sqrt(dist+1)*f*0.3; }
        p.vx*=0.99; p.vy*=0.99;
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832);
        ctx.fillStyle = p.g ? 'rgba(212,175,55,'+p.a+')' : 'rgba(0,212,255,'+p.a+')';
        ctx.shadowBlur=8; ctx.shadowColor=p.g?'rgba(212,175,55,.7)':'rgba(0,212,255,.6)';
        ctx.fill();
      }
      ctx.shadowBlur=0;
      raf(tick);
    }
    wrap.addEventListener('pointermove', function(e){ var r=wrap.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; }, {passive:true});
    wrap.addEventListener('pointerleave', function(){ mouse.x=mouse.y=-999; });
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden && running){ raf(tick);} });
    resize(); raf(tick);
    partState = { stop:function(){ running=false; window.removeEventListener('resize',resize); } };
  }

  /* ── Orchestration: run once + on every app mutation (debounced) ───────── */
  function enhanceApp(){
    var scope = document.getElementById('main-content') || document.body;
    wireTopbarElevation();
    markReveals(scope);
    markCounters(scope);
  }
  var deb;
  function runAll(){
    enhanceAuth();
    enhanceApp();
  }
  var mo = new MutationObserver(function(){
    clearTimeout(deb); deb = setTimeout(runAll, 130);
  });
  var appRoot = document.getElementById('app') || document.body;
  mo.observe(appRoot, {childList:true, subtree:true});

  // initial passes (cover load + first render). The first pass is immediate
  // (reveals / counters / topbar); the heavier follow-up passes are deferred
  // to idle time so they don't delay first paint on slow devices.
  raf(runAll);
  var idleRun = window.requestIdleCallback || function(fn){ return setTimeout(fn, 500); };
  idleRun(function(){ runAll(); setTimeout(runAll, 700); });
})();
</script>
