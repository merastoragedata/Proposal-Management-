// ══════════════════════════════════════════════════════════════
// PR (Purchase Requisition) FORMAT EXPORT — strict SAP-upload template.
// Supply & Project Services: flat one-row-per-item ("In Item Overview").
// O&M Services: ONE item-overview row + a "Services for selected Item"
// sub-table with one row per O&M item (SAP services structure).
// Matches PR_CREATION_FORMAT.xlsx exactly: same headers, same column
// positions, same banner/label colors.
// ══════════════════════════════════════════════════════════════

const PR_BANNER_FILL = 'FF9FC5E8'; // light blue "In Item Overview" banner
const PR_LABEL_FILL  = 'FFD9D9D9'; // gray column-label row

function matGroupForItem(it) {
  if (it.isCustom || it.version==='NONSOR' || !it.version) return '';
  const hit = ST.sorCache.find(s=>s.item_no===it.item_no && s.version===it.version);
  return hit ? (hit.matGroup||'') : '';
}
function prItemOverviewSheetRows(items, ps) {
  // Columns: A=Sr, B=Item category, C=Account assignment, D=Material,
  // E=Short text, F=quantity, I=Delivery date, J=Purchasing group,
  // K=Material Group, L=Plant, M=Store location, S=Requisitioner
  const header1 = new Array(19).fill('');
  header1[1] = 'In Item Overview';
  const header2 = new Array(19).fill('');
  for (let i=1;i<=18;i++) header2[i] = i;
  const header3 = new Array(19).fill('');
  header3[1]='Item category'; header3[2]='Account assingmnet'; header3[3]='Material';
  header3[4]='Short text'; header3[5]='quantity'; header3[8]='Delivery date';
  header3[9]='Purchasing group'; header3[10]='Material Group'; header3[11]='Plant'; header3[12]='Store location'; header3[18]='Requistioner';

  const rows = [header1, header2, header3];
  items.forEach((it, idx) => {
    const row = new Array(19).fill('');
    row[0] = idx+1;
    row[2] = 'U';
    row[3] = isFinite(Number(it.item_no)) ? Number(it.item_no) : it.item_no;
    row[5] = it.qty;
    row[8] = ps.deliveryDate;
    row[9] = isFinite(Number(ps.purchaseGroup)) ? Number(ps.purchaseGroup) : ps.purchaseGroup;
    row[10] = matGroupForItem(it);
    row[11] = isFinite(Number(ps.plant)) ? Number(ps.plant) : ps.plant;
    row[12] = ps.storageLocation;
    row[18] = ps.requisitioner;
    rows.push(row);
  });
  return rows;
}

function prOMSheetRows(items, ps) {
  // Single item-overview row (Item Category = D) + a service-line
  // sub-table with one row per O&M item.
  const header1 = new Array(19).fill('');
  header1[1] = 'In Item Overview';
  const header2 = new Array(19).fill('');
  for (let i=1;i<=18;i++) header2[i] = i;
  const header3 = new Array(19).fill('');
  header3[1]='Item Category'; header3[2]='Account assingmnet'; header3[3]='Material';
  header3[4]='Short text'; header3[5]='quantity'; header3[6]='UOM'; header3[8]='Delivery date';
  header3[9]='Purchasing group'; header3[10]='Material Group'; header3[11]='Plant'; header3[12]='Store location'; header3[18]='Requistioner';
  const overviewRow = new Array(19).fill('');
  overviewRow[0]=1; overviewRow[1]='D'; overviewRow[2]='U'; overviewRow[4]='O&M Services';
  overviewRow[5]=1; overviewRow[6]='AU'; overviewRow[8]=ps.deliveryDate;
  overviewRow[9]=isFinite(Number(ps.purchaseGroup)) ? Number(ps.purchaseGroup) : ps.purchaseGroup;
  overviewRow[11]=isFinite(Number(ps.plant)) ? Number(ps.plant) : ps.plant;
  overviewRow[12]=ps.storageLocation; overviewRow[18]=ps.requisitioner;

  const blank = new Array(19).fill('');
  const svcBanner = new Array(19).fill('');
  svcBanner[1] = 'In Services for selected Item';
  const svcHeader = new Array(19).fill('');
  svcHeader[1]='Service No'; svcHeader[2]='Short text '; svcHeader[3]='Quantity';
  svcHeader[4]='UOM'; svcHeader[5]='Gross Price '; svcHeader[6]='Currency';

  const rows = [header1, header2, header3, overviewRow, blank, svcBanner, svcHeader];
  items.forEach((it, idx) => {
    const row = new Array(19).fill('');
    row[0] = idx+1;
    row[1] = isFinite(Number(it.item_no)) ? Number(it.item_no) : it.item_no;
    row[3] = it.qty;
    row[4] = it.uom;
    // SOR service items are priced at Re 1 (SAP holds the SOR rate); Non-SOR
    // items carry their actual rate.
    row[5] = it.isCustom ? it.rate : 1;
    row[6] = 'INR';
    rows.push(row);
  });
  return rows;
}

function prStylePass(ws, rows) {
  // Light-blue banner row, gray column-label row, yellow flag on O&M's
  // blank Material cell — matches the original template exactly.
  for (let r=0;r<rows.length;r++) {
    const isBanner = typeof rows[r][1]==='string' && (rows[r][1]==='In Item Overview' || rows[r][1]==='In Services for selected Item');
    const isLabelRow = typeof rows[r][1]==='string' && ['Item category','Item Category','Service No'].includes(rows[r][1]);
    if (!isBanner && !isLabelRow) continue;
    for (let c=1;c<rows[r].length;c++) {
      const addr = XLSX.utils.encode_cell({r,c});
      if (!ws[addr]) ws[addr] = {t:'s', v:rows[r][c]||''};
      ws[addr].s = { fill:{patternType:'solid', fgColor:{rgb: isBanner?PR_BANNER_FILL:PR_LABEL_FILL}}, font:{name:EXPORT_FONT, bold:true}, border:{top:_THIN,bottom:_THIN,left:_THIN,right:_THIN} };
    }
  }
}

async function sorUploadHandler(evt){
  const file = evt.target.files[0]; evt.target.value='';
  if (!file) return;
  const version = (document.getElementById('sor-new-version')||{}).value.trim();
  const code = (document.getElementById('sor-new-code')||{}).value.trim();
  const status = document.getElementById('sor-upload-status');
  if (!version) { toast('Enter a version name first.','warn'); return; }
  // A new SOR release must use a NEW version name. Under a new version, repeated
  // item numbers from older versions are ADDED (never rejected). Re-using an
  // existing version name would skip items already stored under it.
  if ((ST.sorVersions||[]).includes(version)) {
    const proceed = await confirmDialog(
      `Version "${version}" already exists`,
      `A new SOR release should get a new version name (e.g. "SOR March 2026") so its items — even repeated numbers from earlier SORs — are added under it. If you continue with this existing name, only item numbers not already in this version will be added; the rest are skipped. Continue anyway?`,
      'Continue', 'Cancel');
    if (!proceed) return;
  }
  if (status) status.innerHTML = '<span class="spinner dark"></span> Reading…';
  try {
    const X = await ensureSheetJS();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    const grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false, defval:''});
    // Accepts either the simple template (a single "Item No"/"Material/Service No"
    // column) OR the raw SAP SOR export (separate "Material" and "Service"
    // columns, one populated per row depending on Type M/S).
    let hIdx = grid.findIndex(r=> r.some(c=>/(material\s*\/?\s*service\s*no|^item\s*no)/i.test(String(c).trim()))
      || (r.some(c=>/^material$/i.test(String(c).trim())) && r.some(c=>/^service$/i.test(String(c).trim()))));
    if (hIdx<0) throw new Error('Header row with "Item No" (or "Material/Service No", or separate "Material" + "Service" columns) not found.');
    const H = grid[hIdx].map(c=>String(c).trim());
    const ci = {
      mat:H.findIndex(c=>/(material\s*\/?\s*service\s*no|^item\s*no)/i.test(c)),
      matCol:H.findIndex(c=>/^material$/i.test(c)), svcCol:H.findIndex(c=>/^service$/i.test(c)),
      desc:H.findIndex(c=>/description/i.test(c)),
      uom:H.findIndex(c=>/uom|unit/i.test(c)), sec:H.findIndex(c=>/^section$/i.test(c)), rate:H.findIndex(c=>/rate|price/i.test(c)),
      matgrp:H.findIndex(c=>/mat\s*group|mat\.?\s*grp/i.test(c)),
    };
    const cellNo = (v)=>{ if (v===''||v==null) return ''; const n=Number(v); return String(Number.isFinite(n) && n!==0 ? Math.trunc(n) : v).trim(); };
    const items = [];
    for (let r=hIdx+1;r<grid.length;r++){
      const row=grid[r];
      let matNo = ci.mat>=0 ? String(row[ci.mat]==null?'':row[ci.mat]).trim() : '';
      if (!matNo && ci.matCol>=0) matNo = cellNo(row[ci.matCol]);
      if (!matNo && ci.svcCol>=0) matNo = cellNo(row[ci.svcCol]);
      if(!matNo) continue;
      let sec = (ci.sec>=0?String(row[ci.sec]).toLowerCase().trim():'') || (feClassify(matNo)||'supply');
      if (/etc|project/.test(sec)) sec='project'; else if (/o&m|om|service/.test(sec)) sec='om'; else if (/supply|material/.test(sec)) sec='supply';
      items.push({ item_no:matNo, description:ci.desc>=0?String(row[ci.desc]):'', uom:ci.uom>=0?String(row[ci.uom]):'',
        section:sec, rate:ci.rate>=0?(parseFloat(row[ci.rate])||0):0, mat_group: ci.matgrp>=0?String(row[ci.matgrp]==null?'':row[ci.matgrp]).trim():'' });
    }
    if (!items.length) throw new Error('No item rows found.');
    if (status) status.innerHTML = '<span class="spinner dark"></span> Publishing '+items.length+' items…';
    const res = await apiPost({action:'importSOR', items, version});
    if (!res.ok) throw new Error(explainBackendError(res.error)||'Import failed');
    if (code) { try { await apiPost({action:'setSorCode', version, code, actingRole:ST.user.role}); ST.sorCodes = ST.sorCodes||{}; ST.sorCodes[version]=code; } catch(e){} }
    if (!ST.sorVersions.includes(version)) ST.sorVersions.push(version);
    const added = res.added!=null?res.added:items.length, skipped = res.skipped||0;
    if (status) status.innerHTML = `<span class="badge badge-ok">✓ Published "${escapeHtml(version)}"${code?' (code '+escapeHtml(code)+')':''} — ${added} added${skipped?`, ${skipped} already present (skipped)`:''}.</span>`;
    toast(`SOR "${version}" published — ${added} item(s) added.`,'ok');
  } catch(err){ console.error(err); if (status) status.innerHTML = `<span class="badge badge-bad">✗ ${escapeHtml(err.message||'error')}</span>`; }
}

async function syncSORFromDatabase() {
  const btn = document.getElementById('sor-sync-btn');
  const origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="sync-bolt sync-bolt-active">⚡</span> Syncing…';
  try {
    const versRes = await api('getSORVersions');
    if (!versRes.ok) throw new Error(versRes.error||'Sync failed');
    ST.sorVersions = versRes.versions||[];
    ST.sorVersionCounts = versRes.counts||{};
    // Re-fetch every currently-checked version fresh from the backend
    const toFetch = RP.checkedVersions.filter(v=>v!=='NONSOR' && ST.sorVersions.includes(v));
    const fetched = await Promise.all(toFetch.map(v=>api('getSOR', {version:v})));
    let newCache = ST.sorCache.filter(it=>!toFetch.includes(it.version));
    fetched.forEach((res,i)=>{ if (res.ok) newCache = newCache.concat(res.items||[]); });
    ST.sorCache = newCache;
    const nonSorRes = await api('getNonSOR');
    if (nonSorRes.ok) ST.nonSorCache = nonSorRes.items||[];
    // Re-render in place: keep the user's current checked versions and search,
    // just refresh the checkbox list (counts/versions) and table contents.
    RP.checkedVersions = RP.checkedVersions.filter(v=>v==='NONSOR' || ST.sorVersions.includes(v));
    renderVersionCheckboxes('rp-version-checks', RP.checkedVersions, 'onRPVersionsChanged', false);
    renderRPSorTable();
    btn.innerHTML = '<span class="sync-bolt">⚡</span> Synced!';
    toast('Synced with database', 'ok');
    setTimeout(()=>{ btn.innerHTML = origHtml; btn.disabled = false; }, 1100);
  } catch(e) {
    btn.innerHTML = origHtml; btn.disabled = false;
    toast(e.message||'Sync failed', 'err');
  }
}

// Classification rule (verified against production SOR data):
// 5 followed by 9 total digits → Supply | 5 followed by 8 total digits → O&M
// 3 followed by 9 total digits → Project. Falls back to a provided/explicit
// section value in the row if the digit pattern doesn't match cleanly.
function classifySORItemNo(item_no, explicitSection) {
  const s = String(item_no).trim();
  if (/^5\d{8}$/.test(s)) return 'supply';      // 5 + 9 digits total
  if (/^5\d{7}$/.test(s)) return 'om';          // 5 + 8 digits total
  if (/^3\d{8}$/.test(s)) return 'project';     // 3 + 9 digits total
  const norm = String(explicitSection||'').trim().toLowerCase();
  if (norm==='supply'||norm==='project'||norm==='om') return norm;
  return null; // unclassifiable — flagged in preview
}

async function handleSORFileSelect() {
  const versionName = document.getElementById('import-version-name').value.trim();
  const fileInput = document.getElementById('import-sor-file');
  const statusEl = document.getElementById('import-sor-status');
  statusEl.innerHTML = '';
  const file = fileInput.files[0];
  if (!file) { statusEl.innerHTML = '<p class="error-text">Choose a file first.</p>'; return; }

  statusEl.innerHTML = '<span class="spinner dark"></span> Parsing file…';
  try {
    const XLSXmod = await ensureSheetJS();
    const buf = await file.arrayBuffer();
    const wb = XLSXmod.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSXmod.utils.sheet_to_json(ws, {defval:''});
    if (!rows.length) { statusEl.innerHTML = '<p class="error-text">File has no data rows.</p>'; return; }

    // Tolerant column-name matching (case/spacing-insensitive)
    const keyMap = {};
    Object.keys(rows[0]).forEach(k=>{
      const norm = k.toLowerCase().replace(/[^a-z0-9]/g,'');
      if (!keyMap.item_no && ['itemno','itemnumber','item','materialno','itemcode'].includes(norm)) keyMap.item_no = k;
      else if (!keyMap.description && ['description','desc','itemdescription'].includes(norm)) keyMap.description = k;
      else if (!keyMap.uom && ['uom','unit'].includes(norm)) keyMap.uom = k;
      else if (!keyMap.rate && (norm.startsWith('rate') || norm.startsWith('price') || norm==='amount')) keyMap.rate = k;
      else if (!keyMap.section && ['section','category'].includes(norm)) keyMap.section = k;
      else if (!keyMap.version && ['version','sorversion','sorvers'].includes(norm)) keyMap.version = k;
    });
    if (!keyMap.item_no || !keyMap.description || !keyMap.rate) {
      statusEl.innerHTML = '<p class="error-text">Could not find required columns (item_no, description, rate) in the file header row.</p>';
      return;
    }

    const parsed = [];
    let unclassified = 0;
    let missingVersion = 0;
    rows.forEach(r=>{
      const item_no = String(r[keyMap.item_no]||'').trim();
      if (!item_no) return;
      const section = classifySORItemNo(item_no, keyMap.section ? r[keyMap.section] : null);
      if (!section) unclassified++;
      const rowVersion = keyMap.version ? String(r[keyMap.version]||'').trim() : '';
      if (!rowVersion && !versionName) missingVersion++;
      parsed.push({
        item_no, description: String(r[keyMap.description]||'').trim(),
        uom: String(r[keyMap.uom]||'').trim(), rate: parseFloat(r[keyMap.rate])||0,
        section: section||'project', version: rowVersion || versionName
      });
    });

    if (missingVersion > 0) {
      statusEl.innerHTML = `<p class="error-text">${missingVersion} row(s) have no version column value and no default version name was entered. Enter a default version name above to cover them, or add a "version" column to the file.</p>`;
      return;
    }
    // Guard against overwriting an existing version name (only when every row
    // shares the single typed-in default — a mixed-version file legitimately
    // may append to versions that already exist, which importSOR's
    // duplicate-detection already handles safely).
    const distinctVersions = [...new Set(parsed.map(p=>p.version))];
    if (distinctVersions.length===1 && ST.sorVersions.includes(distinctVersions[0])) {
      statusEl.innerHTML = `<p class="hint" style="color:var(--gold-600)">⚠ Version "${escapeHtml(distinctVersions[0])}" already exists — new items will be added, duplicates skipped automatically.</p>`;
    }

    openSORImportPreview(parsed, unclassified);
    statusEl.innerHTML = '';
  } catch(e) {
    statusEl.innerHTML = `<p class="error-text">${escapeHtml(e.message)}</p>`;
  }
}

    <div class="table-wrap" style="max-height:260px; overflow-y:auto; margin-bottom:14px">

        </tbody>
      </table>

async function submitSORImport() {
  if (!_pendingSORImport) return;
  const {parsed} = _pendingSORImport;
  const err = document.getElementById('sor-import-error');
  const btn = event && event.target ? event.target : null;
  const origText = btn ? btn.innerHTML : '';
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Importing…'; btn.disabled = true; }
  try {
    // version is carried per-item; the batch-level 'version' param is only
    // a fallback for any item missing its own (none should, by this point).
    const res = await apiPost({action:'importSOR', items: parsed, version: parsed[0] && parsed[0].version});
    if (!res.ok) { err.textContent = res.error||'Import failed.'; err.style.display='block'; return; }
    closeModal();
    _pendingSORImport = null;
    const versionList = (res.versions||[]).join(', ');
    toast(`Imported ${res.added} items (${res.skipped} duplicates skipped) into: ${versionList}`, 'ok', 6000);
    const versRes = await api('getSORVersions');
    if (versRes.ok) { ST.sorVersions = versRes.versions||[]; ST.sorVersionCounts = versRes.counts||{}; }
    const importedVersions = res.versions || [];
    for (const v of importedVersions) {
      const sorRes = await api('getSOR', {version: v});
      if (sorRes.ok) ST.sorCache = ST.sorCache.filter(it=>it.version!==v).concat(sorRes.items||[]);
    }
    RP.checkedVersions = importedVersions;
    renderRatesPage();
  } catch(e) {
    err.textContent = e.message; err.style.display='block';
  } finally {
    if (btn) { btn.innerHTML = origText; btn.disabled = false; }
  }
}

// Render stored description as HTML, stripping anything unsafe. Old plain-text
// descriptions render unchanged.
function htmlToPlain(html){ return String(html==null?'':html).replace(/<br\s*\/?>/gi,' ').replace(/<\/(p|div|li)>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/\s+/g,' ').trim(); }
function richDisplay(html){
  if (html==null) return '';

       .replace(/ on\w+\s*=\s*"[^"]*"/gi,'')

  return s;
}

async function onTcpImageSelected(evt, kind, key) {
  const file = evt.target.files[0];
  evt.target.value = '';
  if (!file) return;
  toast('Uploading image…', 'ok', 1500);
  try {
    const compressed = await compressImageFile(file, 0.5, 1200);
    const res = await apiPost({action:'uploadTcpImage', kind, key, fileName:file.name, mimeType:compressed.mimeType, base64Data:compressed.base64});
    if (!res.ok) { toast(explainBackendError(res.error)||'Upload failed.', 'err', 7000); return; }
    if (kind==='tcode') {
      const it = ST.tcodesCache.find(t=>t.tcode===key); if (it) it.image = res.url;
    } else {
      const it = ST.processesCache.find(p=>p.name===key); if (it) it.image = res.url;
    }
    toast('Image uploaded.', 'ok');
    renderTCPContent();
  } catch(e) { toast(e.message||'Upload failed.', 'err'); }
}

async function submitTCode(origTcode) {
  const tcode = document.getElementById('tc-code').value.trim();
  const purpose = document.getElementById('tc-purpose').value.trim();
  const category = (document.getElementById('tc-category')||{value:''}).value.trim();
  const description = richValue('tc-desc');
  const remarks = document.getElementById('tc-remarks').value.trim();
  const err = document.getElementById('tc-error');
  err.style.display='none';
  if (!tcode) { err.textContent='T Code is required.'; err.style.display='block'; return; }
  const btn = document.getElementById('tc-submit-btn');
  await withSaveStatus(btn, async () => {

    if (origTcode) {
      res = await apiPost({action:'updateTCode', item:{tcode, origTcode, purpose, description, remarks, category}, userId:ST.user.id, role:ST.user.role});

    closeModal();
  }, origTcode?'T Code updated.':'T Code added.');

async function refreshTCP() {
  const results = await Promise.all([api('getTCodes'), api('getProcesses')]);
  const t = results[0], p = results[1];
  if (t.ok) ST.tcodesCache = t.items||[];
  if (p.ok) ST.processesCache = p.items||[];
  renderTCPContent();
}

// ── Abstract Summary — ALL rows visible (no hiding), read-only mirror of the Estimate page's Abstract tab ──
function renderPgAbstractSummary(est) {
  const zone = document.getElementById('pg-abstract-summary');
  if (!zone) return;
  if (est.estimateType === 'amc') {
    zone.innerHTML = `
      <div class="sr-row"><span class="sr-no"></span><span class="sr-label">AMC Amount Limit</span><span class="sr-val">${fmtINR(est.amcAmount||0)}</span></div>
      <div class="sr-row final"><span class="sr-no"></span><span class="sr-label">Amount in Words</span><span class="sr-val" style="font-size:12px">${escapeHtml(toWords(est.amcAmount||0))} Rupees Only</span></div>
    `;
    return;
  }
  const totals = computeAllSectionTotals();
  const supply = totals.supply + totals.nonSorSupply;
  const project = totals.project;
  const om = totals.om + totals.nonSorOm;
  const subA = supply + project + om;
  let rows = `
    <div class="sr-row"><span class="sr-no">1</span><span class="sr-label">Cost of Material (Supply Portion)</span><span class="sr-val">${fmtINR(supply)}</span></div>
    <div class="sr-row"><span class="sr-no">2</span><span class="sr-label">Cost of Work – Project Services (ETC Part)</span><span class="sr-val">${fmtINR(project)}</span></div>
    <div class="sr-row"><span class="sr-no">3</span><span class="sr-label">Cost of Work – O&amp;M Services</span><span class="sr-val">${fmtINR(om)}</span></div>
    <div class="sr-row subtotal"><span class="sr-no">4</span><span class="sr-label">Sub Total "A" (1+2+3)</span><span class="sr-val">${fmtINR(subA)}</span></div>
  `;
  let finalTotal = subA;
  if (est.estimateType === 'rm') {
    rows += `<div class="sr-row final"><span class="sr-no"></span><span class="sr-label">TOTAL ESTIMATED COST</span><span class="sr-val">${fmtINR(subA)}</span></div>`;
  } else {
    const rates = effectiveRates();
    const pv = subA*(rates.pv||0)/100, cont = subA*(rates.contingencies||0)/100;
    let sr7 = subA+pv+cont;
    rows += `
      <div class="sr-row"><span class="sr-no">5</span><span class="sr-label">Price Variation (PV) @ ${rates.pv||0}%</span><span class="sr-val">${fmtINR(pv)}</span></div>
      <div class="sr-row"><span class="sr-no">6</span><span class="sr-label">Contingencies @ ${rates.contingencies||0}%</span><span class="sr-val">${fmtINR(cont)}</span></div>
    `;
    if (est.trLineMode) {
      const landComp = sr7*(est.landCompChargePct||15)/100;
      sr7 += landComp;
      rows += `<div class="sr-row"><span class="sr-no">6A</span><span class="sr-label">Land &amp; Compensation Charges @ ${est.landCompChargePct||15}%</span><span class="sr-val">${fmtINR(landComp)}</span></div>`;
    }
    const centages = sr7*(rates.centages||0)/100;
    const total = sr7+centages;
    finalTotal = total;
    rows += `
      <div class="sr-row"><span class="sr-no">7</span><span class="sr-label">Total Estimated Cost Without Centages</span><span class="sr-val">${fmtINR(sr7)}</span></div>
      <div class="sr-row"><span class="sr-no">8</span><span class="sr-label">Centages (Supervision) @ ${rates.centages||0}%</span><span class="sr-val">${fmtINR(centages)}</span></div>
      <div class="sr-row final"><span class="sr-no">9</span><span class="sr-label">TOTAL ESTIMATED COST WITH CENTAGES (7+8)</span><span class="sr-val">${fmtINR(total)}</span></div>
    `;
  }
  rows += `<div class="awords-box" style="margin-top:14px">Amount in Words: Rupees ${escapeHtml(toWords(finalTotal))} Only</div>`;
  zone.innerHTML = rows;
}

// ── Progress images — uploaded to Google Drive (compressed ~50%), stored
// as {fileId, url, caption} records. Requires the estimate to be saved
// first (needs an ID for the per-estimate Drive folder name). ──
async function onProgressImageSelected(evt) {
  const file = evt.target.files[0];
  evt.target.value = '';
  if (!file) return;
  const est = ST.currentEstimate;
  if (!est.id) { toast('Save the estimate first, then add images.', 'warn'); return; }
  if (est.progressImages.length>=5) { toast('Maximum 5 images allowed.', 'warn'); return; }
  const zone = document.getElementById('pg-img-grid');
  const uploadingTile = document.createElement('div');
  uploadingTile.className = 'img-tile';
  uploadingTile.innerHTML = `<div class="flex items-center justify-center" style="height:96px"><span class="spinner dark"></span></div><div class="img-cap text-muted">Uploading…</div>`;
  if (zone) zone.appendChild(uploadingTile);
  try {
    const compressed = await compressImageFile(file, 0.5, 1600);
    const res = await apiPost({
      action:'uploadEstimateImage', estimateId: est.id, estimateName: est.name,
      fileName: file.name, mimeType: compressed.mimeType, base64Data: compressed.base64
    });
    if (!res.ok) { toast(explainBackendError(res.error)||'Image upload failed.', 'err', 7000); uploadingTile.remove(); return; }
    est.progressImages.push({fileId: res.fileId, url: res.url, caption: ''});
    toast('Image uploaded.', 'ok');
    renderProgressImages(!canEdit() || !ownsEstimate(est));
  } catch(e) {
    toast(e.message||'Image upload failed.', 'err');
    uploadingTile.remove();
  }
}
function renderProgressImages(readOnly) {
  const est = ST.currentEstimate;
  const zone = document.getElementById('pg-img-grid');
  if (!zone) return;
  // Owner or admin can view/delete; anyone with access to this page can also view (per app-wide access rules)
  zone.innerHTML = est.progressImages.map((img,i) => `
    <div class="img-tile">
      <img src="${img.url}" onclick="openLightbox('${img.url.replace(/'/g,"\\'")}')" loading="lazy">
      <div class="img-actions">
        <button onclick="openLightbox('${img.url.replace(/'/g,"\\'")}')" title="View">👁</button>
        ${!readOnly?`<button onclick="deleteProgressImage(${i})" title="Delete">✕</button>`:''}
      </div>

async function deleteProgressImage(i) {
  const est = ST.currentEstimate;
  const img = est.progressImages[i];
  if (!img) return;
  try {
    if (img.fileId) {
      const res = await apiPost({action:'deleteEstimateImage', fileId: img.fileId});

    est.progressImages.splice(i,1);

async function saveProgress() {
  const est = ST.currentEstimate;
  est.name = document.getElementById('pg-name').value.trim() || est.name;
  est.number = document.getElementById('pg-number').value.trim();
  est.date = document.getElementById('pg-date').value;
  est.division = document.getElementById('pg-division').value.trim();
  est.ref = document.getElementById('pg-ref').value.trim();
  est.work = document.getElementById('pg-work').value.trim();
  for (let n=1;n<=5;n++) est['remark'+n] = document.getElementById(`pg-remark${n}`).value.trim();
  est.progress.orderClosedRemarks = document.getElementById('pg-orderclosed-remarks').value.trim();
  recomputeEstimateTotals(est);
  const btn = document.getElementById('pg-save-btn');
  await withSaveStatus(btn, async () => {
    invalidateEstCache(est.id);
    const res = await apiPost({action:'saveEstimate', estimate:est, items:ST.currentItems});
    if (!res.ok) { toast(res.error||'Save failed', 'err'); return false; }
    const idx = ST.estimatesCache.findIndex(x=>x.id===est.id);
    const summary = {...est, savedAt: new Date().toISOString(), itemCount: ST.currentItems.length};
    if (idx>-1) ST.estimatesCache[idx] = summary;
  }, 'Proposal progress saved.');
}

// ── Excel export (3 sheets: Summary / Proposal Stages / Financial Tracking) ──
async function exportProgressExcel() {
  const est = ST.currentEstimate;
  toast('Building Excel…', 'ok', 1800);
  const XLSXmod = await ensureSheetJS();
  const wb = XLSXmod.utils.book_new();
  const pd = buildProgressExportData(est);

  const rows = [['']]; // row 0 reserved for MSETCL title banner
  const styleMap = {};
  let r = 1;
  const addSection = (title) => { rows.push([title]); styleMap[r]='section'; r++; };
  const addHeader = (cols) => { rows.push(cols); styleMap[r]='header'; r++; };
  const addRow = (cols) => { rows.push(cols); r++; };
  const addTotal = (cols) => { rows.push(cols); styleMap[r]='total'; r++; };
  const blank = () => { rows.push(['']); r++; };

  addSection(`${est.name}${est.number?' ('+est.number+')':''}`);
  addRow(['Division', est.division||'—']);
  addRow(['Type', estimateTypeLabel(est.estimateType)]);
  addRow(['Status', est.status]);
  blank();

  addSection('Abstract');
  pd.abstractRows.forEach(row => {
    if (/^(Sr\.9|TOTAL ESTIMATED|AMC Amount)/.test(row[0])) addTotal(row); else addRow(row);
  });
  blank();

  addSection('Proposal Progress');
  addRow(['Audited', pd.audited ? 'Yes' : 'No']);
  if (pd.stageRows.length) {
    blank();
    addHeader(['Stage','Done','Remarks','Link']);
    pd.stageRows.forEach(s => { addRow([`${s.num}. ${s.name}`, s.done?'Yes':'No', s.remarks, s.link]); if (s.done) styleMap[r-1]='done'; });
  }
  blank();

  if (pd.orderDetailsRows.length) {
    addSection('Order Related Details');
    pd.orderDetailsRows.forEach(row => addRow(row));
    blank();
  }

  if (pd.woAmount || pd.bills.length) {
    addSection('Financial Tracking');
    addRow(['WO / PO Amount', fmtINR(pd.woAmount)]);
    if (pd.bills.length) {
      blank();
      addHeader(['Bill','Amount','Remarks']);
      pd.bills.forEach(b => addRow([b.label||'', fmtINR(parseFloat(b.amount)||0), b.remarks||'']));
    }
    addTotal(['Available Amount', fmtINR(pd.available)]);
    blank();
  }

  if (pd.orderClosed) {
    addSection('Order Closed');
    addRow(['Status', 'Yes']);
    addRow(['Comment', pd.orderClosedRemarks||'—']);
    blank();
  }

  if (pd.remarks.length) {
    addSection('General Remarks');
    pd.remarks.forEach(rm => addRow([rm]));
    blank();
  }
  if (pd.images.length) {
    addSection('Progress Images (captions)');
    addRow([pd.images.map(im=>im.caption).filter(Boolean).join(' | ')||`${pd.images.length} image(s) — see PDF for images`]);
  }

  const colCount = Math.max(...rows.map(rr=>rr.length), 4);
  rows[0][0] = MSETCL_HEADER_LINE1;

  applySmartColWidths(ws, rows);

}

// ── PDF export (landscape, mirrors Excel, correct heading order, + photo grid) ──
// ── Pairs Order Related Details rows two-at-a-time for a 2x2 PDF layout
// (label/value, label/value side by side) instead of one long vertical list ──
// ── Renders the 25 proposal stages as two side-by-side tables (≈13 rows
// each), matching the webpage's 2-column layout instead of one long
// vertical list — makes better use of landscape page width. ──
function buildTwoColStageTable(stageRows) {
  const half = Math.ceil(stageRows.length / 2);
  const left = stageRows.slice(0, half);
  const right = stageRows.slice(half);
  const linkCell = (url) => url && url.trim()
    ? `<a href="${escapeHtml(url.trim())}" style="color:#374151; font-weight:bold; text-decoration:none; white-space:nowrap; font-size:13px">🔗</a>`
    : '';
  const oneTable = (rows) => `
    <table><colgroup><col style="width:34%"><col style="width:7%"><col style="width:48%"><col style="width:11%"></colgroup>
      <thead><tr><th>Stage</th><th>Done</th><th>Remarks</th><th>Link</th></tr></thead>
      <tbody>${rows.map(s=>`<tr class="${s.done?'done-row':''}"><td>${s.num}. ${escapeHtml(s.name)}</td><td>${s.done?'✓':''}</td><td>${escapeHtml(s.remarks)}</td><td>${linkCell(s.link)}</td></tr>`).join('')}</tbody>
    </table>`;
  return `
    <div class="stage-pdf-cols">
      <div class="stage-pdf-col">${oneTable(left)}</div>
      <div class="stage-pdf-col">${oneTable(right)}</div>
    </div>`;
}

function orderDetailsPdfRowsPaired(rows) {
  let html = '';
  for (let i = 0; i < rows.length; i += 2) {
    const a = rows[i], b = rows[i+1];
    const zebra = (i/2)%2 ? 'zebra' : '';
    html += `<tr class="${zebra}">
      <td><b>${escapeHtml(a[0])}</b></td><td>${escapeHtml(a[1])}</td>
      <td><b>${b?escapeHtml(b[0]):''}</b></td><td>${b?escapeHtml(b[1]):''}</td>
    </tr>`;
  }
  return html;
}

async function toggleSorVisibility(version, visible) {
  const prevHidden = ST.hiddenSorVersions || [];
  const nextHidden = visible ? prevHidden.filter(v=>v!==version) : [...new Set([...prevHidden, version])];
  ST.hiddenSorVersions = nextHidden; // optimistic
  try {
    const res = await apiPost({action:'setHiddenSorVersions', versions: nextHidden, actingRole: ST.user.role});
    if (!res.ok) { ST.hiddenSorVersions = prevHidden; renderAdminSorVisibility(); toast(res.error||'Failed to update visibility', 'err'); return; }
    toast(`${version} is now ${visible?'visible':'hidden'} for users.`, 'ok');
  } catch(e) { ST.hiddenSorVersions = prevHidden; renderAdminSorVisibility(); toast(e.message||'Failed to update visibility', 'err'); }
}

async function testDbConnection() {
  const statusEl = document.getElementById('dbconn-status');
  statusEl.innerHTML = '<span class="spinner dark"></span> Testing…';
  const url = document.getElementById('dbconn-url').value.trim();
  try {
    const r = await fetch(`${url}?action=ping`, {redirect:'follow'});
    const txt = await r.text();
    const data = JSON.parse(txt);
    if (data.ok) {
      const verBadge = data.backendVersion
        ? `<span class="badge ${data.hasImageActions?'badge-ok':'badge-bad'}">${data.hasImageActions?'✓ Has image upload':'✗ No image upload — OLD deployment'}</span> <span class="text-xs text-muted">(${escapeHtml(data.backendVersion)})</span>`

      statusEl.innerHTML = `<span class="badge badge-ok">Connected</span> ${data.sorRows||0} SOR rows, ${data.estRows||0} estimates<br>${verBadge}`;
    } else {
      statusEl.innerHTML = `<span class="badge badge-bad">Error: ${escapeHtml(data.error||'Unknown')}</span>`;
    }
  } catch(e) {
    statusEl.innerHTML = `<span class="badge badge-bad">Failed: ${escapeHtml(e.message)}</span>`;
  }
}

function currentObFilteredList() {

    {key:'E-Tender', label:'📋 E-Tender'},
    {key:'Enquiry', label:'✉️ Enquiry'},
    {key:'', label:'❔ Not Categorized / Other'},
  ];
  const curStart = currentFYStart();
  let html = '';
  groups.forEach(g => {
    const items = sorted.filter(e => categoryOf(e) === g.key);

    // FY-based: collapsible groups, newest FY first; no-FY drafts at the bottom
    const fyMap = {};
    items.filter(e=>estimateFY(e)).forEach(e=>{ const fy=estimateFY(e); (fyMap[fy]=fyMap[fy]||[]).push(e); });

// ── Excel export: Order Book format (one row per estimate) ──
async function exportOrderBookExcel() {
  const list = currentObFilteredList();
  if (!list.length) { toast('No estimates to export', 'warn'); return; }
  toast('Building Order Book Excel…', 'ok', 1800);
  const XLSXmod = await ensureSheetJS();
  const wb = XLSXmod.utils.book_new();
  const sorted = [...list].sort((a,b)=> new Date(b.savedAt||0) - new Date(a.savedAt||0));

  const eTender = sorted.filter(e => ((e.progress&&e.progress.orderDetails&&e.progress.orderDetails.processedVia)||'') === 'E-Tender');
  const enquiry = sorted.filter(e => ((e.progress&&e.progress.orderDetails&&e.progress.orderDetails.processedVia)||'') === 'Enquiry');

  // First 3 sheets: CE (detailed, one row per estimate) format
  buildCeSheet(XLSXmod, wb, sorted, 'Overall');
  if (eTender.length) buildCeSheet(XLSXmod, wb, eTender, 'E-Tender');
  if (enquiry.length) buildCeSheet(XLSXmod, wb, enquiry, 'Enquiry');

  // Next 3 sheets: Intelligent (landscape card-grid) format
  XLSXmod.utils.book_append_sheet(wb, buildLandscapeSummarySheet(XLSXmod, sorted), 'Overall (Intelligent)');
  if (eTender.length) XLSXmod.utils.book_append_sheet(wb, buildLandscapeSummarySheet(XLSXmod, eTender), 'E-Tender (Intelligent)');
  if (enquiry.length) XLSXmod.utils.book_append_sheet(wb, buildLandscapeSummarySheet(XLSXmod, enquiry), 'Enquiry (Intelligent)');

  XLSXmod.writeFile(wb, `MSETCL_Order_Book_${todayISO()}.xlsx`, {cellStyles: true});
  toast('Order Book Excel ready', 'ok');
}

// ── CE format: one row per estimate, all Order Book columns (the original
// detailed sheet format, now reusable for Overall/E-Tender/Enquiry). ──
function buildCeSheet(XLSXmod, wb, estimates, sheetName) {
  const headers = ['Sr. No.','Estimate Name','Estimate No.'].concat(OB_COLS.map(c=>c[1]));
  let rows = [headers];
  estimates.forEach((e,i)=>{
    const od = (e.progress && e.progress.orderDetails) || {};
    rows.push([i+1, e.name, e.number||''].concat(OB_COLS.map(c=>od[c[0]]||'')));
  });
  rows = withMsetclTitleRow(rows, headers.length);
  const ws = XLSXmod.utils.aoa_to_sheet(rows);
  applySmartColWidths(ws, rows);
  applyRowStyles(ws, {1:'header'}, headers.length);
  styleMsetclTitleRow(ws, headers.length);
  XLSXmod.utils.book_append_sheet(wb, ws, sanitizeSheetName(sheetName));
}

// ── Builds the "intelligent" landscape grid: estimates arranged in a
// fixed-width card block (label | value pairs), several cards placed
// side-by-side across the sheet width, wrapping to new rows of cards —
// designed so an A4-landscape printout shows ~5-6 estimates per page. ──
function buildLandscapeSummarySheet(XLSXmod, estimates) {
  // ALL Order Book columns plus the most important progress-level facts
  // (Abstract total, Audited, Order Closed) — per spec, the intelligent
  // format must contain everything, not a curated subset.
  const CARD_FIELDS = [
    ['name','Estimate'], ['number','Number'],
    ['_finalTotal','Total Estimated Value'], ['_audited','Audited'], ['_orderClosed','Order Closed'],
    ...OB_COLS
  ];
  const CARDS_PER_ROW = 3; // 3 cards across fits A4 landscape comfortably at compact font
  const CARD_COL_WIDTH = 14; // label col
  const CARD_VAL_WIDTH = 20; // value col
  const GAP_COLS = 1;

  const rows = [];
  for (let i = 0; i < estimates.length; i += CARDS_PER_ROW) {
    const rowCards = estimates.slice(i, i+CARDS_PER_ROW);
    // Title row for this band of cards
    const titleRow = [];
    rowCards.forEach((e) => {
      titleRow.push(`${i + rowCards.indexOf(e) + 1}. ${e.name}`, '');
      titleRow.push(''); // gap col
    });
    rows.push(titleRow);
    // Field rows
    CARD_FIELDS.forEach(([key, label]) => {
      const fieldRow = [];
      rowCards.forEach((e) => {
        const od = (e.progress && e.progress.orderDetails) || {};
        let val;
        if (key==='name') val = e.name;
        else if (key==='number') val = (e.number||'—');
        else if (key==='_finalTotal') val = fmtINR(e.estimateType==='amc' ? (e.amcAmount||0) : (e.finalTotal||0));
        else if (key==='_audited') val = e.audited ? 'Yes' : 'No';
        else if (key==='_orderClosed') val = (e.progress && e.progress.orderClosed) ? 'Yes' : 'No';
        else val = od[key]||'—';
        fieldRow.push(label, val, '');
      });
      rows.push(fieldRow);
    });
    rows.push([]); // blank spacer row between bands
  }

  const colCount = CARDS_PER_ROW*3;
  const finalRows = withMsetclTitleRow(rows, colCount);

  const ws = XLSXmod.utils.aoa_to_sheet(finalRows);
  // Column widths: label/value/gap repeating per card
  const cols = [];
  for (let c=0;c<CARDS_PER_ROW;c++) cols.push({wch:CARD_COL_WIDTH},{wch:CARD_VAL_WIDTH},{wch:GAP_COLS*2});
  ws['!cols'] = cols;
  // Style: title rows (every (CARD_FIELDS.length+2)th row, offset by 1 for
  // the prepended MSETCL title row) get the section style
  const styleMap = {};
  const bandSize = CARD_FIELDS.length + 2; // title + fields + spacer
  for (let r=1; r<finalRows.length; r += bandSize) styleMap[r] = 'section';
  applyRowStyles(ws, styleMap, colCount);
  styleMsetclTitleRow(ws, colCount);
  return ws;
}

// ── PDF export shows ONLY the intelligent landscape multi-estimate format
// (per spec: "the pdf follows same rules and gives only the second, the
// intelligent one"). Font auto-scales down as estimate count grows so a
// full A4-landscape page stays readable rather than overflowing. ──
async function exportOrderBookPDF() {
  const list = currentObFilteredList();
  if (!list.length) { toast('No estimates to export', 'warn'); return; }
  const sorted = [...list].sort((a,b) => new Date(b.savedAt||0) - new Date(a.savedAt||0));
  const categoryOf = (e) => ((e.progress&&e.progress.orderDetails&&e.progress.orderDetails.processedVia)||'');
  const groups = [
    { items: sorted, label: 'All Estimates' },
    { items: sorted.filter(e => categoryOf(e)==='E-Tender'), label: 'E-Tender' },
    { items: sorted.filter(e => categoryOf(e)==='Enquiry'), label: 'Enquiry' },
  ].filter(g => g.items.length);
  // Portrait — vertical blocks per estimate (one per group section)
  const content = [];
  groups.forEach((g, gi) => {
    if (gi > 0) content.push({ text:'', pageBreak:'before' });
    content.push(pdfBand(`Order Book — ${g.label} (${g.items.length})`, 13, 'center'));
    g.items.forEach((e, i) => {
      const od = (e.progress && e.progress.orderDetails) || {};
      const rows = [
        ['Estimate Name', e.name||''], ['Estimate No.', e.number||''],
        ['Type', estimateTypeLabel(e.estimateType)],
        ['Total Value', fmtINR(e.estimateType==='amc'?(e.amcAmount||0):(e.finalTotal||0))],
        ['Audited', e.audited?'Yes':'No'],
        ['Order Closed', (e.progress&&e.progress.orderClosed)?'Yes':'No'],
      ].concat(OB_COLS.map(c => [c[1], od[c[0]]||'—']));
      content.push({ text:(i+1)+'. '+pdfText(e.name||'Untitled'), bold:true, fontSize:10, color:PDF_TXT, margin:[0,8,0,3] });
      content.push(pdfTableNode(null, rows, { starCol:(ci) => ci===1, fs:8, pageWidth:PDF_W_PORT }));
    });
  });
  toast('Building Order Book PDF…', 'ok', 8000);
  try {
    const pm = await ensurePdfMake();
    pm.createPdf(portraitDocDef(content)).download('Order_Book_'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('PDF downloaded', 'ok');
  } catch(err) {
    console.error('exportOrderBookPDF failed:', err);
    toast('PDF failed: '+(err&&err.message||'unknown error')+' — check console for details','err',7000);
  }
}

function renderAicChat() {

// ── Build compact catalog excerpts for the prompt — capped so the request
// stays small and fast. Prefers items from the latest SOR version. ──
function buildCatalogExcerpts() {
  const latest = resolveLatestVersion(visibleSorVersions());
  const sorItems = ST.sorCache.filter(it => !latest || it.version === latest).slice(0, 1200);
  const sorExcerpt = sorItems.map(it => `${it.item_no} | ${it.description} | ${it.uom} | ${it.rate} | ${it.section}`).join('\n');
  const nonSorExcerpt = ST.nonSorCache.slice(0, 400).map(it => `${it.item_no} | ${it.description} | ${it.uom} | ${it.rate} | ${it.section}`).join('\n');
  return {sorExcerpt, nonSorExcerpt};
}

async function sendAiCreatorRequest() {
  if (AIC.busy) return;
  await ensureSorLoaded();
  const input = document.getElementById('aic-input');
  const text = input.value.trim();
  if (!text) { toast('Describe what you need first.', 'warn'); return; }
  AIC.messages.push({role:'user', text});
  input.value = '';
  renderAicChat();

  AIC.busy = true;
  const btn = document.getElementById('aic-send-btn');
  const origHtml = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Thinking…';
  AIC.messages.push({role:'assistant', text:'Drafting your estimate…'});
  renderAicChat();

  try {
    let draftResult;
    if (ST.aiKeyConfigured) {
      draftResult = await fetchAiDraftFromBackend(text);
    } else {
      draftResult = freeLocalDraftMatch(text);
    }
    AIC.messages.pop(); // remove "Drafting…" placeholder
    if (!draftResult.ok) {
      AIC.messages.push({role:'assistant', text: explainBackendError(draftResult.error)||'Could not generate a draft.'});
      renderAicChat();
      return;
    }
    AIC.draftItems = draftResult.items;
    AIC.draftExplanation = draftResult.explanation;
    AIC.messages.push({role:'assistant', text: AIC.draftExplanation || `Drafted ${AIC.draftItems.length} item(s) — review below.`});
    renderAicChat();
    renderAicDraft();
  } catch(e) {
    AIC.messages.pop();
    AIC.messages.push({role:'assistant', text: e.message||'Request failed.'});
    renderAicChat();
  } finally {
    AIC.busy = false;
    btn.disabled = false; btn.innerHTML = origHtml;
  }
}

async function fetchAiDraftFromBackend(text) {
  const excerpts = buildCatalogExcerpts();
  const res = await apiPost({
    action:'aiCreateEstimateDraft', userId: ST.user.id, role: ST.user.role,
    requestText: text, sorExcerpt: excerpts.sorExcerpt, nonSorExcerpt: excerpts.nonSorExcerpt
  });
  if (!res.ok) return res;
  const items = (res.items||[]).map(it => ({
    item_no: it.item_no||uid('AI'), description: it.description||'', uom: it.uom||'Nos',
    rate: parseFloat(it.rate)||0, qty: parseFloat(it.qty)||1,
    section: ['supply','project','om'].includes(it.section) ? it.section : 'supply',
    source: it.source||'estimated', remark: it.remark||'', isCustom: it.source!=='sor'
  }));
  return {ok:true, items, explanation: res.explanation||''};
}

// ══════════════════════════════════════════════════════════════
// FREE LOCAL MATCHER — zero-cost fallback used whenever no Anthropic API
// key is configured. Tokenizes the request, extracts a requested quantity
// per recognizable phrase, and scores SOR/Non-SOR descriptions by word
// overlap. Far less capable than real AI at understanding intent, but
// works entirely offline with no ongoing fees.
// ══════════════════════════════════════════════════════════════
const AIC_STOPWORDS = new Set(['the','a','an','for','of','to','and','with','in','on','at','is','are','i','need','want',
  'please','estimate','required','require','requirement','this','that','these','those','plus','also']);

function tokenizeForMatch(text) {
  return text.toLowerCase().replace(/[^a-z0-9.\s]/g,' ').split(/\s+/).filter(w=>w && !AIC_STOPWORDS.has(w));
}

// Splits the request into rough "clauses" (by comma / "and" / newline) so
// each clause can be matched against the catalog independently — this is
// what lets "24 battery cells, plus installation services" become two
// separate line items instead of one blended search.
function splitIntoRequestClauses(text) {
  return text.split(/,|;|\n|\band\b|\bplus\b/i).map(s=>s.trim()).filter(Boolean);
}

// Extracts a leading quantity number from a clause if present (e.g. "24 battery cells" -> 24)
function extractQuantity(clause) {
  const m = clause.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 1;
}

function scoreItemAgainstTokens(item, tokens) {
  const itemTokens = tokenizeForMatch(item.description);
  let score = 0;
  tokens.forEach(t => {
    if (itemTokens.includes(t)) score += 2;
    else if (itemTokens.some(it => it.includes(t) || t.includes(it))) score += 1;
  });
  return score;
}

function freeLocalDraftMatch(requestText) {
  const clauses = splitIntoRequestClauses(requestText);
  if (!clauses.length) return {ok:false, error:'Could not parse any items from that request.'};

  const catalog = allSelectableItems ? allSelectableItems() : ST.sorCache.concat(ST.nonSorCache.map(it=>({...it, version:'NONSOR'})));
  const items = [];
  const unmatchedClauses = [];

  clauses.forEach(clause => {
    const qty = extractQuantity(clause);
    const tokens = tokenizeForMatch(clause);
    if (!tokens.length) return;
    let best = null, bestScore = 0;
    catalog.forEach(it => {
      const s = scoreItemAgainstTokens(it, tokens);
      if (s > bestScore) { bestScore = s; best = it; }
    });
    if (best && bestScore >= 2) {
      items.push({
        item_no: best.item_no, description: best.description, uom: best.uom, rate: best.rate,
        qty, section: best.section, source: best.version==='NONSOR' ? 'nonsor' : 'sor', remark: ''
      });
    } else {
      unmatchedClauses.push(clause);
    }
  });

  unmatchedClauses.forEach(clause => {
    const qty = extractQuantity(clause);
    items.push({
      item_no: uid('FREE'), description: clause.replace(/^\d+(\.\d+)?\s*/,'').trim() || clause,
      uom: 'Nos', rate: 0, qty, section: 'supply', source: 'estimated',
      remark: 'No catalog match found by the free local matcher (no AI configured) — rate needs manual entry. Enable an Anthropic API key in Admin Panel for better matching.'
    });
  });

  if (!items.length) {
    return {ok:false, error:"Couldn't match anything in your request to the catalog. Try being more specific, or ask an admin to enable AI Estimate Creator's API key for better understanding."};
  }
  const explanation = `Free local matching (no AI configured): matched ${items.filter(i=>i.source!=='estimated').length} item(s) from your catalog by keyword, ${items.filter(i=>i.source==='estimated').length} item(s) need manual review. For better natural-language understanding, an admin can enable AI Estimate Creator's API key in Admin Panel.`;
  return {ok:true, items, explanation};
}

function onAicDraftQtyInput(idx, val) {
  const q = parseFloat(val);
  AIC.draftItems[idx].qty = isNaN(q) ? 0 : q;
}
function aicStepQty(idx, delta) {
  const cur = parseFloat(AIC.draftItems[idx].qty) || 0;
  AIC.draftItems[idx].qty = Math.max(0, +(cur + delta).toFixed(2));
  const inputs = document.querySelectorAll('#aic-draft-zone .qty-input');
  if (inputs[idx]) inputs[idx].value = AIC.draftItems[idx].qty;
  const row = inputs[idx] ? inputs[idx].closest('tr') : null;

}

async function aicZestUpload(evt){
  const file = evt.target.files[0]; evt.target.value='';
  if (!file) return;
  toast('Reading ZEST03…','ok',1500);
  try {
    await Promise.all([ensureSorLoaded(), ensureNonSorLoaded()]);
    const X = await ensureSheetJS();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    let name = wb.SheetNames.find(n=>/zest\s*0?3/i.test(n));
    if (!name) name = wb.SheetNames.find(n=>{
      const g = X.utils.sheet_to_json(wb.Sheets[n], {header:1, blankrows:false, defval:''});
      return g.some(r=> r.some(c=>/Material\s*\/\s*Service No/i.test(String(c))) && r.some(c=>/^\s*PR\s*(No|Number)?\b/i.test(String(c))));
    });
    if (!name) name = wb.SheetNames[0];
    const grid = X.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:''});
    const parsed = feParseGrid(grid);
    const built = feBuild(parsed);
    const latest = resolveDefaultVersion();
    const items = []; let missing = 0;
    [['supply',built.supply],['project',built.project],['om',built.om]].forEach(([sec,arr])=>{
      arr.forEach(it=>{
        const price = Number(it.exworks)||0;
        const useLatest = (price===1 || price===0);
        let desc=it.desc||it.full, uom=it.uom, section=sec, source='sor', rate=price, remark='';
        const match = findCatalogMatch(String(it.matNo), latest);
        if (match && match.source==='sor') { desc=match.description||desc; uom=match.uom||uom; section=match.section||sec; rate=useLatest?(match.rate||0):price; }
        else if (match && match.source==='nonsor') { source='nonsor'; desc=match.description||desc; uom=match.uom||uom; section=match.section||sec; rate=useLatest?(match.rate||0):price; }
        else { source='estimated'; remark='Not in SOR/Non-SOR catalog — a Non-SOR entry may be needed'; missing++; }
        // Catalog descriptions stay authoritative; the ZEST03 full description
        // is carried alongside them, never merged into the short description.
        const fullDesc = String(it.desc||'').trim() ? String(it.full||'') : '';
        items.push({ item_no:String(it.matNo), description:desc, fullDescription:fullDesc, uom, qty:Number(it.qty)||1, rate, section, source, remark });
      });
    });
    if (!items.length) throw new Error('No classifiable items found in the ZEST03 sheet.');
    AIC.draftItems = items;
    // Carry the parsed sheet through to the created estimate, so opening it
    // later shows the ZEST03 under its Final Estimate section instead of an
    // empty panel. Same shape feUpload persists.
    AIC.draftZest03 = {
      meta: parsed.meta, items: parsed.items,
      grid: grid.length*(grid[0]||[]).length <= 8000 ? grid : null,   // cap very large sheets
      sheetLabel: ('Estimation _ ' + (parsed.meta.estNo || name)).slice(0, 31),
      savedAt: new Date().toISOString(),
    };
    AIC.draftMeta = {
      name: parsed.meta.estFor || ('Estimate ' + (parsed.meta.estNo||'')),
      number: parsed.meta.estNo || '', date: dfNormalise(parsed.meta.estDate),
      sorVersions: parsed.meta.sor ? [parsed.meta.sor] : [],
      pmoPrEntries: [
        {label:'Supply Material', number:(built.prNos.supply||'').trim()},
        {label:'ETC (Project Services)', number:(built.prNos.project||'').trim()},
        {label:'O&M Services', number:(built.prNos.om||'').trim()},
      ].filter(p=>p.number),
    };
    renderAicDraft();
    const dz = document.getElementById('aic-draft-zone'); if (dz) dz.scrollIntoView({behavior:'smooth'});
    toast(`Parsed ${items.length} item(s) from ZEST03${missing?` — ${missing} not in catalog`:''}. Review, then Confirm to create & list the estimate.`, missing?'warn':'ok', 7000);
  } catch(err){ console.error('aicZestUpload failed:', err); toast('ZEST03 read failed: '+(err.message||'error'),'err',7000); }
}
function aicConfirmCreate(){
  const missing = (AIC.draftItems||[]).filter(it=>it.source==='estimated');
  // ZEST03 / unlisted-estimate flow → ask before creating & listing
  if (AIC.draftMeta) {

    openModal(`

      <div class="flex gap-2 justify-end mt-2">

      </div>
    `);
    return;
  }

function confirmAicDraftToEstimate() {
  if (!AIC.draftItems || !AIC.draftItems.length) return;
  ST.currentEstimate = blankEstimate();
  if (AIC.draftMeta) {
    const m = AIC.draftMeta;
    if (m.name) ST.currentEstimate.name = m.name;
    if (m.number) ST.currentEstimate.number = m.number;
    if (m.date) ST.currentEstimate.date = m.date;
    if (m.sorVersions && m.sorVersions.length) ST.currentEstimate.sorVersions = m.sorVersions;
    if (m.pmoPrEntries && m.pmoPrEntries.length) ST.currentEstimate.pmoPrEntries = m.pmoPrEntries;
  }
  // Attach the ZEST03 so the estimate's own Final Estimate section reflects it.
  if (AIC.draftZest03) {
    ST.currentEstimate.progress = ST.currentEstimate.progress || defaultProgress();
    ST.currentEstimate.progress.zest03 = AIC.draftZest03;
  }
  ST.currentItems = AIC.draftItems.map(it => ({
    item_no: it.item_no, version: it.source==='sor' ? (resolveDefaultVersion()||'') : 'NONSOR',
    description: it.description, fullDescription: it.fullDescription||'',
    uom: it.uom, rate: it.rate, qty: it.qty,
    section: it.section, remarks: it.remark||'', isCustom: it.source!=='sor'
  }));
  const missing = AIC.draftItems.filter(it => it.source==='estimated');
  toast(`${ST.currentItems.length} item(s) carried into a new estimate — review and save.`, 'ok', 5000);
  navigateTo('estimate-new', {preserveItems: true});
  if (missing.length) setTimeout(()=> promptNonSorEntries(missing.map(m=>({...m}))), 600);
}

async function saveNonSorEntries(itemNos){
  const btn = document.getElementById('nse-save-btn');
  await withSaveStatus(btn, async ()=>{
    let added = 0;
    for (let i=0;i<itemNos.length;i++){
      const item = {
        item_no: itemNos[i],
        description: (document.getElementById('nse-desc-'+i)||{}).value||'',
        uom: (document.getElementById('nse-uom-'+i)||{}).value||'',
        section: (document.getElementById('nse-sec-'+i)||{}).value||'supply',
        rate: parseFloat((document.getElementById('nse-rate-'+i)||{}).value)||0,
        remarks: (document.getElementById('nse-rem-'+i)||{}).value||'',
      };
      try {
        const res = await apiPost({action:'addNonSOR', item});
        if (res.ok) {
          added++;
          if (!ST.nonSorCache.find(n=>n.item_no===item.item_no))
            ST.nonSorCache.push({...item, version:'NONSOR', addedBy:ST.user.id, addedAt:new Date().toISOString()});
        }
      } catch(e){}
    }
    closeModal();
    toast(`${added} item(s) added to the Non-SOR database.`, added?'ok':'warn');
  }, null);
}

async function dbUploadHandler(evt){
  const file = evt.target.files[0]; evt.target.value='';
  if (!file) return;
  toast('Reading sheet…','ok',1500);
  try {
    await Promise.all([ensureSorLoaded(), ensureNonSorLoaded()]);
    const X = await ensureSheetJS();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    const grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false, defval:''});
    let hIdx = grid.findIndex(r => r.some(c=>/(material\s*\/?\s*service\s*no|^item\s*no)/i.test(String(c).trim())));
    if (hIdx < 0) throw new Error('Header row with "Item No" (or "Material/Service No") not found.');
    const H = grid[hIdx].map(c=>String(c).trim());
    const ci = {
      mat:   H.findIndex(c=>/(material\s*\/?\s*service\s*no|^item\s*no)/i.test(c)),
      desc:  H.findIndex(c=>/description/i.test(c)),
      uom:   H.findIndex(c=>/^uom$|unit/i.test(c)),
      qty:   H.findIndex(c=>/quantity|qty/i.test(c)),
      price: H.findIndex(c=>/price|exworks|rate/i.test(c)),
      sec:   H.findIndex(c=>/section/i.test(c)),
      src:   H.findIndex(c=>/source/i.test(c)),
      rem:   H.findIndex(c=>/remark/i.test(c)),
    };
    const cell = (row, i)=> (i>=0 && row[i]!=null) ? String(row[i]).trim() : '';
    const normSec = (s)=>{ s=String(s||'').toLowerCase(); if(/etc|project/.test(s)) return 'project'; if(/o&m|om|service/.test(s)) return 'om'; if(/supply|material/.test(s)) return 'supply'; return ''; };
    const latest = resolveDefaultVersion();
    const items = [];
    for (let r=hIdx+1; r<grid.length; r++){
      const row = grid[r];
      const matNo = cell(row, ci.mat);
      if (!matNo) continue;
      // Skip template example / marker rows so a forgotten example never imports
      const rowText = row.map(x=>String(x==null?'':x)).join(' ');
      if (/‹EXAMPLE|EXAMPLE ROWS|EXAMPLE – delete|EXAMPLE — delete/i.test(rowText)) continue;
      // User-entered values from the sheet (may be blank)
      const uDesc = cell(row, ci.desc), uUom = cell(row, ci.uom), uSec = normSec(cell(row, ci.sec)), uSrc = cell(row, ci.sec>=0?ci.src:-1);
      const uRem = cell(row, ci.rem);
      let qty = parseFloat(row[ci.qty]); if (!qty || qty <= 0) qty = 1;   // blank/0 ⇒ 1
      const priceRaw = ci.price>=0 ? parseFloat(row[ci.price]) : NaN;
      const price = isNaN(priceRaw) ? 0 : priceRaw;
      const useLatest = (price===1 || price===0);                        // blank/Re1 ⇒ latest SOR rate
      // Catalog lookup: selected/base version → Non-SOR → older SOR versions.
      let desc='', uom='', section='', source='estimated', rate=price, remark='';
      const match = findCatalogMatch(matNo, latest);
      if (match) { desc=match.description; uom=match.uom; section=match.section; source=match.source; rate=useLatest?(match.rate||0):price; }
      // User-entered fields take precedence; catalog fills the gaps; classify last.
      const inCatalog = !!match;
      const finalSource = inCatalog ? source : (uSrc ? (/non/i.test(uSrc)?'nonsor':'sor') : 'estimated');
      // For items ALREADY in the catalog, the stored Description / UoM / Section /
      // Rate are authoritative and are NEVER overwritten by sheet entries. User
      // input only supplies values for items the catalog doesn't have.
      const finalDesc    = inCatalog ? desc    : (uDesc || desc);
      const finalUom     = inCatalog ? uom     : (uUom || uom);
      const finalSection = inCatalog ? (section || feClassify(matNo) || 'supply')
                                     : (uSec || feClassify(matNo) || 'supply');
      // Rate: catalog rate stands (Re-1/blank ⇒ that rate). Only for non-catalog
      // items does a typed rate apply.
      const finalRate = inCatalog ? rate : (!isNaN(priceRaw) && price>1 ? price : rate);
      if (!inCatalog) remark = uRem || 'Not in catalog — will be offered as a Non-SOR entry';
      items.push({ item_no:matNo, description:finalDesc, uom:finalUom, qty, rate:finalRate,
                   section:finalSection, source:finalSource, remark });
    }
    if (!items.length) throw new Error('No item rows found in the sheet.');
    AIC.draftItems = items; AIC.draftExplanation = '';
    renderAicDraft();
    const dz = document.getElementById('aic-draft-zone'); if (dz) dz.scrollIntoView({behavior:'smooth'});
    const missing = items.filter(i=>i.source==='estimated').length;
    toast(`Loaded ${items.length} item(s)${missing?` — ${missing} not in catalog`:''}. Review and confirm.`, missing?'warn':'ok', 6000);
  } catch(err){ console.error('dbUploadHandler failed:', err); toast('Upload failed: '+(err.message||'error'),'err',7000); }
}

// ── Keyword-based column detection: normalizes each header, scores it
// against every field's keyword list, picks the best unambiguous match.
// Each header maps to at most one field; each field gets at most one
// header (first-best-match-wins, in header order). ──
function detectSmartFillMapping(headers) {
  const mapping = {}; // field -> header
  const usedHeaders = new Set();
  Object.keys(SF_FIELD_KEYWORDS).forEach(field => {
    const keywords = SF_FIELD_KEYWORDS[field];
    let best = null, bestScore = 0;
    headers.forEach(h => {
      if (usedHeaders.has(h)) return;
      const norm = h.toLowerCase().trim();
      keywords.forEach(kw => {
        if (norm.includes(kw) && kw.length > bestScore) { best = h; bestScore = kw.length; }
      });
    });
    if (best) { mapping[field] = best; usedHeaders.add(best); }
  });
  return mapping;
}

// INIT
// ══════════════════════════════════════════════════════════════
// ===== Final Estimate (ZEST03) module =====
// ════════════════════════════════════════════════════════════════════════
// FINAL ESTIMATE AS PER ESTIMATION NUMBER  (ZEST03 → full website estimate)
// Compliance flow: ZEST01 generates the estimate + Estimation Number; ZEST03
// provides section-wise EX-WORKS rates for Supply / ETC / O&M. This page
// classifies each ZEST03 row by its Material/Service number, builds a
// synthetic estimate, and runs it through the WEBSITE'S OWN calculation
// engine (abstractSheetRows / sectionItemTableRows / exportEstimateExcel /
// exportEstimatePDF) — so every subtotal, charge and total is identical to a
// normal website estimate. Classification (Type M/S ignored):
//   • Supply Material      → starts with 5, 9 digits
//   • Project Services ETC → starts with 3, 9 digits
//   • O&M Services         → starts with 5, 8 digits
// ════════════════════════════════════════════════════════════════════════
const FE = {
  parsed:null, result:null,
  estimateType:'project', acSupply:true, acProject:true, supplySpares:false,
  trLine:false, landCompPct:15, division:'',
};

function feClassify(matNo){
  const s = String(matNo==null?'':matNo).replace(/\D/g,'');
  if (s.length===9 && s[0]==='5') return 'supply';
  if (s.length===9 && s[0]==='3') return 'project';
  if (s.length===8 && s[0]==='5') return 'om';
  return null;
}

// ── Parse the raw sheet grid (array of arrays) into meta + item rows ──
function feParseGrid(grid){
  const norm = (v)=> String(v==null?'':v).trim();
  let hIdx = -1;
  for (let i=0;i<grid.length;i++){
    const row = grid[i].map(norm);
    if (row.some(c=>/^PR No/i.test(c)) && row.some(c=>/Material\s*\/\s*Service No/i.test(c))) { hIdx=i; break; }
  }
  if (hIdx===-1) throw new Error('Could not find the ZEST03 header row (needs "PR No" and "Material/Service No").');
  const header = grid[hIdx].map(norm);
  const find = (re)=> header.findIndex(c=>re.test(c));
  const col = {
    pr:find(/^\s*PR\s*(No|Number)?\b/i), mat:find(/Material\s*\/\s*Service No/i), desc:find(/Mat\s*\/?\s*Serv Description/i),
    full:find(/Full Description/i), uom:find(/^UoM$/i), qty:find(/Quantity/i),
    ex:find(/Exworks Price/i), tot:find(/Total Ex-?works/i),
  };
  const meta = { estFor:'', estNo:'', estDate:'', sor:'', pg:'' };
  for (let i=0;i<hIdx;i++){
    grid[i].forEach(cell=>{
      const s = norm(cell);
      if (/^Estimation For:/i.test(s)) meta.estFor = s.replace(/^Estimation For:\s*/i,'');
      else if (/^Estimation Number:/i.test(s)) meta.estNo = s.replace(/^Estimation Number:\s*/i,'');
      else if (/^Estimation Date:/i.test(s)) meta.estDate = s.replace(/^Estimation Date:\s*/i,'');
      else if (/^SOR Number:/i.test(s)) meta.sor = s.replace(/^SOR Number:\s*/i,'');
      else if (/^Purchasing Group:/i.test(s)) meta.pg = s.replace(/^Purchasing Group:\s*/i,'');
    });
  }
  const items = [];
  for (let i=hIdx+1;i<grid.length;i++){
    const row = grid[i];
    const matNo = col.mat>=0 ? norm(row[col.mat]) : '';
    if (!matNo) continue;
    const qty = col.qty>=0 ? (parseFloat(row[col.qty])||0) : 0;
    const ex  = col.ex>=0  ? (parseFloat(row[col.ex])||0)  : 0;
    items.push({
      pr: col.pr>=0 ? norm(row[col.pr]) : '', matNo,
      desc: col.desc>=0 ? norm(row[col.desc]) : '',
      full: col.full>=0 ? norm(row[col.full]) : '',
      uom:  col.uom>=0 ? norm(row[col.uom]) : '',
      qty, exworks: ex,
    });
  }
  return { meta, items };
}
function feBuild(parsed){
  const groups = { supply:[], project:[], om:[], notFound:[] };
  parsed.items.forEach(it=>{ const sec=feClassify(it.matNo); it.section=sec; (sec?groups[sec]:groups.notFound).push(it); });
  const prList = (arr)=> [...new Set(arr.map(x=>x.pr).filter(Boolean))].map(p=>String(p).replace(/,/g,'')).join(' / ');
  return { meta:parsed.meta, supply:groups.supply, project:groups.project, om:groups.om, notFound:groups.notFound,
    prNos:{ supply:prList(groups.supply), project:prList(groups.project), om:prList(groups.om) } };
}

// ── Auto-fill PMO / PR Numbers from the uploaded ZEST03 ───────────────────
// ZEST03 carries a PR No. per line, so the section PR numbers are already
// known the moment the sheet is read — no reason to make anyone retype them.
// Matching mirrors pmoPrForSection() so an entry filled here is the same one
// the exporters later read back. Sections are claimed in a fixed order
// (Supply → ETC → O&M) and an index is never claimed twice: "ETC (Project
// Services)" contains the word "Services", so O&M would otherwise steal it.
function feFillPmoPrFromZest03(e, prNos, meta){
  if (!e) return {filled:0, changed:[], dropped:[]};
  if (!Array.isArray(e.pmoPrEntries)) e.pmoPrEntries = defaultPmoPrEntries();
  prNos = prNos || {}; meta = meta || {};

  // Fixed display sequence. Entries with no value are SKIPPED, so the ones
  // that follow move up — there are never blank gaps in the middle.
  const estNo   = String(meta.estNo||'').trim();
  // fmtDate leaves an already-formatted value untouched, so this is safe
  // whether the date came from an ISO estimate or from an uploaded ZEST03.
  const estDate = fmtDate(String(meta.estDate||'').trim());
  const SEQUENCE = [
    {key:'supply',  label:'Supply PR',                 value:String(prNos.supply ||'').trim()},
    {key:'project', label:'Project Services PR',       value:String(prNos.project||'').trim()},
    {key:'om',      label:'O&M Services PR',           value:String(prNos.om     ||'').trim()},
    {key:'estzest', label:'Estimation Number with Date',
                    value:estNo ? (estDate ? `${estNo} dt. ${estDate}` : estNo) : ''},
    {key:'estno',   label:'Estimate Number with Date',
                    value:(()=>{ const n=String(e.number||'').trim(); if(!n) return '';
                                 const d=fmtDate(e.date); return d ? `${n} dt. ${d}` : n; })()},
  ];

  // Reuse a label the user typed themselves for a section rather than
  // renaming it under them; otherwise use the canonical label above.
  const SECTION_KEYS = {supply:['supply'], project:['project','etc'], om:['o&m','om','service']};
  const prior = e.pmoPrEntries.filter(p=> p && (String(p.label||'').trim() || String(p.number||'').trim()));
  const claimed = new Set();
  const labelFor = (sec)=>{
    const kws = SECTION_KEYS[sec.key];
    if (!kws) return sec.label;
    const hit = prior.find(p=> !claimed.has(p) && !isPmoReferenceLabel(p.label)
                            && kws.some(k=> String(p.label).toLowerCase().includes(k)));
    if (hit) { claimed.add(hit); return String(hit.label).trim(); }
    return sec.label;
  };

  const auto = [], changed = [];
  SEQUENCE.forEach(sec=>{
    if (!sec.value) return;                                  // not available → skip entirely
    const label = labelFor(sec);
    const was = prior.find(p=> String(p.label||'').trim().toLowerCase() === label.toLowerCase());
    const before = was ? String(was.number||'').trim() : '';
    if (was) claimed.add(was);
    if (before !== sec.value) changed.push({label, from:before, to:sec.value});
    auto.push({label, number:sec.value});
  });

  // Keep anything the user added that the sequence didn't cover, in its
  // original order, after the auto-filled block.
  const autoLabels = new Set(auto.map(a=>a.label.toLowerCase()));
  const manual = prior.filter(p=> !claimed.has(p) && !autoLabels.has(String(p.label||'').trim().toLowerCase()));

  const dropped = [];
  let merged = auto.concat(manual);
  if (merged.length > PMO_PR_SLOTS) {
    dropped.push(...merged.slice(PMO_PR_SLOTS).map(p=>p.label||p.number));
    merged = merged.slice(0, PMO_PR_SLOTS);
  }
  while (merged.length < PMO_PR_SLOTS) merged.push({label:'', number:''});
  e.pmoPrEntries = merged;

  return {filled:auto.length, changed, dropped};
}
// "Estimation Number with Date" / "Estimate Number" are reference numbers, not
// section PRs — they must never be claimed as a section's PR by keyword match.
function isPmoReferenceLabel(label){
  return /^\s*estimat(e|ion)\b/i.test(String(label||''));
}

// ── Build a synthetic estimate + items so the website engine can price it ──
// When launched from within an estimate (embedded mode), FE.baseEstimate holds
// that estimate's charge settings — type, AC toggles, PV/contingencies/centages,
// Tr.Line — so the Final Estimate is priced EXACTLY as that estimate would be.
// SoR membership + Non-SOR reference, resolved from the loaded catalogs.
function feIsSorItem(matNo){
  const cache = ST.sorCache;
  // The SOR catalog loads asynchronously under lite boot. If it has not
  // arrived yet, an empty cache would mark EVERY item Non-SoR — which then
  // paints the whole Supply sheet yellow and sweeps every item into the
  // Non-SOR sheets. Treat "catalog not loaded" as SoR, the prior behaviour,
  // and let the real check run once the catalog is present.
  if (!cache || !cache.length) return true;
  const id = String(matNo||'');
  return cache.some(x => String(x.item_no) === id);
}
function feNonSorRemark(matNo){
  const id = String(matNo||'');
  const ns = (ST.nonSorCache||[]).find(x => String(x.item_no) === id);
  return ns ? (ns.remarks || '') : '';
}

function feBuildSyntheticEstimate(){
  const res = FE.result, m = res.meta;
  const mk = (arr, section)=> arr.map(it=>({
    section, item_no:String(it.matNo), description:it.desc||it.full, uom:it.uom,
    // ZEST03's "Mat / Serv Full Description", carried verbatim. Only suppressed
    // when the short description column was empty and already fell back to it.
    fullDescription: String(it.desc||'').trim() ? String(it.full||'') : '',
    qty:it.qty, rate:it.exworks,
    // SoR status must be looked up, not assumed. Every ZEST03 item was
    // previously flagged isCustom:false, so genuine Non-SOR materials printed
    // as "SoR" in the Item's SoR Status column. An item counts as SoR only if
    // it actually exists in the SOR catalog.
    isCustom: !feIsSorItem(it.matNo),
    // Reference/remarks for Non-SOR items come from the Non-SOR catalog.
    remarks: feNonSorRemark(it.matNo),
  }));
  const items = [].concat(mk(res.supply,'supply'), mk(res.project,'project'), mk(res.om,'om'));
  let est;
  if (FE.baseEstimate) {
    // inherit charges from the estimate this ZEST03 belongs to; keep ZEST03 metadata
    const b = FE.baseEstimate;
    est = {
      id:'', name:(m.estFor||b.name||('Final Estimate '+(m.estNo||''))).slice(0,120),
      number:m.estNo||b.number||'', date:dfNormalise(m.estDate||b.date||''),
      settings:Object.assign({}, b.settings, {zest03:{estNo:m.estNo||'', estDate:dfNormalise(m.estDate)}}),
      division:b.division||'', work:m.estFor||b.work||'', sorVersions:m.sor?[m.sor]:(b.sorVersions||[]),
      estimateType:b.estimateType||'project', amcAmount:0, finalTotal:0,
      addCharge:b.addCharge||{}, settings:b.settings||{}, pmoPrEntries:[], progressImages:[],
      trLineMode:!!b.trLineMode, landCompChargePct:b.landCompChargePct||15, supplySpares:!!b.supplySpares,
    };
  } else {
    est = {
      id:'', name:(m.estFor||('Final Estimate '+(m.estNo||''))).slice(0,120), number:m.estNo||'', date:dfNormalise(m.estDate),
      settings:{zest03:{estNo:m.estNo||'', estDate:dfNormalise(m.estDate)}},
      division:FE.division||'', work:m.estFor||'', sorVersions:m.sor?[m.sor]:[],
      estimateType:FE.estimateType, amcAmount:0, finalTotal:0,
      addCharge:{ supply:FE.acSupply?'yes':'no', project:FE.acProject?'yes':'no', nonsor_supply:'no' },
      settings:{}, pmoPrEntries:[], progressImages:[],
      trLineMode:!!FE.trLine, landCompChargePct:FE.landCompPct||15, supplySpares:!!FE.supplySpares,
    };
  }
  // PR numbers ALWAYS come from the ZEST03 sheet itself (authoritative),
  // and print on each section tab + in the abstract.
  const pr = res.prNos || {};
  est.pmoPrEntries = [
    {label:'Supply Material', number:(pr.supply||'').trim()},
    {label:'ETC (Project Services)', number:(pr.project||'').trim()},
    {label:'O&M Services', number:(pr.om||'').trim()},
  ].filter(p=>p.number);
  // AMC: the limit is the total of all priced items
  if (est.estimateType==='amc') {
    est.amcAmount = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.rate)||0), 0);
  }
  return { est, items };
}
// Run cb() with the synthetic estimate installed (sync), then restore.
function feWithSynthetic(cb){
  const savedE = ST.currentEstimate, savedI = ST.currentItems, savedR = ST.chargeRates;
  const { est, items } = feBuildSyntheticEstimate();
  ST.currentEstimate = est; ST.currentItems = items;
  if (FE.chargeOverrides) ST.chargeRates = Object.assign({}, savedR, FE.chargeOverrides);
  try { return cb(); } finally { ST.currentEstimate = savedE; ST.currentItems = savedI; ST.chargeRates = savedR; }
}

// Build an FE result straight from an estimate's own saved items (used when
// the estimate has no stored ZEST03 sheet).
function feBuildFromItems(items, e){
  const mk = (it)=>({ pr:'', matNo:String(it.item_no||''), desc:it.description||'',
                      full:it.fullDescription||it.full_description||'',
                      uom:it.uom||'', qty:Number(it.qty)||0, exworks:Number(it.rate)||0 });
  const g = { supply:[], project:[], om:[] };
  (items||[]).forEach(it=>{
    const sec = String(it.section||'').toLowerCase();
    if (sec.indexOf('project')>-1 || sec==='etc') g.project.push(mk(it));
    else if (sec.indexOf('om')>-1 || sec.indexOf('o&m')>-1 || sec.indexOf('service')>-1) g.om.push(mk(it));
    else g.supply.push(mk(it));
  });
  const prOf = (keys)=>{
    const hit = (e.pmoPrEntries||[]).find(p=>p.number && keys.some(k=>String(p.label||'').toLowerCase().includes(k)));
    return hit ? String(hit.number).replace(/,/g,'') : '';
  };
  return { meta:{ estFor:e.work||e.name||'', estNo:e.number||'', estDate:e.date||'', sor:(e.sorVersions||[]).join(', '), pg:'' },
    supply:g.supply, project:g.project, om:g.om, notFound:[],
    prNos:{ supply:prOf(['supply']), project:prOf(['etc','project']), om:prOf(['o&m','om','service']) } };
}
async function feAdoptEstimate(id){
  // Switching estimates must fully reset the previous one — otherwise the old
  // items linger and only the charges change (the "mess" bug).
  FE.parsed = null; FE.result = null; FE.rawGrid = null; FE.rawSheetLabel = '';
  FE.colWidths = {}; FE.chargeOverrides = null; FE.attachRaw = false;
  if (!id){ FE.baseEstimate = null; FE.adoptedId = null; renderFinalEstimatePage(); return; }
  FE.adoptedId = id;
  showPageLoading('Loading estimate');
  try {
    const res = await api('getEstimate', {id, userId:ST.user.id, role:ST.user.role});
    if (!res.ok) { toast(res.error||'Could not load estimate','err'); renderFinalEstimatePage(); return; }
    const e = normalizeLoadedEstimate(res.estimate);
    const items = res.items || [];
    FE.baseEstimate = {
      name:e.name, number:e.number, date:e.date, division:e.division, work:e.work, sorVersions:e.sorVersions,
      estimateType:e.estimateType||'project', addCharge:e.addCharge||{}, settings:e.settings||{},
      pmoPrEntries:e.pmoPrEntries||[], trLineMode:!!e.trLineMode, landCompChargePct:e.landCompChargePct||15,
      supplySpares:!!e.supplySpares,
    };
    const z = e.progress && e.progress.zest03;
    if (z) {                       // prefer that estimate's own stored ZEST03
      FE.parsed = { meta:z.meta, items:z.items };
      FE.result = feBuild(FE.parsed);
      FE.rawGrid = z.grid || null;
      FE.rawSheetLabel = z.sheetLabel || 'ZEST03';
      FE.colWidths = z.colWidths || {};
    } else {                       // otherwise use the estimate's own items
      FE.result = feBuildFromItems(items, e);
      FE.parsed = { meta:FE.result.meta, items:[] };
    }
    renderFinalEstimatePage();
    toast(`Loaded "${e.name||'estimate'}" — ${z?'stored ZEST03':'its own items'} with its own charges.`,'ok',5000);
  } catch(err){
    console.error('feAdoptEstimate failed:', err);
    toast('Failed to load estimate: '+(err.message||'error'),'err',6000);
    renderFinalEstimatePage();
  }
}
